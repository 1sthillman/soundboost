<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kor Vadisi — Yanardağ Manzarası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-display:'Fraunces',serif;
    --font-ui:'Space Grotesk',sans-serif;
    --bg0:#03050a;--bg1:#12191c;--ink:#f1ece6;--ink-dim:#8b8178;
    --a1:#e8935a;--a2:#5c7a52;--a3:#171310;--a4:#ff9d52;--accent:#ff9d52;--a5:#d7e878;--grain:.035;
  }
  /* Kor Vadisi — bir vadinin ucunda, kadim ve hâlâ nefes alan bir yanardağ.
     Eteklerinde sisli bir orman, tabanında sakin bir göl. Gece boyunca
     kraterden yükselen kor, ormanı aydınlatan ateş böcekleri ve rüzgârın
     ağaçlarda bıraktığı hışırtı bu vadiyi diri tutar. Dağ yavaşça "nefes
     alır" — kor parlaklığı, alçak frekanslı uğultuyla birlikte kabarır
     ve söner. */
  [data-theme="korvadisi"]{--bg0:#03050a;--bg1:#12191c;--ink:#f1ece6;--ink-dim:#8b8178;--a1:#e8935a;--a2:#5c7a52;--a3:#171310;--a4:#ff9d52;--accent:#ff9d52;--a5:#d7e878;--grain:.035;}
  [data-theme="korvadisi"][data-mode="light"]{--bg0:#efe1d0;--bg1:#f7ede0;--ink:#2b211b;--ink-dim:#8a7669;--a1:#c9683a;--a2:#5c7a52;--a3:#e7d5c1;--a4:#c9683a;--accent:#c9683a;--a5:#a9b667;--grain:.014;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{-webkit-tap-highlight-color:transparent;width:100%;height:100%;overflow:hidden;}
  body{display:flex;font-family:var(--font-ui);background:var(--bg0);}
  .phone{position:fixed;inset:0;width:100%;height:100%;color:var(--ink);transition:color 1.1s ease;overflow:hidden;}
  .screen{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -10%, var(--bg1), var(--bg0) 65%);padding:env(safe-area-inset-top) 18px 0 18px;display:flex;flex-direction:column;gap:10px;height:100%;overflow-y:auto;transition:background 1.1s ease;}
  .grain{position:fixed;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:var(--grain,.03);z-index:5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:160px;transition:opacity .6s ease;}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 70px 10px rgba(0,0,0,.4);transition:box-shadow .6s ease;}
  [data-mode="light"] .vignette{box-shadow:inset 0 0 70px 10px rgba(0,0,0,.08);}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;flex-shrink:0;}
  .brand{font-family:var(--font-display);font-weight:600;font-style:italic;font-size:19px;letter-spacing:-0.01em;margin:0;color:var(--ink);}
  .topright{display:flex;align-items:center;gap:12px;}
  .meter{display:flex;align-items:flex-end;gap:2.5px;height:14px;}
  .meter i{display:block;width:2.5px;border-radius:1px;background:var(--accent);height:2px;transition:background 1.1s ease;opacity:.85;}
  .now{font-size:11px;color:var(--ink-dim);margin:0;font-variant-numeric:tabular-nums;transition:color 1.1s ease;}
  .modeToggle{background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;flex-shrink:0;}
  .modeSwitch{width:38px;height:20px;border-radius:20px;background:color-mix(in srgb, var(--ink) 18%, transparent);position:relative;transition:background 1.1s ease;flex-shrink:0;}
  .modeSwitch .thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--accent);transition:transform .35s cubic-bezier(.4,0,.2,1), background 1.1s ease;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4);}
  [data-mode="light"] .modeSwitch .thumb{transform:translateX(18px);}
  .modeSwitch .thumb svg{width:10px;height:10px;color:var(--bg0);}
  .stage{position:relative;border-radius:20px;overflow:hidden;flex:1;min-height:220px;max-height:360px;background:#000;z-index:2;transition:transform .05s ease-out, box-shadow .08s linear;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 18px 40px -14px rgba(0,0,0,.6),0 0 46px calc(var(--lvl, 0) * 34px) color-mix(in srgb, var(--accent) 40%, transparent);cursor:pointer;}
  canvas{display:block;width:100%;height:100%;}
  .stage-hint{position:absolute;inset:auto 0 13px 0;text-align:center;font-size:11px;color:var(--ink-dim);opacity:.9;pointer-events:none;letter-spacing:.01em;transition:opacity .5s ease, color 1.1s ease;}
  .track{margin-top:0;position:relative;z-index:2;flex-shrink:0;}
  .track h2{font-family:var(--font-display);font-weight:600;font-style:italic;font-size:20px;margin:0 0 2px;letter-spacing:-0.01em;transition:opacity .3s ease;}
  .track p{font-size:12px;color:var(--ink-dim);margin:0;transition:color 1.1s ease;}
  .transport{display:flex;align-items:center;gap:12px;position:relative;z-index:2;flex-shrink:0;padding-bottom:14px;}
  .playbtn{position:relative;width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 100%, white 25%), var(--accent) 70%);color:var(--bg0);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s ease, background 1.1s ease, box-shadow .1s linear;box-shadow:inset 0 2px 3px rgba(255,255,255,.35),inset 0 -3px 5px rgba(0,0,0,.25),0 4px 14px -2px color-mix(in srgb, var(--accent) 60%, transparent),0 0 0 calc(4px + var(--lvl, 0) * 14px) color-mix(in srgb, var(--accent) calc(8% + var(--lvl,0) * 22%), transparent);}
  .playbtn:active{transform:scale(.92);}
  .playbtn svg{width:20px;height:20px;position:relative;z-index:1;}
  .ripple{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--accent);opacity:0;pointer-events:none;}
  .ripple.go{animation:rippleOut .55s ease-out;}
  @keyframes rippleOut{0%{transform:scale(.7);opacity:.65;}100%{transform:scale(1.9);opacity:0;}}
  .sliders{flex:1;display:flex;flex-direction:column;gap:8px;}
  .slider-row{display:flex;align-items:center;gap:10px;}
  .slider-row label{font-size:11px;color:var(--ink-dim);width:64px;flex-shrink:0;transition:color 1.1s ease;}
  .slider-row .val{font-size:10px;color:var(--ink-dim);width:30px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;transition:color 1.1s ease;}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;background:color-mix(in srgb, var(--ink) 18%, transparent);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);transition:background 1.1s ease;}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);transition:background 1.1s ease;}
  @media (prefers-reduced-motion: reduce){.stage{transition:none;}.ripple.go{animation:none;}}
</style>
<base target="_blank">
</head>
<body>
<div class="phone" id="phone" data-theme="korvadisi" data-mode="dark">
  <div class="screen">
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="topbar">
      <p class="brand">Kor Vadisi</p>
      <div class="topright">
        <button class="modeToggle" id="modeToggle" aria-label="Gece / Alacakaranlık">
          <span class="modeSwitch"><span class="thumb" id="modeThumb"></span></span>
        </button>
        <div class="meter" id="meter"><i></i><i></i><i></i><i></i><i></i></div>
        <p class="now" id="clock">--:--</p>
      </div>
    </div>
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <p class="stage-hint" id="stageHint">Oynat'a basarak vadiyi uyandır</p>
    </div>
    <div class="track">
      <h2 id="trackTitle">Dağın Nefesi</h2>
      <p id="trackSub">Ateş böcekleri, rüzgâr ve uzak bir yanardağın sakin soluğu</p>
    </div>
    <div class="transport">
      <button class="playbtn" id="playBtn" aria-label="Oynat">
        <span class="ripple" id="ripple"></span>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="sliders">
        <div class="slider-row">
          <label for="wind">Rüzgâr</label>
          <input type="range" id="wind" min="0" max="100" value="40">
          <span class="val" id="windVal">40</span>
        </div>
        <div class="slider-row">
          <label for="ember">Kor</label>
          <input type="range" id="ember" min="0" max="100" value="55">
          <span class="val" id="emberVal">55</span>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const phone = document.getElementById('phone');
const stageEl = document.getElementById('stage');
const stageHint = document.getElementById('stageHint');
const windEl = document.getElementById('wind');
const emberEl = document.getElementById('ember');
const windVal = document.getElementById('windVal');
const emberVal = document.getElementById('emberVal');
const playBtn = document.getElementById('playBtn');
const rippleEl = document.getElementById('ripple');
const clockEl = document.getElementById('clock');
const meterBars = Array.from(document.querySelectorAll('#meter i'));
const modeToggle = document.getElementById('modeToggle');
const modeThumb = document.getElementById('modeThumb');

let W,H,DPR;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = canvas.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

function tickClock(){
  const d = new Date();
  clockEl.textContent = d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
tickClock(); setInterval(tickClock, 15000);

let shakeTimer = null;
function shakeStage(intensity){
  stageEl.style.transform = `translate(${(Math.random()-0.5)*intensity}px, ${(Math.random()-0.5)*intensity}px)`;
  clearTimeout(shakeTimer);
  shakeTimer = setTimeout(()=>{ stageEl.style.transform=''; }, 90);
}

const MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.4A9 9 0 1111.6 3a7 7 0 009.4 9.4z"/></svg>';
const DUSK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="14" r="4"/><path d="M4 20h16M2 14h2M20 14h2M5 8l1.5 1.5M19 8l-1.5 1.5M12 3v3"/></svg>';
let currentMode = 'dark';
function setMode(mode){
  currentMode = mode;
  phone.dataset.mode = mode;
  modeThumb.innerHTML = mode==='dark' ? MOON_ICON : DUSK_ICON;
}
modeToggle.addEventListener('click', ()=>{ setMode(currentMode === 'dark' ? 'light' : 'dark'); });

/* ============ SEEDED NOISE / FRACTAL TERRAIN ============ */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed>>>15, 1 | seed);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function midpointDisplace(n, roughness, rng){
  const len = Math.pow(2,n)+1;
  const arr = new Float32Array(len);
  arr[0] = rng()-0.5; arr[len-1] = rng()-0.5;
  let step = len-1, scale = 1;
  while(step>1){
    const half = step/2;
    for(let i=0;i<len-1;i+=step){
      const avg = (arr[i]+arr[i+step])/2;
      arr[i+half] = avg + (rng()-0.5)*scale;
    }
    step = half; scale *= roughness;
  }
  let mn=Infinity,mx=-Infinity;
  for(let i=0;i<len;i++){ if(arr[i]<mn)mn=arr[i]; if(arr[i]>mx)mx=arr[i]; }
  const range = (mx-mn)||1;
  for(let i=0;i<len;i++) arr[i] = (arr[i]-mn)/range;
  return arr;
}
function sampleArr(arr, p){
  p = Math.max(0, Math.min(1,p));
  const idx = p*(arr.length-1);
  const i0 = Math.floor(idx), i1 = Math.min(arr.length-1, i0+1);
  const f = idx-i0;
  return arr[i0]*(1-f) + arr[i1]*f;
}

const ridgeFarArr = midpointDisplace(7, 0.52, mulberry32(101));
const ridgeMidArr = midpointDisplace(7, 0.58, mulberry32(202));

function buildVolcanoProfile(){
  const detail = midpointDisplace(6, 0.5, mulberry32(303));
  const len = detail.length;
  const profile = new Float32Array(len);
  for(let i=0;i<len;i++){
    const p = i/(len-1);
    const c = (p-0.5)*2;
    const ap = Math.abs(c);
    let cone = Math.pow(Math.max(0,1-ap), 1.55);
    cone += (detail[i]-0.5)*0.045;
    if(ap<0.10){ cone -= (1-ap/0.10)*0.17; }
    profile[i] = Math.max(0, cone);
  }
  return profile;
}
const volcanoProfile = buildVolcanoProfile();
const VP_LEN = volcanoProfile.length;
const VP_MID = (VP_LEN-1)/2;

function buildLavaFlow(seed, startIdx){
  const rng = mulberry32(seed);
  const rimFrac = volcanoProfile[startIdx];
  const localX0 = startIdx/(VP_LEN-1);
  const steps = 7, pts = [];
  for(let s=0;s<=steps;s++){
    const tt = s/steps;
    const h = rimFrac*(1-tt*0.97);
    const lx = localX0 + (rng()-0.5)*0.10*tt + tt*tt*(rng()-0.5)*0.05;
    pts.push({h, lx});
  }
  return pts;
}
const lavaFlowA = buildLavaFlow(11, Math.round(VP_MID-5));
const lavaFlowB = buildLavaFlow(23, Math.round(VP_MID+6));

/* ============ LAYOUT CONSTANTS ============ */
const L = {
  ridgeFarBase:0.505, ridgeFarAmp:0.085,
  ridgeMidBase:0.565, ridgeMidAmp:0.125,
  volcCx:0.615, volcBase:0.615, volcH:0.40, volcW:0.50,
  waterTop:0.665,
  treesFarBase:0.685, treesFarHMin:0.055, treesFarHMax:0.10,
  treesNearBase:0.865, treesNearHMin:0.15, treesNearHMax:0.30,
  fireflyY0:0.60, fireflyY1:0.93,
  birdY0:0.15, birdY1:0.29,
};

/* ============ PRECOMPUTED SCENERY (trees, stars) ============ */
function makeTrees(count, seed){
  const rng = mulberry32(seed);
  const arr = [];
  for(let i=0;i<count;i++){
    arr.push({
      x: (i+0.5)/count + (rng()-0.5)*(0.85/count),
      hFrac: 0, wFrac: 0,
      phase: rng()*Math.PI*2,
      yJitter: (rng()-0.5)*0.02,
      sizeR: rng()
    });
  }
  return arr;
}
const treesFar = makeTrees(15, 55);
const treesNear = makeTrees(10, 66);
treesFar.forEach(t=>{ t.hFrac = L.treesFarHMin + t.sizeR*(L.treesFarHMax-L.treesFarHMin); t.wFrac = t.hFrac*0.85; });
treesNear.forEach(t=>{ t.hFrac = L.treesNearHMin + t.sizeR*(L.treesNearHMax-L.treesNearHMin); t.wFrac = t.hFrac*0.72; });

let stars = [];
function initStars(){
  const rng = mulberry32(7);
  stars = [];
  for(let i=0;i<95;i++){
    stars.push({ x:rng(), y:rng()*0.62, r:0.5+rng()*1.2, phase:rng()*Math.PI*2, speed:0.3+rng()*1.0, baseA:0.35+rng()*0.6 });
  }
}
initStars();

let fireflies = [];
function initFireflies(){
  const rng = mulberry32(909);
  fireflies = [];
  for(let i=0;i<32;i++){
    fireflies.push({
      bx: rng(), by: L.fireflyY0 + rng()*(L.fireflyY1-L.fireflyY0),
      phase: rng()*Math.PI*2, blinkSpeed: 0.5+rng()*1.2,
      driftPhase: rng()*Math.PI*2, speed: 0.12+rng()*0.3,
      ampX: 0.012+rng()*0.02, ampY: 0.01+rng()*0.016,
      size: 0.9+rng()*1.2
    });
  }
}
initFireflies();

/* ============ PALETTE - ENHANCED REALISM ============ */
const PALETTE = {
  night:{
    skyTop:'#010308', skyMid:'#0d1828', skyBottom:'#3d2618',
    ridgeFar:'#1a2838', ridgeMid:'#101619',
    volcanoBody:'#0d0a09', craterGlow:'#ff7a30', lava:'#ff5520', ember:'#ffaa55',
    smoke:'#554d45', mist:'#756b60',
    waterTop:'#1a322c', waterBottom:'#050b09', reflect:'#ff9950',
    treeFar:'#1a2e20', treeNear:'#060908',
    starColor:'#f2f6ff', bodyGlow:'#c5d8ea', bodyCore:'#fffbf5', silhouette:'#030504'
  },
  dusk:{
    skyTop:'#2a4060', skyMid:'#8a7080', skyBottom:'#f0a070',
    ridgeFar:'#95a0b8', ridgeMid:'#65707d',
    volcanoBody:'#2d2422', craterGlow:'#ffa860', lava:'#ff8040', ember:'#ffc580',
    smoke:'#d5c0b0', mist:'#f0e0cb',
    waterTop:'#d59a70', waterBottom:'#332a25', reflect:'#f0a070',
    treeFar:'#556548', treeNear:'#1a1d12',
    starColor:'#fffaea', bodyGlow:'#ffe5a0', bodyCore:'#fffae0', silhouette:'#1a1512'
  }
};
function hexToRgb(h){ 
  if(!h) return {r:255,g:255,b:255}; // Safety check
  h=h.replace('#',''); 
  return {r:parseInt(h.substring(0,2),16),g:parseInt(h.substring(2,4),16),b:parseInt(h.substring(4,6),16)}; 
}
function lerpRgb(h1,h2,tt){ 
  if(!h1 || !h2) return {r:255,g:255,b:255}; // Safety check
  const c1=hexToRgb(h1),c2=hexToRgb(h2); 
  return {r:c1.r+(c2.r-c1.r)*tt,g:c1.g+(c2.g-c1.g)*tt,b:c1.b+(c2.b-c1.b)*tt}; 
}
let modeMix = 0;
function pal(key, a){
  // Safety check for undefined keys
  if(!PALETTE.night[key] || !PALETTE.dusk[key]) {
    console.warn('Missing palette key:', key);
    return a===undefined ? 'rgb(255,255,255)' : `rgba(255,255,255,${Math.max(0,a)})`;
  }
  const c = lerpRgb(PALETTE.night[key], PALETTE.dusk[key], modeMix);
  if(a===undefined) return `rgb(${c.r|0},${c.g|0},${c.b|0})`;
  return `rgba(${c.r|0},${c.g|0},${c.b|0},${Math.max(0,a)})`;
}

/* ============ AUDIO ENGINE ============ */
let actx, analyser, freqData;
let master, bassShelf, lowpass, airShelf, comp, panner, panLfo, panLfoGain, fxGain;
let delay, delayFeedback, delayFilter, delayOut;
let lfo, lfoGain;
let droneOscs = [], droneLfos = [];
let noiseBuffer, windSrc, windFilter, windGain, windSwellLfo, windSwellGain;
let rumbleSrc, rumbleFilter, rumbleGain;
let chordIdx = 0, chordTimer = null;
let cricketHandle = null, birdAudioHandle = null;
let playing = false;
let windLevel = 0.4, emberLevel = 0.55;

const CHORDS = [
  [41.20, 61.74, 82.41, 123.47, 164.81],
  [36.71, 55.00, 73.42, 110.00, 146.83],
  [32.70, 49.00, 65.41, 98.00, 130.81],
  [43.65, 65.41, 87.31, 130.81, 174.61],
];
function makeNoiseBuffer(){
  const len = actx.sampleRate*2;
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  return buf;
}
function initAudio(){
  actx = new (window.AudioContext||window.webkitAudioContext)();
  analyser = actx.createAnalyser();
  analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.82;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  master = actx.createGain(); master.gain.value = 0.0001;
  bassShelf = actx.createBiquadFilter(); bassShelf.type='lowshelf'; bassShelf.frequency.value=180; bassShelf.gain.value=0;
  lowpass = actx.createBiquadFilter(); lowpass.type='lowpass'; lowpass.frequency.value=1000; lowpass.Q.value=0.5;
  airShelf = actx.createBiquadFilter(); airShelf.type='highshelf'; airShelf.frequency.value=4500; airShelf.gain.value=1.5;
  comp = actx.createDynamicsCompressor();
  comp.threshold.value=-22; comp.knee.value=24; comp.ratio.value=3; comp.attack.value=0.006; comp.release.value=0.25;
  panner = actx.createStereoPanner();
  panLfo = actx.createOscillator(); panLfo.frequency.value=0.04;
  panLfoGain = actx.createGain(); panLfoGain.gain.value=0.25;
  panLfo.connect(panLfoGain); panLfoGain.connect(panner.pan); panLfo.start();
  delay = actx.createDelay(1.6); delay.delayTime.value=0.5;
  delayFeedback = actx.createGain(); delayFeedback.gain.value=0.32;
  delayFilter = actx.createBiquadFilter(); delayFilter.type='lowpass'; delayFilter.frequency.value=1600;
  delay.connect(delayFilter); delayFilter.connect(delayFeedback); delayFeedback.connect(delay);
  delayOut = actx.createGain(); delayOut.gain.value=0.4;
  delay.connect(delayOut);
  fxGain = actx.createGain(); fxGain.gain.value=0.55;
  lowpass.connect(bassShelf); bassShelf.connect(airShelf); airShelf.connect(master);
  delayOut.connect(master); master.connect(comp); fxGain.connect(comp);
  comp.connect(panner); panner.connect(analyser); analyser.connect(actx.destination);
  lfo = actx.createOscillator(); lfo.frequency.value=0.025;
  lfoGain = actx.createGain(); lfoGain.gain.value=180;
  lfo.connect(lfoGain); lfoGain.connect(lowpass.frequency); lfo.start();
  noiseBuffer = makeNoiseBuffer();

  windSrc = actx.createBufferSource(); windSrc.buffer=noiseBuffer; windSrc.loop=true;
  windFilter = actx.createBiquadFilter(); windFilter.type='bandpass'; windFilter.frequency.value=650; windFilter.Q.value=0.55;
  windGain = actx.createGain(); windGain.gain.value=0.03+windLevel*0.11;
  windSwellLfo = actx.createOscillator(); windSwellLfo.frequency.value=0.07;
  windSwellGain = actx.createGain(); windSwellGain.gain.value=0.03;
  windSwellLfo.connect(windSwellGain); windSwellGain.connect(windGain.gain);
  windSrc.connect(windFilter); windFilter.connect(windGain); windGain.connect(lowpass);
  windSrc.start(); windSwellLfo.start();

  rumbleSrc = actx.createBufferSource(); rumbleSrc.buffer=noiseBuffer; rumbleSrc.loop=true;
  rumbleFilter = actx.createBiquadFilter(); rumbleFilter.type='lowpass'; rumbleFilter.frequency.value=95;
  rumbleGain = actx.createGain(); rumbleGain.gain.value=0.02+emberLevel*0.1;
  rumbleSrc.connect(rumbleFilter); rumbleFilter.connect(rumbleGain); rumbleGain.connect(bassShelf);
  rumbleSrc.start();

  buildDrone(CHORDS[0]);
  applyWind(); applyEmber();
}
function buildDrone(chord){
  droneOscs = []; droneLfos = [];
  chord.forEach((freq,i)=>{
    const o = actx.createOscillator();
    o.type = i===0 ? 'sine' : (i%2===0 ? 'triangle' : 'sine');
    o.frequency.value = i===0 ? freq/2 : freq;
    const g = actx.createGain();
    g.gain.value = i===0 ? 0.20 : 0.038;
    o.connect(g); g.connect(lowpass); o.start();
    droneOscs.push(o);
    if(i>0){
      const dl = actx.createOscillator(); dl.frequency.value = 0.018 + i*0.01;
      const dg = actx.createGain(); dg.gain.value = 2.2 + i*0.4;
      dl.connect(dg); dg.connect(o.detune); dl.start();
      droneLfos.push(dl);
    } else {
      const breathLfo = actx.createOscillator(); breathLfo.frequency.value = 0.055;
      const breathGain = actx.createGain(); breathGain.gain.value = 0.085;
      breathLfo.connect(breathGain); breathGain.connect(g.gain); breathLfo.start();
      droneLfos.push(breathLfo);
    }
  });
  const shimmer = actx.createOscillator(); shimmer.frequency.value=0.05;
  const shimmerGain = actx.createGain(); shimmerGain.gain.value=380;
  shimmer.connect(shimmerGain); shimmerGain.connect(delayFilter.frequency);
  shimmer.start(); droneLfos.push(shimmer);
}
function advanceChord(){
  chordIdx = (chordIdx+1) % CHORDS.length;
  const chord = CHORDS[chordIdx];
  const now = actx.currentTime;
  droneOscs.forEach((o,i)=>{
    if(chord[i]!==undefined){
      const target = i===0 ? chord[i]/2 : chord[i];
      o.frequency.linearRampToValueAtTime(target, now+3.0);
    }
  });
}
function chime(freq, gainMul){
  if(!actx) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator(); o.type='sine'; o.frequency.value=freq;
  const o2 = actx.createOscillator(); o2.type='triangle'; o2.frequency.value=freq*2.01;
  const g = actx.createGain(); const g2 = actx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.20*(gainMul||1), t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+1.6);
  g2.gain.setValueAtTime(0.0001,t0);
  g2.gain.exponentialRampToValueAtTime(0.05*(gainMul||1), t0+0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0+0.7);
  o.connect(g); o2.connect(g2); g.connect(fxGain); g2.connect(fxGain);
  const send = actx.createGain(); send.gain.value=0.4; g.connect(send); send.connect(delay);
  o.start(t0); o.stop(t0+1.7); o2.start(t0); o2.stop(t0+0.75);
}
function crackle(when, gainMul){
  if(!actx) return;
  const t0 = actx.currentTime + (when||0);
  const src = actx.createBufferSource(); src.buffer=noiseBuffer;
  const bp = actx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.setValueAtTime(2100+Math.random()*1300, t0); bp.Q.value=1.3;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.10*(gainMul||1), t0+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.14);
  src.connect(bp); bp.connect(g); g.connect(lowpass);
  src.start(t0); src.stop(t0+0.16);
}
function cricket(when, gainMul){
  if(!actx) return;
  const t0 = actx.currentTime + (when||0);
  const o = actx.createOscillator(); o.type='square'; o.frequency.value=3300+Math.random()*800;
  const bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3600; bp.Q.value=3;
  const g = actx.createGain(); g.gain.setValueAtTime(0.0001,t0);
  const pulses = 4+Math.floor(Math.random()*3);

    g.gain.exponentialRampToValueAtTime(0.03*(gainMul||1), tt+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, tt+0.03);
    tt += 0.05;
  }
  o.connect(bp); bp.connect(g); g.connect(lowpass);
  const send = actx.createGain(); send.gain.value=0.18; g.connect(send); send.connect(delay);

function birdCall(when, gainMul){

/* ============ ANALYSIS ============ */
let t = 0;
const BINS = 48;
let fluxHistory = [], beatCooldown = 0, prevBandFrame = null, smoothedEnergy = 0;
function getBars(boost){
  const bars = new Array(BINS).fill(0.02);
  if(!analyser){
    for(let i=0;i<BINS;i++) bars[i] = 0.03+0.015*Math.sin(t*0.5+i*0.4);
    return bars;
  }
  analyser.getByteFrequencyData(freqData);
  const usable = Math.floor(freqData.length*0.8);
  for(let i=0;i<BINS;i++){
    const p = i/BINS;
    const idx = Math.floor(Math.pow(p,1.35)*usable);
    bars[i] = Math.max(0.02,(freqData[idx]/255)*(boost||1));
  }
  return bars;
}
function bandAvg(bars,from,to){
  from=Math.max(0,from); to=Math.min(BINS,to);
  let s=0,n=0; for(let i=from;i<to;i++){s+=bars[i];n++;}
  return n? s/n : 0;
}
function analyze(bars, boost){
  const sub=bandAvg(bars,0,3), bass=bandAvg(bars,1,7), lowMid=bandAvg(bars,7,15),
        mid=bandAvg(bars,15,26), highMid=bandAvg(bars,26,36), treble=bandAvg(bars,36,46);
  const frameEnergy = (sub*1.3+bass)/2.3;
  smoothedEnergy += (frameEnergy-smoothedEnergy)*0.1;
  let flux=0;
  if(prevBandFrame){ for(let i=0;i<BINS;i++) flux += Math.max(0,bars[i]-prevBandFrame[i]); }
  prevBandFrame = bars.slice();
  fluxHistory.push(flux); if(fluxHistory.length>30) fluxHistory.shift();
  const avgFlux = fluxHistory.reduce((a,b)=>a+b,0)/fluxHistory.length;
  const sensitivity = 0.5+((boost-0.9)/1.0);
  const fluxThresh = avgFlux*(1.55-sensitivity*0.4)+0.6;
  let beat=false; beatCooldown=Math.max(0,beatCooldown-1);
  if(playing && beatCooldown===0 && flux>fluxThresh && frameEnergy>0.2){ beat=true; beatCooldown=8; }
  return {sub,bass,lowMid,mid,highMid,treble,energy:smoothedEnergy,flux,beat};
}
function updateMeter(bars){
  for(let i=0;i<5;i++){
    const v = bars[3+i*8]||0.03;
    meterBars[i].style.height = (2+v*13).toFixed(1)+'px';
    meterBars[i].style.opacity = (0.4+v*0.6).toFixed(2);
  }
}

let sparks = [];
function burst(cx,cy,n,colorVar,speed,life,opts){
  opts = opts||{};

    const ang = Math.random()*Math.PI*2;
    const sp = (speed||2)*(0.4+Math.random()*0.9);
    sparks.push({
      x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp - (opts.upBias||0),
      r:(opts.r0||1)+Math.random()*(opts.r1||2.2),
      life:1, decay:1/(life||40), color:colorVar,
      grav:opts.gravity||0, drag: opts.drag!==undefined?opts.drag:0.96
    });
  }
}
function drawSparks(){
  sparks.forEach(s=>{
    s.x+=s.vx; s.y+=s.vy; s.vy+=s.grav; s.vx*=s.drag; s.vy*=s.drag; s.life-=s.decay;
    ctx.beginPath(); ctx.arc(s.x,s.y,Math.max(0.2,s.r*s.life),0,7);
    ctx.shadowColor = pal(s.color); ctx.shadowBlur = 7;
    ctx.fillStyle = pal(s.color); ctx.globalAlpha = Math.max(0,s.life);
    ctx.fill(); ctx.globalAlpha=1; ctx.shadowBlur=0;
  });

}

let smoke = [];

function spawnSmoke(x,y){
  smoke.push({x,y,vx:(Math.random()-0.5)*2.4,vy:-4.5-Math.random()*3,r:5+Math.random()*5,
    life:1, decay:0.10+Math.random()*0.06, drift:(Math.random()-0.5)*0.7});
}
function updateSmoke(dt){
  smoke.forEach(p=>{
    p.x += (p.vx + windLevel*p.drift*3.2)*dt*11;
    p.y += p.vy*dt*11; p.vy *= 0.994;
    p.r += dt*11*(0.5+windLevel*0.6);
    p.life -= p.decay*dt*1.4;
  });
  smoke = smoke.filter(p=>p.life>0);
}
function drawSmoke(){
  smoke.forEach(p=>{
    // Multi-layer smoke for depth
    const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*1.5);
    g.addColorStop(0, pal('smoke', p.life*0.42));
    g.addColorStop(0.5, pal('smoke', p.life*0.22));
    g.addColorStop(1, pal('smoke', 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*1.5,0,7); ctx.fill();
    
    // Lighter edge
    if(p.life > 0.3){
      const g2 = ctx.createRadialGradient(p.x-p.r*0.3,p.y-p.r*0.3,0,p.x,p.y,p.r*1.8);
      g2.addColorStop(0, pal('smoke', p.life*0.18));
      g2.addColorStop(0.7, pal('smoke', p.life*0.08));
      g2.addColorStop(1, pal('smoke', 0));
      ctx.fillStyle = g2;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*1.8,0,7); ctx.fill();
    }
  });
}

/* ============ FIREFLIES - ENHANCED REALISM ============ */
function updateDrawFireflies(dt, nightAlpha){
  fireflies.forEach(f=>{
    const x = (f.bx + Math.sin(t*f.speed+f.driftPhase)*f.ampX)*W;
    const y = (f.by + Math.cos(t*f.speed*0.7+f.driftPhase)*f.ampY)*H;
    
    // Realistic firefly blink - sharp rise, slow fall
    const rawBlink = Math.sin(t*f.blinkSpeed+f.phase);
    const blink = rawBlink > 0 ? Math.pow(rawBlink, 5) : 0;
    const a = blink*(0.35+nightAlpha*0.75);
    
    if(a>0.03){
      const coreColor = pal('bodyCore');
      const glowColor = pal('bodyGlow');
      
      // Outer glow - soft and large
      const outerGlow = ctx.createRadialGradient(x,y,0,x,y,f.size*6);
      outerGlow.addColorStop(0, pal('bodyGlow', a*0.5));
      outerGlow.addColorStop(0.4, pal('bodyGlow', a*0.25));
      outerGlow.addColorStop(1, pal('bodyGlow', 0));
      ctx.fillStyle = outerGlow;
      ctx.beginPath();
      ctx.arc(x,y,f.size*6,0,7);
      ctx.fill();
      
      // Inner glow
      const innerGlow = ctx.createRadialGradient(x,y,0,x,y,f.size*2.5);
      innerGlow.addColorStop(0, coreColor);
      innerGlow.addColorStop(0.6, pal('bodyGlow', a*0.8));
      innerGlow.addColorStop(1, pal('bodyGlow', 0));
      ctx.fillStyle = innerGlow;
      ctx.beginPath();
      ctx.arc(x,y,f.size*2.5,0,7);
      ctx.fill();
      
      // Bright core
      ctx.fillStyle = coreColor;
      ctx.beginPath();
      ctx.arc(x,y,f.size*0.7,0,7);
      ctx.fill();
    }
  });
  sparks.forEach(()=>{});
}

function drawSky(e){

  if(starAlpha>0.02){
    stars.forEach(s=>{
      const tw = 0.5+0.5*Math.sin(t*s.speed+s.phase);
      const x = s.x*W, y = s.y*H;
      const size = s.r*(0.7+tw*0.7);
      const alpha = starAlpha*(0.45+tw*0.55)*s.baseA;
      
      // Star glow for brighter stars
      if(s.baseA > 0.6){
        const glowGrad = ctx.createRadialGradient(x,y,0,x,y,size*3.5);
        glowGrad.addColorStop(0, pal('starColor', alpha*0.4));
        glowGrad.addColorStop(0.5, pal('starColor', alpha*0.15));

        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(x, y, size*3.5,0,7);
        ctx.fill();
      }
      
      // Star core
      ctx.beginPath();
      ctx.arc(x, y, size,0,7);
      ctx.fillStyle = pal('starColor', alpha);
      ctx.fill();
    });
  }

  const bodyX = W*0.22+Math.sin(t*0.012)*W*0.01;
  const bodyY = H*0.16+Math.cos(t*0.009)*5;
  const bodyR = Math.min(W,H)*0.075+e.bass*4;
  const glow = ctx.createRadialGradient(bodyX,bodyY,bodyR*0.15, bodyX,bodyY,bodyR*5.5);
  glow.addColorStop(0, pal('bodyGlow', 0.42+e.energy*0.2));
  glow.addColorStop(0.35, pal('bodyGlow', 0.11));
  glow.addColorStop(1, pal('bodyGlow', 0));
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(bodyX,bodyY,bodyR*5.5,0,7); ctx.fill();
  const bodyGrad = ctx.createRadialGradient(bodyX-bodyR*0.25,bodyY-bodyR*0.25,bodyR*0.1, bodyX,bodyY,bodyR);
  bodyGrad.addColorStop(0, pal('bodyCore')); bodyGrad.addColorStop(1, pal('bodyGlow'));
  ctx.fillStyle = bodyGrad; ctx.beginPath(); ctx.arc(bodyX,bodyY,bodyR,0,7); ctx.fill();

  const fogGrad = ctx.createLinearGradient(0,H*0.60,0,H*0.68);
  fogGrad.addColorStop(0, pal('skyBottom',0));
  fogGrad.addColorStop(0.6, pal('skyBottom',0.28));
  fogGrad.addColorStop(1, pal('waterTop',0));
  ctx.fillStyle = fogGrad; ctx.fillRect(0,H*0.60,W,H*0.08);
}

function drawRidge(arr, baseFrac, ampFrac, colorKey, depth){
  const baseY = H*baseFrac;
  ctx.beginPath();
  ctx.moveTo(-2, H+2);
  const steps=48;
  for(let i=0;i<=steps;i++){
    const p=i/steps;
    const y = baseY - sampleArr(arr,p)*H*ampFrac;
    ctx.lineTo(p*W + parallaxX*depth, y);
  }
  ctx.lineTo(W+2,H+2); ctx.closePath();
  ctx.fillStyle = pal(colorKey); ctx.fill();
}

function volcanoGeom(){
  const cx = L.volcCx*W, baseY = H*L.volcBase;
  const wPx = L.volcW*W, hPx = L.volcH*H;
  const left = cx - wPx/2;
  return {cx, baseY, wPx, hPx, left};
}
function drawVolcano(e, geom, pulse){
  const {baseY, wPx, hPx, left} = geom;
  ctx.beginPath();
  ctx.moveTo(left-2+parallaxX*10, H+2);
  for(let i=0;i<VP_LEN;i++){
    const x = left + (i/(VP_LEN-1))*wPx + parallaxX*10;
    const y = baseY - volcanoProfile[i]*hPx;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(left+wPx+2+parallaxX*10, H+2);
  ctx.closePath();
  ctx.fillStyle = pal('volcanoBody'); ctx.fill();

  const apexX = left + (VP_MID/(VP_LEN-1))*wPx + parallaxX*10;
  const apexY = baseY - volcanoProfile[Math.round(VP_MID)]*hPx;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const glowR = hPx*0.28*(0.6+pulse*0.9);
  const glow = ctx.createRadialGradient(apexX,apexY,0, apexX,apexY,glowR);
  glow.addColorStop(0, pal('craterGlow', 0.55*pulse));
  glow.addColorStop(0.4, pal('craterGlow', 0.18*pulse));
  glow.addColorStop(1, pal('craterGlow', 0));
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(apexX,apexY,glowR,0,7); ctx.fill();
  ctx.restore();

  [lavaFlowA, lavaFlowB].forEach(flow=>{
    ctx.beginPath();
    flow.forEach((pt,i)=>{
      const x = left + pt.lx*wPx + parallaxX*10;
      const y = baseY - pt.h*hPx;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.strokeStyle = pal('lava', 0.55+pulse*0.4);
    ctx.lineWidth = 2+pulse*1.4;
    ctx.shadowColor = pal('lava'); ctx.shadowBlur = 6+pulse*8;
    ctx.stroke(); ctx.shadowBlur=0;
  });

  return {apexX, apexY};
}

function drawWater(e, volcanoX){
  const topY = H*L.waterTop;
  const g = ctx.createLinearGradient(0,topY,0,H);
  g.addColorStop(0, pal('waterTop')); g.addColorStop(1, pal('waterBottom'));
  ctx.fillStyle = g; ctx.fillRect(0,topY,W,H-topY);
  const rows=20;
  for(let i=0;i<rows;i++){
    const p=i/rows;
    const y = topY+4+p*(H-topY)*0.88;
    const fade = 1-p*0.8;
    const jitter = (Math.random()-0.3)*(9+e.treble*28)*fade;
    const w = (W*0.085*(1-p*0.5)+jitter)*(0.6+e.energy*0.7);
    const cx = volcanoX+Math.sin(p*17+t*1.05)*(3+(1-p)*7);
    const hgt = 1.1+Math.random()*1.7*fade;
    ctx.fillStyle = pal('reflect',(0.07+Math.random()*0.17)*fade*(0.5+e.treble*0.7));
    ctx.fillRect(cx-w/2,y,Math.max(0,w),hgt);
  }
}

let lastResize=0, lastFrameTime=performance.now();
function render(){
  const now = performance.now();
  let dt = (now-lastFrameTime)/1000; lastFrameTime=now;
  if(!isFinite(dt)||dt<=0) dt=1/60; dt=Math.min(dt,0.05);
  const nowMs = Date.now();
  if(nowMs-lastResize>500){ resize(); lastResize=nowMs; }
  t += dt*2.4;

  parallaxX += (((pointerFrac-0.5)*-14) - parallaxX)*Math.min(1,dt*3);

  const modeTarget = currentMode==='light' ? 1 : 0;
  modeMix += (modeTarget-modeMix)*Math.min(1,dt*1.4);

  const boost = 0.75+emberLevel*0.7;
  const bars = getBars(boost);
  const e = analyze(bars, boost);
  updateMeter(bars);

  const pulse = playing ? (0.55+e.bass*1.5+(e.beat?0.35:0)) : 0.28+emberLevel*0.12;
  phone.style.setProperty('--lvl', playing ? Math.min(1, e.bass*1.3) : 0);

  const geom = volcanoGeom();

  smokeTimer -= dt;
  if(playing && smokeTimer<=0){
    const apexXguess = geom.left+(VP_MID/(VP_LEN-1))*geom.wPx+parallaxX*10;
    const apexYguess = geom.baseY - volcanoProfile[Math.round(VP_MID)]*geom.hPx;
    spawnSmoke(apexXguess+(Math.random()-0.5)*10, apexYguess-4);
    smokeTimer = 1.0-emberLevel*0.45+Math.random()*0.6;
  }
  updateSmoke(dt);

  if(playing && Math.random()<(0.02+emberLevel*0.05)){
    const apexXguess = geom.left+(VP_MID/(VP_LEN-1))*geom.wPx+parallaxX*10;
    const apexYguess = geom.baseY - volcanoProfile[Math.round(VP_MID)]*geom.hPx;
    burst(apexXguess+(Math.random()-0.5)*16, apexYguess, 1, 'ember', 1.6, 55, {gravity:-0.012,drag:0.965,r0:0.6,r1:1.5,upBias:0.4});
    if(Math.random()<0.4) crackle(0, 0.35+Math.random()*0.3);
  }
  updateBirds(dt);

  const nightAlpha = Math.max(0, 1-modeMix*1.2);

  drawSky(e);
  drawRidge(ridgeFarArr, L.ridgeFarBase, L.ridgeFarAmp, 'ridgeFar', 4);
  drawRidge(ridgeMidArr, L.ridgeMidBase, L.ridgeMidAmp, 'ridgeMid', 7);
  const craterPos = drawVolcano(e, geom, pulse);
  drawSmoke();
  drawBird();
  drawMist();
  drawWater(e, craterPos.apexX);
  drawTreesLayer(treesFar, L.treesFarBase, 'treeFar', 0.6, 12);
  updateDrawFireflies(dt, nightAlpha);
  drawTreesLayer(treesNear, L.treesNearBase, 'treeNear', 1.0, 22);
  drawSparks();

  requestAnimationFrame(render);
}

/* ============ CANVAS TAP INTERACTION ============ */
stageEl.addEventListener('pointerdown', (ev)=>{
  const r = canvas.getBoundingClientRect();
  const x = ev.clientX-r.left, y = ev.clientY-r.top;
  if(!actx) initAudio();
  if(actx && actx.state==='suspended') actx.resume();
  chime(300+Math.random()*90, 0.9);
  burst(x,y,10,'a5',1.6,55,{gravity:-0.01,drag:0.965,r0:0.6,r1:1.4,upBias:0.3});
  burst(x,y,7,'ember',2.1,32,{gravity:0.02,drag:0.94,r0:0.7,r1:1.8});
  shakeStage(0.5);
});

/* patch pal() to accept the extra ad-hoc keys used by particle bursts */
PALETTE.night.ember = PALETTE.night.ember || '#ffb463';
PALETTE.dusk.ember = PALETTE.dusk.ember || '#ffc17a';
PALETTE.night.a5 = '#d7e878';
PALETTE.dusk.a5 = '#a9b667';

setMode('dark');
windVal.textContent = windEl.value;
emberVal.textContent = emberEl.value;
resize();
render();
</script>
