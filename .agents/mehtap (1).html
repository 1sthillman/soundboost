<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mehtap — Sanat Serisi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

  :root{

    --font-display:'Fraunces',serif;

    --font-ui:'Space Grotesk',sans-serif;

    --bg0:#040910;--bg1:#0c1e30;--ink:#eef2f5;--ink-dim:#6d7f92;

    --a1:#d9b46a;--a2:#4a6fa5;--a3:#122236;--a4:#f2b155;--accent:#f2b155;--grain:.035;

    --foam:#eef6fb;

  }

  /* Mehtap — ay ışığının durgun bir denizin yüzünde sessizce kırılışı,

     ve bir sandalda sabırla bekleyen bir balıkçının hikayesi.

     Karanlıkta gümüşi bir ay suya değer, aydınlıkta ise altın bir güneş;

     bas frekanslar dalgaları kabartır, tizler yüzeydeki ışıltıları uyandırır,

     ve zaman zaman — hiç beklenmedik bir anda — olta gerilir. */

  [data-theme="mehtap"]{--bg0:#040910;--bg1:#0c1e30;--ink:#eef2f5;--ink-dim:#6d7f92;--a1:#d9b46a;--a2:#4a6fa5;--a3:#122236;--a4:#f2b155;--accent:#f2b155;--grain:.035;--foam:#eef6fb;}

  [data-theme="mehtap"][data-mode="light"]{--bg0:#eaf1f2;--bg1:#f8fbf9;--ink:#16303a;--ink-dim:#6f8790;--a1:#c98b2e;--a2:#3c6e86;--a3:#dbe9e4;--a4:#c98b2e;--accent:#c98b2e;--grain:.014;}

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{-webkit-tap-highlight-color:transparent;width:100%;height:100%;overflow:hidden;}

  body{

    display:flex;

    font-family:var(--font-ui);

    background:var(--bg0);

  }

  .phone{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;

    color:var(--ink);

    transition:color 1.1s ease;

    overflow:hidden;

  }

  .screen{

    position:absolute;

    inset:0;

    background:radial-gradient(120% 90% at 50% -10%, var(--bg1), var(--bg0) 65%);

    padding:env(safe-area-inset-top) 18px 0 18px;

    display:flex;

    flex-direction:column;

    gap:10px;

    height:100%;

    overflow-y:auto;

    transition:background 1.1s ease;

  }

  .grain{

    position:fixed;

    inset:0;

    pointer-events:none;

    mix-blend-mode:overlay;

    opacity:var(--grain,.03);

    z-index:5;

    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");

    background-size:160px;

    transition:opacity .6s ease;

  }

  .vignette{

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:4;

    box-shadow:inset 0 0 70px 10px rgba(0,0,0,.4);

    transition:box-shadow .6s ease;

  }

  [data-mode="light"] .vignette{box-shadow:inset 0 0 70px 10px rgba(0,0,0,.08);}

  .topbar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;flex-shrink:0;}

  .brand{font-family:var(--font-display); font-weight:600; font-style:italic; font-size:19px; letter-spacing:-0.01em; margin:0; color:var(--ink);}

  .topright{display:flex; align-items:center; gap:12px;}

  .meter{display:flex; align-items:flex-end; gap:2.5px; height:14px;}

  .meter i{display:block; width:2.5px; border-radius:1px; background:var(--accent); height:2px; transition:background 1.1s ease; opacity:.85;}

  .now{font-size:11px; color:var(--ink-dim); margin:0; font-variant-numeric:tabular-nums; transition:color 1.1s ease;}

  .modeToggle{background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;flex-shrink:0;}

  .modeSwitch{width:38px;height:20px;border-radius:20px;background:color-mix(in srgb, var(--ink) 18%, transparent);position:relative;transition:background 1.1s ease;flex-shrink:0;}

  .modeSwitch .thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--accent);transition:transform .35s cubic-bezier(.4,0,.2,1), background 1.1s ease;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4);}

  [data-mode="light"] .modeSwitch .thumb{transform:translateX(18px);}

  .modeSwitch .thumb svg{width:10px;height:10px;color:var(--bg0);}

  .stage{

    position:relative;

    border-radius:20px;

    overflow:hidden;

    flex:1;

    min-height:220px;

    max-height:360px;

    background:#000;

    z-index:2;

    transition:transform .05s ease-out, box-shadow .08s linear;

    box-shadow:

      0 0 0 1px rgba(255,255,255,.05),

      0 18px 40px -14px rgba(0,0,0,.6),

      0 0 46px calc(var(--lvl, 0) * 34px) color-mix(in srgb, var(--accent) 40%, transparent);

  }

  canvas{display:block; width:100%; height:100%;}

  .stage-hint{

    position:absolute; inset:auto 0 13px 0; text-align:center; font-size:11px;

    color:var(--ink-dim); opacity:.9; pointer-events:none; letter-spacing:.01em;

    transition:opacity .5s ease, color 1.1s ease;

  }

  .track{margin-top:0;position:relative;z-index:2;flex-shrink:0;}

  .track h2{font-family:var(--font-display); font-weight:600; font-style:italic; font-size:20px; margin:0 0 2px; letter-spacing:-0.01em; transition:opacity .3s ease;}

  .track p{font-size:12px; color:var(--ink-dim); margin:0; transition:color 1.1s ease;}

  .transport{display:flex;align-items:center;gap:12px;position:relative;z-index:2;flex-shrink:0;padding-bottom:14px;}

  .playbtn{

    position:relative; width:50px; height:50px; border-radius:50%; border:none; cursor:pointer;

    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 100%, white 25%), var(--accent) 70%);

    color:var(--bg0); display:flex; align-items:center; justify-content:center;

    flex-shrink:0; transition:transform .15s ease, background 1.1s ease, box-shadow .1s linear;

    box-shadow:

      inset 0 2px 3px rgba(255,255,255,.35),

      inset 0 -3px 5px rgba(0,0,0,.25),

      0 4px 14px -2px color-mix(in srgb, var(--accent) 60%, transparent),

      0 0 0 calc(4px + var(--lvl, 0) * 14px) color-mix(in srgb, var(--accent) calc(8% + var(--lvl,0) * 22%), transparent);

  }

  .playbtn:active{transform:scale(.92);}

  .playbtn svg{width:20px; height:20px; position:relative; z-index:1;}

  .ripple{

    position:absolute; inset:0; border-radius:50%; border:1.5px solid var(--accent);

    opacity:0; pointer-events:none;

  }

  .ripple.go{animation:rippleOut .55s ease-out;}

  @keyframes rippleOut{

    0%{transform:scale(.7); opacity:.65;}

    100%{transform:scale(1.9); opacity:0;}

  }

  .sliders{flex:1; display:flex; flex-direction:column; gap:8px;}

  .slider-row{display:flex; align-items:center; gap:10px;}

  .slider-row label{font-size:11px; color:var(--ink-dim); width:64px; flex-shrink:0; transition:color 1.1s ease;}

  .slider-row .val{font-size:10px; color:var(--ink-dim); width:30px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums; transition:color 1.1s ease;}

  input[type=range]{

    -webkit-appearance:none; appearance:none; flex:1; height:3px; border-radius:2px;

    background:color-mix(in srgb, var(--ink) 18%, transparent); outline:none;

  }

  input[type=range]::-webkit-slider-thumb{

    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;

    background:var(--accent); cursor:pointer; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);

    transition:background 1.1s ease;

  }

  input[type=range]::-moz-range-thumb{

    width:14px; height:14px; border:none; border-radius:50%;

    background:var(--accent); cursor:pointer; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);

    transition:background 1.1s ease;

  }

  @media (prefers-reduced-motion: reduce){

    .stage{transition:none;}

    .ripple.go{animation:none;}

  }


/* ============ AÇILIŞ — MEHTABIN KIYISI ============ */
.intro{position:fixed;inset:0;z-index:60;background:#03070e;overflow:hidden;transition:opacity 1.4s ease,visibility 1.4s;}
.intro.gone{opacity:0;visibility:hidden;pointer-events:none;}
#introCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.intro-grain{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:overlay;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");background-size:160px;}
.intro-vignette{position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 130px 34px rgba(0,0,0,.6);}
.intro-text{position:absolute;top:12.5%;left:0;right:0;z-index:4;display:flex;flex-direction:column;align-items:center;gap:13px;pointer-events:none;}
.it-line{font-family:'Space Grotesk',system-ui,sans-serif;font-size:11px;letter-spacing:.55em;text-indent:.55em;color:#bfe9e4;opacity:0;text-shadow:0 0 16px rgba(79,216,208,.7);}
.intro.play .it-line{animation:itIn 1.7s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:var(--d);}
@keyframes itIn{from{opacity:0;transform:translateY(10px);filter:blur(5px);}to{opacity:.92;transform:none;filter:blur(0);}}
.intro-caption{position:absolute;bottom:22%;left:0;right:0;z-index:4;text-align:center;font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:14px;color:#7fa8a5;opacity:0;pointer-events:none;}
.intro.play .intro-caption{animation:itIn 2s ease forwards;animation-delay:var(--d);}
.intro-tap{position:absolute;bottom:16.5%;left:0;right:0;z-index:4;text-align:center;font-size:9.5px;letter-spacing:.3em;color:#48707a;opacity:0;pointer-events:none;}
.intro.play .intro-tap{animation:itIn 1.6s ease forwards;animation-delay:3.1s;}
.intro-enter{position:absolute;bottom:6.5%;left:50%;transform:translateX(-50%);z-index:5;background:rgba(6,22,28,.4);border:1px solid rgba(79,216,208,.32);color:#d6efec;font-family:'Space Grotesk',system-ui,sans-serif;font-size:11.5px;letter-spacing:.32em;text-indent:.32em;padding:15px 32px;border-radius:40px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:border-color .3s,box-shadow .3s,transform .15s;}
.intro.play .intro-enter{animation:itIn 1.6s ease forwards;animation-delay:2.5s;}
.intro-enter:active{transform:translateX(-50%) scale(.95);}
.intro.entering .intro-enter{border-color:rgba(120,230,222,.95);box-shadow:0 0 46px rgba(79,216,208,.5);}
.ie-ring{position:absolute;inset:-4px;border-radius:44px;border:1px solid rgba(79,216,208,.55);opacity:0;pointer-events:none;}
.intro.play .intro-enter .ie-ring{animation:iePulse 2.4s ease-out infinite;animation-delay:2.5s;}
@keyframes iePulse{0%{transform:scale(1);opacity:.65;}100%{transform:scale(1.4);opacity:0;}}
.intro-end{position:absolute;inset:0;z-index:8;background:#02060c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s;}
.intro-end.show{opacity:1;visibility:visible;}
.ie-brand{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;font-size:34px;color:#d9efe9;text-shadow:0 0 30px rgba(79,216,208,.5);margin:0;}
.ie-sub{font-size:10px;letter-spacing:.4em;text-indent:.4em;color:#5d8891;margin:0;}
@media (prefers-reduced-motion:reduce){.intro.play .it-line,.intro.play .intro-caption,.intro.play .intro-tap,.intro.play .intro-enter,.intro.play .intro-enter .ie-ring{animation:none;opacity:.92;}}

</style>

</head>

<body>
<!-- ============ AÇILIŞ: MEHTABIN KIYISI ============ -->
<div class="intro" id="intro">
  <canvas id="introCanvas"></canvas>
  <div class="intro-vignette"></div>
  <div class="intro-grain"></div>
  <div class="intro-text">
    <span class="it-line" style="--d:.5s">SABRET</span>
    <span class="it-line" style="--d:1.2s">SAL</span>
    <span class="it-line" style="--d:1.9s">UYAN</span>
  </div>
  <p class="intro-caption" style="--d:2.7s">— mehtabın kıyısında —</p>
  <p class="intro-tap">göğe dokun · bir ışık sal</p>
  <button class="intro-enter" id="introEnter" aria-label="Kıyıya yaklaş"><span class="ie-ring"></span>Kıyıya Yaklaş</button>
  <div class="intro-end" id="introEnd"><p class="ie-brand">Mehtap</p><p class="ie-sub">— hoş geldin —</p></div>
</div>


<div class="phone" id="phone" data-theme="mehtap" data-mode="dark">

    <div class="screen">

      <div class="grain"></div>

      <div class="vignette"></div>

      <div class="topbar">

        <p class="brand">Mehtap</p>

        <div class="topright">

          <button class="modeToggle" id="modeToggle" aria-label="Gece / Gündüz">

            <span class="modeSwitch"><span class="thumb" id="modeThumb"></span></span>

          </button>

          <div class="meter" id="meter">

            <i></i><i></i><i></i><i></i><i></i>

          </div>

          <p class="now" id="clock">--:--</p>

        </div>

      </div>

      <div class="stage" id="stage">

        <canvas id="canvas"></canvas>

        <p class="stage-hint" id="stageHint">Oynat'a basarak sessiz denizi uyandırın</p>

      </div>

      <div class="track">

        <h2 id="trackTitle">Ay Balıkçısı</h2>

        <p id="trackSub">Durgun suda sabırla bekleyen bir sandalın hikâyesi</p>

      </div>

      <div class="transport">

        <button class="playbtn" id="playBtn" aria-label="Oynat">

          <span class="ripple" id="ripple"></span>

          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>

        </button>

        <div class="sliders">

          <div class="slider-row">

            <label for="boost">Dalga</label>

            <input type="range" id="boost" min="0" max="100" value="65">

            <span class="val" id="boostVal">65</span>

          </div>

          <div class="slider-row">

            <label for="sens">Parıltı</label>

            <input type="range" id="sens" min="0" max="100" value="45">

            <span class="val" id="sensVal">45</span>

          </div>

        </div>

      </div>

    </div>

</div>

<script>

const canvas = document.getElementById('canvas');

const ctx = canvas.getContext('2d');

const phone = document.getElementById('phone');

const stageEl = document.getElementById('stage');

const stageHint = document.getElementById('stageHint');

const boostEl = document.getElementById('boost');

const sensEl = document.getElementById('sens');

const boostVal = document.getElementById('boostVal');

const sensVal = document.getElementById('sensVal');

const playBtn = document.getElementById('playBtn');

const rippleEl = document.getElementById('ripple');

const clockEl = document.getElementById('clock');

const meterBars = Array.from(document.querySelectorAll('#meter i'));

const modeToggle = document.getElementById('modeToggle');

const modeThumb = document.getElementById('modeThumb');

/* ============ CANVAS SIZING ============ */

let W,H,DPR;

function resize(){

  DPR = Math.min(2, window.devicePixelRatio || 1);

  const r = canvas.getBoundingClientRect();

  W = r.width; H = r.height;

  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);

  ctx.setTransform(DPR,0,0,DPR,0,0);

}

window.addEventListener('resize', resize);

let cssCache = {};

function css(v){ return cssCache[v] || (cssCache[v] = getComputedStyle(phone).getPropertyValue(v).trim()); }

function alpha(colorVar, a){

  const hex = css(colorVar);

  const aa = Math.max(0,Math.min(1,a));

  const h = Math.round(aa*255).toString(16).padStart(2,'0');

  return hex.length===7 ? hex+h : hex;

}

/* ============ CLOCK ============ */

function tickClock(){

  const d = new Date();

  clockEl.textContent = d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});

}

tickClock(); setInterval(tickClock, 15000);

/* ============ SCREEN SHAKE ============ */

let shakeTimer = null;

function shakeStage(intensity){

  stageEl.style.transform = `translate(${(Math.random()-0.5)*intensity}px, ${(Math.random()-0.5)*intensity}px)`;

  clearTimeout(shakeTimer);

  shakeTimer = setTimeout(()=>{ stageEl.style.transform=''; }, 85);

}

/* ============ GECE / GÜNDÜZ ============ */

const MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.4A9 9 0 1111.6 3a7 7 0 009.4 9.4z"/></svg>';

const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';

let currentMode = 'dark';

function setMode(mode){

  currentMode = mode;

  phone.dataset.mode = mode;

  cssCache = {};

  modeThumb.innerHTML = mode==='dark' ? MOON_ICON : SUN_ICON;

}

modeToggle.addEventListener('click', ()=>{

  setMode(currentMode === 'dark' ? 'light' : 'dark');

});

/* =====================================================================

   REAL AUDIO ENGINE — bir açık deniz ortam parçası, gerçek bir

   AnalyserNode ile canlı analiz edilir. Görsel, bu ses grafiğinden

   çekilen gerçek FFT verisiyle sürülür.

   ===================================================================== */

let actx, analyser, freqData, timeData;

let master, bassShelf, lowpass, airShelf, comp, panner, panLfo, panLfoGain;

let delay, delayFeedback, delayFilter, delayOut;

let lfo, lfoGain;

let droneOscs = [], droneLfos = [];

let noiseBuffer, waveSrc, waveFilter, waveGain, waveSwellLfo, waveSwellGain;

let chordIdx = 0;

let chordTimer=null;

let dropletHandle=null, thumpHandle=null;

let playing = false;

const CHORDS = [

  [55.00, 82.41, 110.00, 164.81, 220.00],

  [49.00, 73.42, 98.00, 146.83, 196.00],

  [43.65, 65.41, 87.31, 130.81, 174.61],

  [46.25, 69.30, 92.50, 138.59, 185.00],

];

function makeNoiseBuffer(){

  const len = actx.sampleRate*2;

  const buf = actx.createBuffer(1, len, actx.sampleRate);

  const d = buf.getChannelData(0);

  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;

  return buf;

}

function initAudio(){

  actx = new (window.AudioContext||window.webkitAudioContext)();

  analyser = actx.createAnalyser();

  analyser.fftSize = 1024;

  analyser.smoothingTimeConstant = 0.8;

  freqData = new Uint8Array(analyser.frequencyBinCount);

  timeData = new Uint8Array(analyser.fftSize);

  master = actx.createGain();

  master.gain.value = 0.0001;

  bassShelf = actx.createBiquadFilter();

  bassShelf.type = 'lowshelf';

  bassShelf.frequency.value = 200;

  bassShelf.gain.value = 0;

  lowpass = actx.createBiquadFilter();

  lowpass.type = 'lowpass';

  lowpass.frequency.value = 1100;

  lowpass.Q.value = 0.5;

  airShelf = actx.createBiquadFilter();

  airShelf.type = 'highshelf';

  airShelf.frequency.value = 5000;

  airShelf.gain.value = 2;

  comp = actx.createDynamicsCompressor();

  comp.threshold.value = -22; comp.knee.value = 24; comp.ratio.value = 3;

  comp.attack.value = 0.006; comp.release.value = 0.25;

  panner = actx.createStereoPanner();

  panLfo = actx.createOscillator(); panLfo.frequency.value = 0.045;

  panLfoGain = actx.createGain(); panLfoGain.gain.value = 0.35;

  panLfo.connect(panLfoGain); panLfoGain.connect(panner.pan); panLfo.start();

  delay = actx.createDelay(1.4); delay.delayTime.value = 0.42;

  delayFeedback = actx.createGain(); delayFeedback.gain.value = 0.3;

  delayFilter = actx.createBiquadFilter(); delayFilter.type = 'lowpass'; delayFilter.frequency.value = 2000;

  delay.connect(delayFilter); delayFilter.connect(delayFeedback); delayFeedback.connect(delay);

  delayOut = actx.createGain(); delayOut.gain.value = 0.4;

  delay.connect(delayOut);

  lowpass.connect(bassShelf);

  bassShelf.connect(airShelf);

  airShelf.connect(master);

  delayOut.connect(master);

  master.connect(comp);

  comp.connect(panner);

  panner.connect(analyser);

  analyser.connect(actx.destination);

  lfo = actx.createOscillator();

  lfo.frequency.value = 0.03;

  lfoGain = actx.createGain();

  lfoGain.gain.value = 220;

  lfo.connect(lfoGain);

  lfoGain.connect(lowpass.frequency);

  lfo.start();

  noiseBuffer = makeNoiseBuffer();

  waveSrc = actx.createBufferSource();

  waveSrc.buffer = noiseBuffer; waveSrc.loop = true;

  waveFilter = actx.createBiquadFilter();

  waveFilter.type = 'bandpass'; waveFilter.frequency.value = 550; waveFilter.Q.value = 0.6;

  waveGain = actx.createGain(); waveGain.gain.value = 0.05;

  waveSwellLfo = actx.createOscillator(); waveSwellLfo.frequency.value = 0.085;

  waveSwellGain = actx.createGain(); waveSwellGain.gain.value = 0.045;

  waveSwellLfo.connect(waveSwellGain); waveSwellGain.connect(waveGain.gain);

  waveSrc.connect(waveFilter); waveFilter.connect(waveGain); waveGain.connect(lowpass);

  waveSrc.start(); waveSwellLfo.start();

  buildDrone(CHORDS[0]);

  applyBoost();

  applySensitivity();

}

function buildDrone(chord){

  droneOscs.forEach(o=>{ try{o.stop();}catch(e){} });

  droneLfos.forEach(o=>{ try{o.stop();}catch(e){} });

  droneOscs = [];

  droneLfos = [];

  chord.forEach((freq,i)=>{

    const o = actx.createOscillator();

    o.type = i===0 ? 'sine' : (i%2===0 ? 'triangle' : 'sine');

    o.frequency.value = i===0 ? freq/2 : freq;

    const g = actx.createGain();

    g.gain.value = i===0 ? 0.20 : 0.04;

    o.connect(g); g.connect(lowpass);

    o.start();

    droneOscs.push(o);

    if(i>0){

      const dl = actx.createOscillator(); dl.frequency.value = 0.02 + i*0.011;

      const dg = actx.createGain(); dg.gain.value = 2.5 + i*0.5;

      dl.connect(dg); dg.connect(o.detune); dl.start();

      droneLfos.push(dl);

    }

  });

  const shimmer = actx.createOscillator(); shimmer.frequency.value = 0.06;

  const shimmerGain = actx.createGain(); shimmerGain.gain.value = 500;

  shimmer.connect(shimmerGain); shimmerGain.connect(delayFilter.frequency);

  shimmer.start();

  droneLfos.push(shimmer);

}

function advanceChord(){

  chordIdx = (chordIdx+1) % CHORDS.length;

  const chord = CHORDS[chordIdx];

  const now = actx.currentTime;

  droneOscs.forEach((o,i)=>{

    if(chord[i] !== undefined){

      const target = i===0 ? chord[i]/2 : chord[i];

      o.frequency.linearRampToValueAtTime(target, now + 2.6);

    }

  });

}

function droplet(freq, when, gainMul){

  const t0 = actx.currentTime + (when||0);

  const o = actx.createOscillator();

  o.type = 'sine';

  o.frequency.value = freq;

  const g = actx.createGain();

  g.gain.setValueAtTime(0.0001, t0);

  g.gain.exponentialRampToValueAtTime(0.1*(gainMul||1), t0+0.01);

  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.6);

  o.connect(g); g.connect(lowpass);

  const send = actx.createGain(); send.gain.value = 0.45;

  g.connect(send); send.connect(delay);

  o.start(t0); o.stop(t0+0.65);

}

function scheduleDroplets(){

  if(!playing) return;

  const chord = CHORDS[chordIdx];

  const note = chord[1+Math.floor(Math.random()*3)] * (Math.random()<0.5?2:4);

  droplet(note, 0, 0.7+Math.random()*0.5);

  dropletHandle = setTimeout(scheduleDroplets, 350+Math.random()*900);

}

function waveThump(){

  if(!actx) return;

  const t0 = actx.currentTime;

  const o = actx.createOscillator();

  o.type = 'sine';

  o.frequency.setValueAtTime(95, t0);

  o.frequency.exponentialRampToValueAtTime(32, t0+0.5);

  const g = actx.createGain();

  g.gain.setValueAtTime(0.0001, t0);

  g.gain.exponentialRampToValueAtTime(0.22, t0+0.05);

  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.9);

  o.connect(g); g.connect(bassShelf);

  o.start(t0); o.stop(t0+0.95);

}

function scheduleThumps(){

  if(!playing) return;

  waveThump();

  thumpHandle = setTimeout(scheduleThumps, 2600+Math.random()*2200);

}

function splashSound(intensity){

  if(!actx) return;

  intensity = intensity||0.5;

  const t0 = actx.currentTime;

  const src = actx.createBufferSource();

  src.buffer = noiseBuffer;

  const bp = actx.createBiquadFilter();

  bp.type = 'bandpass';

  bp.frequency.setValueAtTime(1800, t0);

  bp.frequency.exponentialRampToValueAtTime(500, t0+0.4);

  bp.Q.value = 0.8;

  const g = actx.createGain();

  g.gain.setValueAtTime(0.0001, t0);

  g.gain.exponentialRampToValueAtTime(0.5*intensity, t0+0.02);

  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);

  src.connect(bp); bp.connect(g); g.connect(bassShelf);

  src.start(t0); src.stop(t0+0.55);

  droplet(900+Math.random()*300, 0.05, 0.5*intensity);

  droplet(1200+Math.random()*400, 0.15, 0.35*intensity);

}

function applyBoost(){

  const v = parseFloat(boostEl.value);

  boostVal.textContent = v;

  if(bassShelf){

    const db = (v-50)/50*15;

    bassShelf.gain.setTargetAtTime(db, actx.currentTime, 0.05);

  }

  if(waveGain){

    waveGain.gain.value = 0.03 + (v/100)*0.09;

  }

}

function applySensitivity(){

  if(!analyser){ sensVal.textContent = sensEl.value; return; }

  const v = parseFloat(sensEl.value);

  analyser.smoothingTimeConstant = 0.88 - (v/100)*0.55;

  if(airShelf) airShelf.gain.setTargetAtTime(1 + (v/100)*5, actx.currentTime, 0.12);

  sensVal.textContent = v;

}

boostEl.addEventListener('input', applyBoost);

sensEl.addEventListener('input', applySensitivity);

async function togglePlay(){

  rippleEl.classList.remove('go');

  void rippleEl.offsetWidth;

  rippleEl.classList.add('go');

  if(!actx) initAudio();

  if(actx && actx.state === 'suspended') actx.resume();

  if(!playing){

    master.gain.cancelScheduledValues(actx.currentTime);

    master.gain.setTargetAtTime(0.4, actx.currentTime, 0.5);

    playing = true;

    chordTimer = setInterval(advanceChord, 7600);

    scheduleDroplets();

    scheduleThumps();

    nextCatchIn = 10 + Math.random()*12;

    updatePlayButtonState(true);

    master.gain.cancelScheduledValues(actx.currentTime);

    master.gain.setTargetAtTime(0.0001, actx.currentTime, 0.35);

    playing = false;

    clearInterval(chordTimer);

    clearTimeout(dropletHandle);

    clearTimeout(thumpHandle);

    updatePlayButtonState(false);

  }

}

   ===================================================================== */

let t = 0;

const BINS = 48;

let fluxHistory = [];

let beatCooldown = 0;

let prevBandFrame = null;

let smoothedEnergy = 0;

function getBars(sensBoost){

  const bars = new Array(BINS).fill(0.02);

  if(!analyser){

    for(let i=0;i<BINS;i++) bars[i] = 0.035 + 0.018*Math.sin(t*0.6 + i*0.4);

    return bars;

  }

  analyser.getByteFrequencyData(freqData);

  const usable = Math.floor(freqData.length*0.8);

  for(let i=0;i<BINS;i++){

    const p = i/BINS;

    const idx = Math.floor(Math.pow(p, 1.35)*usable);

    bars[i] = Math.max(0.02, (freqData[idx]/255) * (sensBoost||1));

  }

  return bars;

}

function bandAvg(bars, from, to){

  from = Math.max(0, from); to = Math.min(BINS, to);

  let s=0, n=0;

  for(let i=from;i<to;i++){ s+=bars[i]; n++; }

  return n ? s/n : 0;

}

function analyze(bars, sensBoost){

  const sub    = bandAvg(bars, 0, 3);

  const bass   = bandAvg(bars, 1, 7);

  const lowMid = bandAvg(bars, 7, 15);

  const mid    = bandAvg(bars, 15, 26);

  const highMid= bandAvg(bars, 26, 36);

  const treble = bandAvg(bars, 36, 46);

  const frameEnergy = (sub*1.3 + bass) / 2.3;

  smoothedEnergy += (frameEnergy - smoothedEnergy) * 0.12;

  let flux = 0;

  if(prevBandFrame){

    for(let i=0;i<BINS;i++) flux += Math.max(0, bars[i]-prevBandFrame[i]);

  }

  prevBandFrame = bars.slice();

  fluxHistory.push(flux);

  if(fluxHistory.length>30) fluxHistory.shift();

  const avgFlux = fluxHistory.reduce((a,b)=>a+b,0)/fluxHistory.length;

  const sensitivity = 0.5 + ((sensBoost-0.55)/1.1);

  const fluxThresh = avgFlux * (1.55 - sensitivity*0.4) + 0.6;

  let beat = false;

  beatCooldown = Math.max(0, beatCooldown-1);

  if(playing && beatCooldown===0 && flux > fluxThresh && frameEnergy > 0.22){

    beat = true;

    beatCooldown = 7;

  }

  return {sub, bass, lowMid, mid, highMid, treble, energy: smoothedEnergy, flux, beat};

}

let sparks = [];

function burst(cx, cy, n, colorVar, speed, life, opts){

  opts = opts||{};

  for(let i=0;i<n;i++){

    const ang = Math.random()*Math.PI*2;

    const sp = (speed||2) * (0.45+Math.random()*0.9);

    sparks.push({

      x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,

      r:(opts.r0||1)+Math.random()*(opts.r1||2.2),

      life:1, decay:1/(life||40), color:colorVar,

      grav:opts.gravity||0, drag:opts.drag!==undefined?opts.drag:0.96

    });

  }

}

function drawSparks(glow){

  sparks.forEach(s=>{

    s.x+=s.vx; s.y+=s.vy; s.vy+=s.grav; s.vx*=s.drag; s.vy*=s.drag; s.life-=s.decay;

    ctx.beginPath(); ctx.arc(s.x,s.y,Math.max(0.2,s.r*s.life),0,7);

    if(glow){ ctx.shadowColor = css(s.color); ctx.shadowBlur = 8; }

    ctx.fillStyle = css(s.color); ctx.globalAlpha = Math.max(0,s.life);

    ctx.fill(); ctx.globalAlpha=1; ctx.shadowBlur=0;

  });

  sparks = sparks.filter(s=>s.life>0);

}

}

/* =====================================================================

   MEHTAP — bir sandal, bir balıkçı ve mehtabın suya değdiği an.

   Bas frekanslar dalgaları kabartır, tizler yüzeydeki ışıltıları

   uyandırır; gece/gündüz geçişi ay ile güneşi birbirine yumuşakça

   dönüştürür ve zaman zaman olta gerilip bir balık suyun üstüne sıçrar.

   ===================================================================== */

const PALETTE = {

  night:{

    skyTop:'#03070d', skyMid:'#0a1b2c', skyBottom:'#123049',

    waterTop:'#0d2436', waterBottom:'#030a12',

    body:'#dfe8ee', bodyGlow:'#bfd4e6', bodyCore:'#fbf8ee',

    silhouette:'#03070c',

    reflect:'#d9b46a',

    starColor:'#eaf1ff'

  },

  day:{

    skyTop:'#bfe0e8', skyMid:'#eaf3ee', skyBottom:'#fbe6c4',

    waterTop:'#bfe4df', waterBottom:'#4c8a92',

    body:'#fff2cf', bodyGlow:'#ffdf9e', bodyCore:'#fffaf0',

    silhouette:'#16262b',

    reflect:'#c98b2e',

    starColor:'#ffffff'

  }

};

function hexToRgbObj(h){

  h = h.replace('#','');

  return { r:parseInt(h.substring(0,2),16), g:parseInt(h.substring(2,4),16), b:parseInt(h.substring(4,6),16) };

}

function lerpRgb(h1,h2,tt){

  const c1=hexToRgbObj(h1), c2=hexToRgbObj(h2);

  return { r:c1.r+(c2.r-c1.r)*tt, g:c1.g+(c2.g-c1.g)*tt, b:c1.b+(c2.b-c1.b)*tt };

}

let modeMix = 0; // 0 = gece, 1 = gündüz

function pal(key, a){

  const c = lerpRgb(PALETTE.night[key], PALETTE.day[key], modeMix);

  if(a===undefined) return `rgb(${c.r|0},${c.g|0},${c.b|0})`;

  return `rgba(${c.r|0},${c.g|0},${c.b|0},${Math.max(0,a)})`;

}

/* --- dalga katmanları --- */

const WAVE_LAYERS = [

  { ampScale:0.34, freq:10, speed:0.55, key:'waterBottom', baseFactor:0.05 },

  { ampScale:0.20, freq:16, speed:0.8,  key:'waterTop',    baseFactor:0.02 },

];

function waveY(p, e, layer, horizonY){

  const amp = (6+e.bass*26) * layer.ampScale * 3.4;

  const baseY = horizonY + (H-horizonY)*(0.05+layer.baseFactor);

  return baseY

    + Math.sin(p*layer.freq + t*layer.speed)*amp

    + Math.sin(p*layer.freq*2.3 - t*layer.speed*1.6)*amp*0.35;

}

function drawWaveLayer(layer, e, horizonY){

  ctx.beginPath();

  ctx.moveTo(0,H+4);

  const steps=40;

  for(let i=0;i<=steps;i++){

    const p=i/steps;

    ctx.lineTo(p*W, waveY(p,e,layer,horizonY));

  }

  ctx.lineTo(W,H+4);

  ctx.closePath();

  ctx.fillStyle = pal(layer.key, 0.92);

  ctx.fill();

}

/* --- ay/güneş yansıması --- */

function drawReflection(bodyX, horizonY, e){

  const rows=26;

  const bandBase = W*0.1;

  for(let i=0;i<rows;i++){

    const p = i/rows;

    const y = horizonY+6+p*(H-horizonY)*0.85;

    const fade = 1-p*0.85;

    const jitter = (Math.pow(Math.random(),2)-0.3) * (12+e.treble*38) * fade;

    const w = (bandBase*(1-p*0.55) + jitter) * (0.6+e.energy*0.6);

    const cx = bodyX + Math.sin(p*22 + t*1.3) * (4+(1-p)*10);

    const h = 1.3 + Math.random()*2*fade;

    ctx.fillStyle = pal('reflect', (0.1+Math.random()*0.2)*fade*(0.5+e.treble*0.8));

    ctx.fillRect(cx-w/2, y, Math.max(0,w), h);

  }

}

/* --- yüzey ışıltıları (deniz ışıltısı) --- */

let glints = [];

function updateGlints(e, horizonY, dt){

  const spawnChance = (0.12+e.treble*0.55) * (playing?1:0.15);

  if(Math.random() < spawnChance){

    let p = Math.random();

    if(Math.random()<0.25) p = 0.46 + (Math.random()-0.5)*0.12;

    const y = waveY(p, e, WAVE_LAYERS[1], horizonY) - Math.random()*3;

    glints.push({ x:p*W, y, life:1, size:0.6+Math.random()*1.5, decay:0.8+Math.random()*1.3 });

  }

  glints.forEach(g=> g.life -= dt*g.decay);

  glints = glints.filter(g=>g.life>0);

}

function drawGlints(){

  glints.forEach(g=>{

    ctx.beginPath();

    ctx.arc(g.x, g.y, g.size*Math.max(0,g.life), 0, 7);

    ctx.fillStyle = pal('reflect', Math.max(0,g.life)*0.85);

    ctx.fill();

  });

}

/* --- sandal + balıkçı rig hesaplaması --- */

function computeRig(e, horizonY){

  const layer = WAVE_LAYERS[1];

  const boatP = 0.46;

  const waterYc = waveY(boatP, e, layer, horizonY);

  const slope = waveY(boatP+0.015, e, layer, horizonY) - waveY(boatP-0.015, e, layer, horizonY);

  const rot = Math.atan2(slope, 0.035*W) * 0.35;

  const bx = boatP*W;

  const by = waterYc - H*0.010;

  const scale = Math.min(W,H)*0.0026;

  const cosR = Math.cos(rot), sinR = Math.sin(rot);

  function toWorld(lx,ly){

    return { x: bx + (lx*cosR - ly*sinR)*scale, y: by + (lx*sinR + ly*cosR)*scale };

  }

  const hand = toWorld(20,-34);

  const rodLen = Math.min(W,H)*0.11;

  const restAngle = -1.05;

  const rodAngle = restAngle + rot*0.5 + catchRodBend;

  const rodTip = { x: hand.x + Math.cos(rodAngle)*rodLen, y: hand.y + Math.sin(rodAngle)*rodLen };

  const bobberP = boatP + 0.155;

  const bobber = { x: bobberP*W, y: waveY(bobberP, e, layer, horizonY) };

  return { boatP, bx, by, rot, scale, hand, rodTip, bobber };

}

/* --- balık tutma dizisi --- */

const CATCH_PHASES = [

  { name:'bite', dur:0.5 },

  { name:'pull', dur:0.7 },

  { name:'leap', dur:0.55 },

  { name:'reel', dur:0.9 },

  { name:'release', dur:0.8 },

];

let catchPhaseIdx = null;

let catchElapsed = 0;

let nextCatchIn = 14;

let catchRodBend = 0;

let fishAlpha = 0;

let fishLift = 0;

let catchBurstFlags = {};

function updateCatch(dt, horizonY, e, rig){

  if(!playing){

    catchRodBend += (0-catchRodBend)*Math.min(1,dt*3);

    return;

  }

  if(catchPhaseIdx===null){

    nextCatchIn -= dt;

    catchRodBend += (0-catchRodBend)*Math.min(1,dt*3);

    if(nextCatchIn<=0){

      catchPhaseIdx = 0; catchElapsed = 0; catchBurstFlags = {};

    }

    return;

  }

  catchElapsed += dt;

  const ph = CATCH_PHASES[catchPhaseIdx];

  const p = Math.min(1, catchElapsed/ph.dur);

  const b = rig.bobber;

  if(ph.name==='bite'){

    catchRodBend = Math.sin(p*Math.PI*6)*0.045*(1-p*0.3);

    if(p>0.15 && !catchBurstFlags.bite){

      burst(b.x,b.y,6,'--foam',0.8,26,{gravity:0.05,drag:0.92,r0:0.6,r1:1.4});

      catchBurstFlags.bite = true;

    }

  } else if(ph.name==='pull'){

    catchRodBend = 0.06 + p*0.30;

    if(p>0.1 && !catchBurstFlags.pull){

      splashSound(0.45);

      burst(b.x,b.y,14,'--foam',1.6,34,{gravity:0.08,drag:0.93,r0:0.8,r1:2});

      catchBurstFlags.pull = true;

    }

  } else if(ph.name==='leap'){

    if(!catchBurstFlags.leap){

      splashSound(0.85);

      burst(b.x,b.y,22,'--foam',2.4,42,{gravity:0.1,drag:0.94,r0:1,r1:2.6});

      catchBurstFlags.leap = true;

    }

    catchRodBend = 0.36 - p*0.06;

    fishLift = p*0.5;

    fishAlpha = Math.min(1, p*3);

  } else if(ph.name==='reel'){

    catchRodBend = 0.30 - p*0.24;

    fishLift = 0.5 + p*0.5;

    fishAlpha = 1;

    if(p>0.85 && !catchBurstFlags.reel){

      burst(rig.hand.x+10, rig.hand.y-30, 16, '--a1', 1.4, 30, {gravity:-0.02, drag:0.95, r0:0.6, r1:1.6});

      shakeStage(0.7);

      catchBurstFlags.reel = true;

    }

  } else if(ph.name==='release'){

    catchRodBend = 0.06*(1-p);

    fishLift = 1;

    fishAlpha = 1-p;

  }

  if(p>=1){

    catchElapsed = 0; catchPhaseIdx++;

    if(catchPhaseIdx >= CATCH_PHASES.length){

      catchPhaseIdx = null; catchRodBend = 0; fishAlpha = 0; fishLift = 0;

      nextCatchIn = 16 + Math.random()*22;

    }

  }

}

function fishWorldPos(rig){

  const b = rig.bobber;

  const target = { x: rig.hand.x+18, y: rig.hand.y-6 };

  const arc = Math.sin(Math.min(1,fishLift)*Math.PI)*38;

  return {

    x: b.x + (target.x-b.x)*Math.min(1,fishLift),

    y: b.y + (target.y-b.y)*Math.min(1,fishLift) - arc

  };

}

function drawFish(pos){

  ctx.save();

  ctx.globalAlpha = Math.max(0,fishAlpha);

  ctx.translate(pos.x,pos.y);

  const wig = Math.sin(t*14)*0.15;

  ctx.rotate(wig - 0.3);

  ctx.beginPath();

  ctx.moveTo(-9,0);

  ctx.quadraticCurveTo(-4,-5,5,0);

  ctx.quadraticCurveTo(-4,5,-9,0);

  ctx.closePath();

  ctx.fillStyle = pal('silhouette',1);

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(5,0); ctx.lineTo(11,-4); ctx.lineTo(11,4); ctx.closePath();

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(-2,-1.5); ctx.lineTo(2,-3);

  ctx.strokeStyle = pal('reflect',0.8); ctx.lineWidth=0.6; ctx.stroke();

  ctx.restore();

}

function drawBoatScene(rig){

  const { bx, by, rot, scale, hand, rodTip, bobber } = rig;

  ctx.save();

  ctx.translate(bx,by);

  ctx.rotate(rot);

  ctx.scale(scale,scale);

  const sil = pal('silhouette',1);

  ctx.fillStyle = sil;

  ctx.beginPath();

  ctx.moveTo(-95,0);

  ctx.quadraticCurveTo(-70,24,0,28);

  ctx.quadraticCurveTo(70,24,95,0);

  ctx.quadraticCurveTo(55,-10,0,-11);

  ctx.quadraticCurveTo(-55,-10,-95,0);

  ctx.closePath();

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(-86,-3);

  ctx.quadraticCurveTo(0,-13,86,-3);

  ctx.strokeStyle = pal('reflect',0.45);

  ctx.lineWidth = 1.3;

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(-16,-9);

  ctx.bezierCurveTo(-18,-32,-6,-50,5,-52);

  ctx.bezierCurveTo(16,-50,17,-35,13,-25);

  ctx.bezierCurveTo(22,-21,24,-11,19,-7);

  ctx.bezierCurveTo(6,-11,-8,-11,-16,-9);

  ctx.closePath();

  ctx.fillStyle = sil;

  ctx.fill();

  ctx.beginPath(); ctx.arc(7,-58,8.4,0,7); ctx.fill();

  ctx.beginPath(); ctx.ellipse(7,-64,10,3.2,0,0,7); ctx.fill();

  ctx.restore();

  ctx.beginPath();

  ctx.moveTo(hand.x,hand.y);

function drawSea(e, horizonY, rig){

    ctx.lineWidth = 1;

    for(let i=0;i<10;i++){

      const ang = (i/10)*Math.PI*2 + t*0.04;

      ctx.beginPath();

      ctx.moveTo(bodyX+Math.cos(ang)*bodyR*1.3, bodyY+Math.sin(ang)*bodyR*1.3);

      ctx.lineTo(bodyX+Math.cos(ang)*bodyR*3.4, bodyY+Math.sin(ang)*bodyR*3.4);

      ctx.stroke();

    }

    ctx.restore();

  }

  const bodyGrad = ctx.createRadialGradient(bodyX-bodyR*0.25,bodyY-bodyR*0.25,bodyR*0.1, bodyX,bodyY,bodyR);

  bodyGrad.addColorStop(0, pal('bodyCore'));

  bodyGrad.addColorStop(1, pal('body'));

  ctx.fillStyle = bodyGrad;

  ctx.beginPath(); ctx.arc(bodyX,bodyY,bodyR,0,7); ctx.fill();

  if(modeMix<0.7){

    ctx.globalAlpha = (1-modeMix)*0.16;

    ctx.fillStyle = pal('skyMid');

    craters.forEach(c=>{

      ctx.beginPath();

      ctx.arc(bodyX+c.dx*bodyR, bodyY+c.dy*bodyR, c.r*bodyR, 0, 7);

      ctx.fill();

    });

    ctx.globalAlpha = 1;

  }

  const fogGrad = ctx.createLinearGradient(0,horizonY-36,0,horizonY+22);

  fogGrad.addColorStop(0, pal('skyBottom',0));

  fogGrad.addColorStop(0.5, pal('skyBottom',0.3));

  fogGrad.addColorStop(1, pal('waterTop',0));

  ctx.fillRect(0,horizonY-36,W,58);

  const waterGrad = ctx.createLinearGradient(0,horizonY,0,H);

  waterGrad.addColorStop(0, pal('waterTop'));

  waterGrad.addColorStop(1, pal('waterBottom'));

  ctx.fillStyle = waterGrad;

  ctx.fillRect(0,horizonY-2,W,H-horizonY+2);

  drawReflection(bodyX, horizonY, e);

  drawWaveLayer(WAVE_LAYERS[0], e, horizonY);

  drawGlints();

  drawWaveLayer(WAVE_LAYERS[1], e, horizonY);

  drawBoatScene(rig);

  drawSparks(true);

}

let lastResize = 0;

let lastFrameTime = performance.now();

function render(){

  const now = performance.now();

  let dt = (now-lastFrameTime)/1000;

  lastFrameTime = now;

  if(!isFinite(dt) || dt<=0) dt = 1/60;

  dt = Math.min(dt, 0.05);

  const nowMs = Date.now();

  if(nowMs - lastResize > 500){ resize(); lastResize = nowMs; }

  t += dt*2.7;

  const modeTarget = currentMode==='light' ? 1 : 0;

  modeMix += (modeTarget-modeMix) * Math.min(1, dt*1.4);

  const sensBoost = 0.55 + (parseFloat(sensEl.value)/100)*1.1;

  const bars = getBars(sensBoost);

  const e = analyze(bars, sensBoost);

  updateMeter(bars);

  phone.style.setProperty('--lvl', playing ? Math.min(1, e.bass*1.3) : 0);

  const horizonY = H*0.60;

  const rig = computeRig(e, horizonY);

  updateCatch(dt, horizonY, e, rig);

  updateGlints(e, horizonY, dt);

  drawSea(e, horizonY, rig);

  requestAnimationFrame(render);

}

setMode('dark');

sensVal.textContent = sensEl.value;

boostVal.textContent = boostEl.value;

resize();

render();

 cx.quadraticCurveTo(0,(3+wind*0.4)*u,(24+wind*1.5)*u,(-8-Math.max(0,wind)*0.9)*u);
 cx.bezierCurveTo(26*u,-44*u,20*u,-74*u,13*u,-94*u);
 cx.quadraticCurveTo(0,-103*u,-13*u,-94*u);
 cx.closePath();cx.fill();
 cx.beginPath();cx.arc(0,-108*u,9.5*u,0,6.283);cx.fill();
 cx.beginPath();cx.moveTo(-12*u,-97*u);cx.quadraticCurveTo(0,-124*u,12*u,-97*u);cx.quadraticCurveTo(0,-106*u,-12*u,-97*u);cx.closePath();cx.fill();
 cx.lineWidth=5*u;cx.lineCap='round';
 cx.beginPath();cx.moveTo(9*u,-88*u);cx.lineTo(27*u,-118*u);cx.stroke();
 cx.lineWidth=1.2*u;
 cx.beginPath();cx.moveTo(27*u,-118*u);cx.lineTo(31*u,-105*u);cx.stroke();
 var flick=0.72+0.28*(0.5+0.5*Math.sin(T*7)+0.5*Math.sin(T*13.7));
 var lg2=cx.createRadialGradient(33*u,-96*u,1,33*u,-96*u,42*u*flick);
 lg2.addColorStop(0,'rgba(255,224,150,'+(0.55*flick).toFixed(3)+')');
 lg2.addColorStop(0.35,'rgba(242,177,85,'+(0.16*flick).toFixed(3)+')');
 lg2.addColorStop(1,'rgba(242,177,85,0)');
 cx.fillStyle=lg2;cx.beginPath();cx.arc(33*u,-96*u,42*u*flick,0,6.283);cx.fill();
 cx.fillStyle='#f6c877';cx.beginPath();cx.arc(33*u,-96*u,4.6*u,0,6.283);cx.fill();
 cx.lineWidth=1.4*u;
 cx.strokeRect(29*u,-101*u,8*u,11*u);
 cx.beginPath();cx.moveTo(29*u,-101*u);cx.lineTo(33*u,-105*u);cx.lineTo(37*u,-101*u);cx.stroke();
 cx.restore();
 if(flash>0.01){cx.fillStyle='rgba(150,230,220,'+(flash*0.07).toFixed(3)+')';cx.fillRect(0,0,W,H);}
}

function loop(now){
 if(!running)return;
 var dt=(now-last)/1000;last=now;
 if(!(dt>0))dt=1/60;dt=Math.min(dt,0.05);
 update(dt);draw();
 requestAnimationFrame(loop);
}

function resetAll(){
 mkStars();constA=0;wisps=[];wispTimer=1.4;glints=[];ripples=[];risers=[];meteors=[];birds=[];smoke=[];birdTimer=6;riserTimer=5;flash=0;
}

cv.addEventListener('pointerdown',function(e){
 var r=cv.getBoundingClientRect();
 var x=e.clientX-r.left,y=e.clientY-r.top;
 meteors.push({x:x,y:Math.min(y,H*0.45),vx:240+Math.random()*140,vy:110+Math.random()*90,life:1});
 flash=Math.min(1,flash+0.3);
 chime(620+Math.random()*260,0.05);
 spawnWisp();
});

var endCard=document.getElementById('introEnd');
document.getElementById('introEnter').addEventListener('click',function(){
 intro.classList.add('entering');
 chime(329.63,0.07);
 setTimeout(function(){chime(493.88,0.06);},170);
 setTimeout(function(){chime(659.25,0.055);},350);
 setTimeout(function(){chime(987.77,0.045);},540);
 setTimeout(function(){intro.classList.add('gone');},300);
 if(window.__MEHTAP_INTRO_DEMO__){
   setTimeout(function(){endCard.classList.add('show');},1500);
   setTimeout(function(){
     endCard.classList.remove('show');
     resetAll();
     intro.classList.remove('gone','entering');
     void intro.offsetWidth;
     intro.classList.add('play');
   },4300);
 }else{
   setTimeout(function(){intro.remove();running=false;},1900);
   setTimeout(function(){
     try{if(typeof togglePlay==='function')togglePlay();}catch(err){}
   },950);
 }
});

intro.classList.add('play');
requestAnimationFrame(function(n){last=n;requestAnimationFrame(loop);});
})();
