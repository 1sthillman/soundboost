<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rezonans — Sanat Serisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font-display:'Fraunces',serif;
    --font-ui:'Space Grotesk',sans-serif;
    /* Default theme colors (sumi) */
    --bg0:#080705;
    --bg1:#141210;
    --ink:#f1ece0;
    --ink-dim:#8d8577;
    --a1:#c1442c;
    --a2:#e9e2d0;
    --a3:#221f1a;
    --accent:#c1442c;
    --grain:.07;
  }

  /* ===== 10 art-directed worlds — each a genuinely different material & mood ===== */
  [data-theme="mehtap"]{--bg0:#040910;--bg1:#0c1e30;--ink:#eef2f5;--ink-dim:#6d7f92;--a1:#d9b46a;--a2:#4a6fa5;--a3:#122236;--a4:#f2b155;--accent:#f2b155;--grain:.035;--foam:#eef6fb;}
  [data-theme="mehtap"][data-mode="light"]{--bg0:#eaf1f2;--bg1:#f8fbf9;--ink:#16303a;--ink-dim:#6f8790;--a1:#c98b2e;--a2:#3c6e86;--a3:#dbe9e4;--a4:#c98b2e;--accent:#c98b2e;--grain:.014;}
  
  [data-theme="sumi"]{--bg0:#080705;--bg1:#141210;--ink:#f1ece0;--ink-dim:#8d8577;--a1:#c1442c;--a2:#e9e2d0;--a3:#221f1a;--accent:#c1442c;--grain:.07;}
  [data-theme="sumi"][data-mode="light"]{--bg0:#faf6f0;--bg1:#f1ece0;--ink:#141210;--ink-dim:#6d6a62;--a1:#c1442c;--a2:#9d5a34;--a3:#e7dfd0;--accent:#c1442c;--grain:.015;}
  
  [data-theme="aurora"]{--bg0:#02040a;--bg1:#061024;--ink:#eef5ff;--ink-dim:#6f83a8;--a1:#33e6a8;--a2:#8a6bff;--a3:#0b1730;--accent:#4fd8b0;--grain:.02;}
  [data-theme="aurora"][data-mode="light"]{--bg0:#f0f8ff;--bg1:#e6f2ff;--ink:#061024;--ink-dim:#4a6380;--a1:#00c896;--a2:#6b4fd8;--a3:#d8ecff;--accent:#00c896;--grain:.008;}
  
  /* Fener — Lighthouse with rotating beam and ship signaling */
  [data-theme="fener"]{--bg0:#040910;--bg1:#0c1e30;--ink:#eef2f5;--ink-dim:#6d7f92;--a1:#d9b46a;--a2:#4a6fa5;--a3:#122236;--a4:#f2b155;--accent:#f2b155;--grain:.035;--foam:#eef6fb;}
  [data-theme="fener"][data-mode="light"]{--bg0:#e9f0f1;--bg1:#f8fbf9;--ink:#16303a;--ink-dim:#6f8790;--a1:#c98b2e;--a2:#3c6e86;--a3:#dbe9e4;--a4:#c98b2e;--accent:#c98b2e;--grain:.014;}
  
  /* Orman — Göl Kenarında Ateş (Ay Işığı Kampı) */
  [data-theme="orman"]{--bg0:#020a16;--bg1:#0a2036;--ink:#e8f1fa;--ink-dim:#6d87a0;--accent:#ffb35c;--grain:.05;}
  [data-theme="orman"][data-mode="light"]{--bg0:#dfe9f2;--bg1:#f2f6fa;--ink:#152a3d;--ink-dim:#6d8296;--accent:#e08a2e;--grain:.018;}
  
  [data-theme="reef"]{--bg0:#010a10;--bg1:#03151f;--ink:#d7fbff;--ink-dim:#487d88;--a1:#12e0bd;--a2:#ff6bcf;--a3:#062028;--accent:#12e0bd;--grain:.02;}
  [data-theme="reef"][data-mode="light"]{--bg0:#f0fcff;--bg1:#e0f8fc;--ink:#03151f;--ink-dim:#2a4d58;--a1:#00c0a0;--a2:#e6009d;--a3:#c8eff5;--accent:#00c0a0;--grain:.01;}
  
  [data-theme="monsoon"]{--bg0:#05070c;--bg1:#0e1420;--ink:#e9eef7;--ink-dim:#727f94;--a1:#9cc2ff;--a2:#b48bff;--a3:#181f2e;--accent:#9cc2ff;--grain:.045;}
  [data-theme="monsoon"][data-mode="light"]{--bg0:#f5f8ff;--bg1:#eaf0ff;--ink:#0e1420;--ink-dim:#4a5668;--a1:#5a8fe6;--a2:#8b5fd8;--a3:#dae4ff;--accent:#5a8fe6;--grain:.02;}
  
  /* Mürekkep — sumi ink bloomed in water, kintsugi gold veins */
  [data-theme="murekkep"]{--bg0:#0a0806;--bg1:#17120d;--ink:#f5ecd9;--ink-dim:#8a7860;--a1:#c9a227;--a2:#8b1e3f;--a3:#221a12;--a4:#c9a227;--accent:#c9a227;--grain:.04;}
  [data-theme="murekkep"][data-mode="light"]{--bg0:#f5ecd9;--bg1:#faf3e4;--ink:#221a12;--ink-dim:#8a7860;--a1:#a8841f;--a2:#7a1a37;--a3:#ecdfc0;--a4:#a8841f;--accent:#a8841f;--grain:.015;}
  
  /* Çöl — heat drifting over dunes of sand */
  [data-theme="col"]{--bg0:#0a0704;--bg1:#1a120a;--ink:#ffe9cf;--ink-dim:#8a6a4a;--a1:#ffb454;--a2:#ff7a3d;--a3:#2b1b0c;--a4:#ff7a3d;--accent:#ffb454;--grain:.04;}
  [data-theme="col"][data-mode="light"]{--bg0:#fff3e0;--bg1:#ffe6c2;--ink:#2b1b0c;--ink-dim:#8a6a4a;--a1:#d6832c;--a2:#c1442c;--a3:#f5d9ad;--a4:#c1442c;--accent:#d6832c;--grain:.02;}

  /* Divit — inkwell drop blooming in water with golden capillaries */
  [data-theme="divit"]{--bg0:#0a0d16;--bg1:#141a2c;--ink:#f2ede0;--ink-dim:#7a7566;--a1:#c9a35c;--a2:#8f98c9;--a3:#1c2238;--a4:#e8c77a;--accent:#c9a35c;--grain:.035;}
  [data-theme="divit"][data-mode="light"]{--bg0:#eef0e6;--bg1:#f8f9f3;--ink:#1b2036;--ink-dim:#82806f;--a1:#93711f;--a2:#4a5490;--a3:#dee1d1;--a4:#93711f;--accent:#93711f;--grain:.014;}

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{-webkit-tap-highlight-color:transparent;width:100%;height:100%;overflow:hidden;}
  body{
    display:flex;
    font-family:var(--font-ui);
    background:var(--bg0);
  }
  .phone{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    color:var(--ink);
    transition:color 1.1s ease;
    overflow:hidden;
  }
  .screen{
    position:absolute;
    inset:0;
    background:radial-gradient(120% 90% at 50% -10%, var(--bg1), var(--bg0) 65%);
    padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom) 18px;
    display:flex;
    flex-direction:column;
    gap:12px;
    height:100%;
    overflow-y:auto;
    transition:background 1.1s ease;
  }
  .sheen{
    display:none;
  }
  .grain{
    position:fixed;
    inset:0;
    pointer-events:none;
    mix-blend-mode:overlay;
    opacity:var(--grain,.03);
    z-index:5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:160px;
  }
  .vignette{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:4;
    box-shadow:inset 0 0 70px 10px rgba(0,0,0,.4);
  }

  .topbar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;flex-shrink:0;}
  .brand{font-family:var(--font-ui); font-weight:700; font-size:16px; letter-spacing:0.02em; margin:0; display:flex; align-items:baseline; gap:.15em;}
  .brand .re{color:var(--ink); font-weight:700;}
  .brand .zo{color:var(--accent); transition:color 1.1s ease; text-shadow:0 0 18px color-mix(in srgb, var(--accent) 55%, transparent); font-weight:700;}
  .brand .nans{color:var(--ink-dim); font-weight:600; font-family:var(--font-ui); font-size:14px; transition:color 1.1s ease;}
  .topright{display:flex; align-items:center; gap:10px;}
  .meter{display:flex; align-items:flex-end; gap:2.5px; height:14px;}
  .meter i{display:block; width:2.5px; border-radius:1px; background:var(--accent); height:2px; transition:background 1.1s ease; opacity:.85;}
  .now{font-size:11px; color:var(--ink-dim); margin:0; font-variant-numeric:tabular-nums; transition:color 1.1s ease;}

  .stage{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    flex:1 1 auto;
    min-height:180px;
    background:#000;
    z-index:2;
    transition:transform .05s ease-out, box-shadow .08s linear;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.05),
      0 18px 40px -14px rgba(0,0,0,.6),
      0 0 46px calc(var(--lvl, 0) * 34px) color-mix(in srgb, var(--accent) 40%, transparent);
  }
  canvas{display:block; width:100%; height:100%;}
  .stage-hint{
    position:absolute; inset:auto 0 13px 0; text-align:center; font-size:11px;
    color:var(--ink-dim); opacity:.9; pointer-events:none; letter-spacing:.01em;
    transition:opacity .5s ease, color 1.1s ease;
  }

  .track{margin-top:0;position:relative;z-index:2;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
  .track .track-info{flex:1;}
  .track h2{font-family:var(--font-display); font-weight:600; font-style:italic; font-size:20px; margin:0 0 2px; letter-spacing:-0.01em; transition:opacity .3s ease;}
  .track p{font-size:12px; color:var(--ink-dim); margin:0; transition:color 1.1s ease;}

  .transport{display:flex;align-items:center;gap:14px;position:relative;z-index:2;flex-shrink:0;}
  .playbtn{
    position:relative; width:54px; height:54px; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 100%, white 25%), var(--accent) 70%);
    color:var(--bg0); display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:transform .15s ease, background 1.1s ease, box-shadow .1s linear;
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.35),
      inset 0 -3px 5px rgba(0,0,0,.25),
      0 4px 14px -2px color-mix(in srgb, var(--accent) 60%, transparent),
      0 0 0 calc(4px + var(--lvl, 0) * 14px) color-mix(in srgb, var(--accent) calc(8% + var(--lvl,0) * 22%), transparent);
  }
  .playbtn:active{transform:scale(.92);}
  .playbtn svg{width:20px; height:20px; position:relative; z-index:1;}
  .ripple{
    position:absolute; inset:0; border-radius:50%; border:1.5px solid var(--accent);
    opacity:0; pointer-events:none;
  }
  .ripple.go{animation:rippleOut .55s ease-out;}
  @keyframes rippleOut{
    0%{transform:scale(.7); opacity:.65;}
    100%{transform:scale(1.9); opacity:0;}
  }
  .sliders{flex:1; display:flex; flex-direction:column; gap:10px;}
  .slider-row{display:flex; align-items:center; gap:10px;}
  .slider-row label{font-size:11px; color:var(--ink-dim); width:64px; flex-shrink:0; transition:color 1.1s ease;}
  .slider-row .val{font-size:10px; color:var(--ink-dim); width:30px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums; transition:color 1.1s ease;}
  input[type=range]{
    -webkit-appearance:none; appearance:none; flex:1; height:3px; border-radius:2px;
    background:color-mix(in srgb, var(--ink) 18%, transparent); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent); cursor:pointer; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    transition:background 1.1s ease;
  }
  input[type=range]::-moz-range-thumb{
    width:14px; height:14px; border:none; border-radius:50%;
    background:var(--accent); cursor:pointer; box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    transition:background 1.1s ease;
  }

  .themes{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;position:relative;z-index:2;border-top:1px solid color-mix(in srgb, var(--ink) 10%, transparent);padding-top:10px;transition:border-color 1.1s ease;flex-shrink:0;}
  .themes::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:5px 10px 7px; font-size:12px; font-weight:500; border-radius:20px;
    border:none; border-bottom:2px solid transparent;
    background:transparent; color:var(--ink-dim); cursor:pointer; font-family:var(--font-ui);
    display:flex; align-items:center; gap:6px; transition:all .25s ease, color 1.1s ease; white-space:nowrap;
  }
  .chip .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0; transition:transform .25s ease; box-shadow:0 0 6px 0 currentColor;}
  .chip.active{color:var(--ink); font-weight:700; background:color-mix(in srgb, var(--accent) 15%, transparent);}
  .chip.active .dot{transform:scale(1.3);}

  /* Mode Toggle (Dark/Light Switch) - now next to track title */
  .modeToggle{background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;flex-shrink:0;position:relative;}
  .modeSwitch{width:38px;height:20px;border-radius:20px;background:color-mix(in srgb, var(--ink) 18%, transparent);position:relative;transition:background 1.1s ease;flex-shrink:0;}
  .modeSwitch .thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--accent);transition:transform .35s cubic-bezier(.4,0,.2,1), background 1.1s ease;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4);}
  [data-mode="light"] .modeSwitch .thumb{transform:translateX(18px);}
  .modeSwitch .thumb svg{width:10px;height:10px;color:var(--bg0);}
  [data-mode="light"] .vignette{box-shadow:inset 0 0 70px 10px rgba(0,0,0,.08);}

  .navbar{
    display:flex;
    justify-content:space-around;
    padding:10px 0;
    margin-top:0;
    border-top:1px solid color-mix(in srgb, var(--ink) 12%, transparent);
    position:relative;
    z-index:2;
    transition:border-color 1.1s ease;
    flex-shrink:0;
  }
  .navitem{display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-dim); font-size:10px; background:none; border:none; font-family:var(--font-ui); cursor:pointer; transition:color 1.1s ease; padding:4px 8px;}
  .navitem.active{color:var(--ink);}
  .navitem svg{width:18px; height:18px;}
  .navlabel{display:block; white-space:nowrap;}



  @media (prefers-reduced-motion: reduce){
    .stage{transition:none;}
    .ripple.go{animation:none;}
  }
</style>
</head>
<body>

<div class="phone" id="phone" data-theme="mehtap">
    <div class="screen">
      <div class="grain"></div>
      <div class="vignette"></div>

      <div class="topbar">
        <p class="brand"><span class="re">ST</span><span class="zo"> HILLMAN</span><span class="nans"> BOOST</span></p>
        <div class="topright">
          <div class="meter" id="meter">
            <i></i><i></i><i></i><i></i><i></i>
          </div>
          <p class="now" id="clock">--:--</p>
        </div>
      </div>

      <div class="stage" id="stage">
        <canvas id="canvas"></canvas>
        <p class="stage-hint" id="stageHint" data-i18n="play_hint">Oynat'a basarak canlı sesi başlat</p>
      </div>

      <div class="track">
        <div class="track-info">
          <h2 id="trackTitle"></h2>
          <p id="trackSub"></p>
        </div>
        <!-- Mode Toggle (Dark/Light Switch) - moved here next to track title -->
        <button class="modeToggle" id="modeToggle" aria-label="Tema modu">
          <span class="modeSwitch"><span class="thumb" id="modeThumb"></span></span>
        </button>
      </div>

      <div class="transport">
        <button class="playbtn" id="playBtn" aria-label="Oynat">
          <span class="ripple" id="ripple"></span>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="sliders">
          <div class="slider-row">
            <label for="boost" data-i18n="boost">Yükseltme</label>
            <input type="range" id="boost" min="0" max="100" value="65">
            <span class="val" id="boostVal">65</span>
          </div>
          <div class="slider-row">
            <label for="sens" data-i18n="sensitivity">Hassasiyet</label>
            <input type="range" id="sens" min="0" max="100" value="45">
            <span class="val" id="sensVal">45</span>
          </div>
        </div>
      </div>

      <div class="themes" id="themes">
        <button class="chip active" data-theme="mehtap"><span class="dot" style="background:#f2b155;color:#f2b155"></span><span data-i18n-theme="mehtap">Mehtap</span></button>
        <button class="chip" data-theme="sumi"><span class="dot" style="background:#c1442c;color:#c1442c"></span><span data-i18n-theme="sumi">Sumi-e</span></button>
        <button class="chip" data-theme="aurora"><span class="dot" style="background:#4fd8b0;color:#4fd8b0"></span><span data-i18n-theme="aurora">Kutup Şafağı</span></button>
        <button class="chip" data-theme="fener"><span class="dot" style="background:#f2b155;color:#f2b155"></span><span data-i18n-theme="fener">Son Işık</span></button>
        <button class="chip" data-theme="orman"><span class="dot" style="background:#ffb35c;color:#ffb35c"></span><span data-i18n-theme="orman">Ay Kampı</span></button>
        <button class="chip" data-theme="mycel"><span class="dot" style="background:#6dffb0;color:#6dffb0"></span><span data-i18n-theme="mycel">Miselyum</span></button>
        <button class="chip" data-theme="reef"><span class="dot" style="background:#12e0bd;color:#12e0bd"></span><span data-i18n-theme="reef">Derin Işıltı</span></button>
        <button class="chip" data-theme="monsoon"><span class="dot" style="background:#9cc2ff;color:#9cc2ff"></span><span data-i18n-theme="monsoon">Muson</span></button>
        <button class="chip" data-theme="murekkep"><span class="dot" style="background:#c9a227;color:#c9a227"></span><span data-i18n-theme="murekkep">Mürekkep</span></button>
        <button class="chip" data-theme="col"><span class="dot" style="background:#ffb454;color:#ffb454"></span><span data-i18n-theme="col">Çöl</span></button>
        <button class="chip" data-theme="divit"><span class="dot" style="background:#c9a35c;color:#c9a35c"></span><span data-i18n-theme="divit">Divit</span></button>
      </div>

      <div class="navbar">
        <button class="navitem active" onclick="try { if(typeof AndroidBridge !== 'undefined') { AndroidBridge.navigateToHome(); } else { console.log('AndroidBridge not found'); } } catch(e) { console.error('Nav error:', e); }">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11l8-7 8 7v9a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg>
          <span class="navlabel" data-i18n="nav_home">Ana Sayfa</span>
        </button>
        <button class="navitem" onclick="try { if(typeof AndroidBridge !== 'undefined') { AndroidBridge.navigateToSettings(); } else { console.log('AndroidBridge not found'); } } catch(e) { console.error('Nav error:', e); }">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>
          <span class="navlabel" data-i18n="nav_settings">Ayarlar</span>
        </button>
        <button class="navitem" onclick="try { if(typeof AndroidBridge !== 'undefined') { AndroidBridge.navigateToEqualizer(); } else { console.log('AndroidBridge not found'); } } catch(e) { console.error('Nav error:', e); }">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 14h4v7H3zM10 6h4v15h-4zM17 11h4v10h-4z"/></svg>
          <span class="navlabel" data-i18n="nav_equalizer">Ekolayzer</span>
        </button>
        <button class="navitem" onclick="try { if(typeof AndroidBridge !== 'undefined') { AndroidBridge.navigateToLanguage(); } else { console.log('AndroidBridge not found'); } } catch(e) { console.error('Nav error:', e); }">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
          <span class="navlabel" data-i18n="nav_language">Dil</span>
        </button>
      </div>
    </div>

const phone = document.getElementById('phone');

/* ============ CANVAS SIZING ============ */
let W,H,DPR;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = canvas.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);

let cssCache = {};
function css(v){ return cssCache[v] || (cssCache[v] = getComputedStyle(phone).getPropertyValue(v).trim()); }
function alpha(colorVar, a){
  const hex = css(colorVar);
  const aa = Math.max(0,Math.min(1,a));
  const h = Math.round(aa*255).toString(16).padStart(2,'0');
  return hex.length===7 ? hex+h : hex;
}

/* ============ CLOCK ============ */
function tickClock(){
  const d = new Date();
  clockEl.textContent = d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
}
tickClock(); setInterval(tickClock, 15000);

/* ============ SCREEN SHAKE (used by Muson lightning & Nova shockwaves) ============ */
let shakeTimer = null;
function shakeStage(intensity){
  stageEl.style.transform = `translate(${(Math.random()-0.5)*intensity}px, ${(Math.random()-0.5)*intensity}px)`;
  clearTimeout(shakeTimer);
  shakeTimer = setTimeout(()=>{ stageEl.style.transform=''; }, 85);
}

/* ============ DARK/LIGHT MODE TOGGLE ============ */
const modeToggle = document.getElementById('modeToggle');
const modeThumb = document.getElementById('modeThumb');

const MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.4A9 9 0 1111.6 3a7 7 0 009.4 9.4z"/></svg>';
const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>';

function setMode(mode){
  currentMode = mode; // Update global mode variable for themes like orman
  phone.dataset.mode = mode;
  cssCache = {};  // Clear CSS cache to reload colors for canvas
  modeThumb.innerHTML = mode==='dark' ? MOON_ICON : SUN_ICON;
  modeToggle.setAttribute('aria-label', mode==='dark' ? 'Karanlık mod' : 'Aydınlık mod');
  
  // Notify Android
  try{
    if(typeof AndroidBridge !== 'undefined') {
      AndroidBridge.onModeChanged(mode);
    }
  }catch(e){
    console.log('AndroidBridge not available for mode change');
  }
}

// CRITICAL: Expose to window for Android access
window.setMode = setMode;

modeToggle.addEventListener('click', ()=>{
  setMode(phone.dataset.mode === 'dark' ? 'light' : 'dark');
});

// Android can set mode externally
window.setModeFromAndroid = function(mode){
  if(mode==='dark' || mode==='light') setMode(mode);
};

// Initialize with dark mode
setMode('dark');

  currentTheme = name;
  phone.dataset.theme = name;
  cssCache = {};

  const meta = i18n[currentLang].themes[name];
  trackTitle.style.opacity = 0;

    trackTitle.textContent = meta.title;
    trackSub.textContent = meta.sub;
    trackTitle.style.opacity = 1;
  }, 140);

  // reset every theme's persistent particle/state buffers
  sparks = []; inkSplats = []; sumiDust = null;
  auroraStars = null; auroraOrbPulse = 0;

  stormBolts = []; rainDrops = null; cloudSeed = null; fogSeed = null;
  // New themes
  murekkepBlob = null; murekkepDrops = [];
  colDuneSeed = null; colParticles = []; colSunPulse = 0;
  inkVeins = []; inkRipples = []; inkBlobT = 0;

/* =====================================================================
   REAL AUDIO ENGINE — a small generative ambient patch, analysed live
   via a real AnalyserNode. Nothing here is faked: the visuals below are
   driven by actual FFT / waveform data pulled from this audio graph.
   Signal path: voices -> lowpass -> bass shelf -> air shelf -> master
   -> compressor -> auto-panner -> analyser -> speakers, with a parallel
   feedback delay line fed by the arpeggio for spatial depth.
   ===================================================================== */

// === REAL AUDIO DATA FROM ANDROID ===
let useRealAudioData = false;
let realAudioData = null;
let lastRealDataTime = 0;
const REAL_DATA_TIMEOUT = 200; // ms - eğer 200ms veri gelmezse mock'a geç

// Android'den gerçek audio data'yı alacak API
window.updateRealAudioData = function(audioDataJson) {
  try {
    realAudioData = JSON.parse(audioDataJson);
    lastRealDataTime = Date.now();
    useRealAudioData = true;
  } catch(e) {
    console.error('Failed to parse audio data:', e);
  }
};

let actx, analyser, freqData, timeData;
let master, bassShelf, lowpass, airShelf, comp, panner, panLfo, panLfoGain;
let delay, delayFeedback, delayFilter, delayOut;
let lfo, lfoGain;
let padOscs = [];
let padDetuneLfos = [];
let chordIdx = 0;
let chordTimer=null, arpTimer=null, hatTimer=null, kickTimer=null;
let playing = false;

const CHORDS = [
  [73.42, 110.00, 146.83, 174.61, 220.00],
  [65.41, 98.00, 130.81, 155.56, 196.00],
  [58.27, 87.31, 116.54, 138.59, 174.61],
  [61.74, 92.50, 123.47, 146.83, 185.00],
];

function initAudio(){
  actx = new (window.AudioContext||window.webkitAudioContext)();

  analyser = actx.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.78;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  timeData = new Uint8Array(analyser.fftSize);

  master = actx.createGain();
  master.gain.value = 0.0001;

  bassShelf = actx.createBiquadFilter();
  bassShelf.type = 'lowshelf';
  bassShelf.frequency.value = 220;
  bassShelf.gain.value = 0;

  lowpass = actx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 900;
  lowpass.Q.value = 0.6;

  airShelf = actx.createBiquadFilter();
  airShelf.type = 'highshelf';
  airShelf.frequency.value = 5200;
  airShelf.gain.value = 2.5;

  comp = actx.createDynamicsCompressor();
  comp.threshold.value = -20; comp.knee.value = 26; comp.ratio.value = 3.2;
  comp.attack.value = 0.005; comp.release.value = 0.22;

  panner = actx.createStereoPanner();
  panLfo = actx.createOscillator(); panLfo.frequency.value = 0.06;
  panLfoGain = actx.createGain(); panLfoGain.gain.value = 0.3;
  panLfo.connect(panLfoGain); panLfoGain.connect(panner.pan); panLfo.start();

  // spatial echo, fed only by the plucked arpeggio for a sense of depth
  delay = actx.createDelay(1.2); delay.delayTime.value = 0.36;
  delayFeedback = actx.createGain(); delayFeedback.gain.value = 0.36;
  delayFilter = actx.createBiquadFilter(); delayFilter.type = 'lowpass'; delayFilter.frequency.value = 2400;
  delay.connect(delayFilter); delayFilter.connect(delayFeedback); delayFeedback.connect(delay);
  delayOut = actx.createGain(); delayOut.gain.value = 0.55;
  delay.connect(delayOut);

  lowpass.connect(bassShelf);
  bassShelf.connect(airShelf);
  airShelf.connect(master);
  delayOut.connect(master);
  master.connect(comp);
  comp.connect(panner);
  panner.connect(analyser);
  analyser.connect(actx.destination);

  lfo = actx.createOscillator();
  lfo.frequency.value = 0.045;
  lfoGain = actx.createGain();
  lfoGain.gain.value = 260;
  lfo.connect(lfoGain);
  lfoGain.connect(lowpass.frequency);
  lfo.start();

  buildChordVoices(CHORDS[0]);
  applyBoost();
  applySensitivity();
}

function buildChordVoices(chord){
  padOscs.forEach(o=>{ try{o.stop();}catch(e){} });
  padDetuneLfos.forEach(o=>{ try{o.stop();}catch(e){} });
  padOscs = [];
  padDetuneLfos = [];
  chord.forEach((freq,i)=>{
    const o = actx.createOscillator();
    o.type = i===0 ? 'sine' : (i%2===0 ? 'triangle' : 'sawtooth');
    o.frequency.value = i===0 ? freq/2 : freq;
    const g = actx.createGain();
    g.gain.value = i===0 ? 0.22 : 0.045;
    o.connect(g); g.connect(lowpass);
    o.start();
    padOscs.push(o);

    if(i>0){
      // slow detune drift per voice — a gentle chorus, so the pad breathes
      const dl = actx.createOscillator(); dl.frequency.value = 0.028 + i*0.013;
      const dlg = actx.createGain(); dlg.gain.value = 3 + i*0.6;
      dl.connect(dlg); dlg.connect(o.detune); dl.start();
      padDetuneLfos.push(dl);
    }
  });

  // shimmer LFO on the echo's tone, for slow-moving spatial movement
  const shimmer = actx.createOscillator(); shimmer.frequency.value = 0.08;
  const shimmerGain = actx.createGain(); shimmerGain.gain.value = 650;
  shimmer.connect(shimmerGain); shimmerGain.connect(delayFilter.frequency);
  shimmer.start();
  padDetuneLfos.push(shimmer);
}

function advanceChord(){
  chordIdx = (chordIdx+1) % CHORDS.length;
  const chord = CHORDS[chordIdx];
  const now = actx.currentTime;
  padOscs.forEach((o,i)=>{
    if(o.frequency && chord[i] !== undefined){
      const target = i===0 ? chord[i]/2 : chord[i];
      o.frequency.linearRampToValueAtTime(target, now + 2.2);
    }
  });
}

function pluck(freq, when){
  const t0 = actx.currentTime + (when||0);
  const o = actx.createOscillator();
  o.type = 'triangle';
  o.frequency.value = freq;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.13, t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
  o.connect(g); g.connect(lowpass);
  const send = actx.createGain(); send.gain.value = 0.5;
  g.connect(send); send.connect(delay);
  o.start(t0); o.stop(t0+0.55);
}

function arpeggiate(){
  const chord = CHORDS[chordIdx];
  const root = chord[Math.floor(Math.random()*chord.length)];
  const notes = [root*2, root*2.5, root*3, root*2*1.5];
  notes.forEach((f,i)=> pluck(f, i*0.14));
}

function kick(){
  if(!actx) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(120, t0);
  o.frequency.exponentialRampToValueAtTime(38, t0+0.14);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.5, t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+0.32);
  o.connect(g); g.connect(bassShelf);
  o.start(t0); o.stop(t0+0.34);
}

function hat(){
  const dur = 0.045;
  const bufferSize = Math.floor(actx.sampleRate*dur);
  const buffer = actx.createBuffer(1, bufferSize, actx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
  const src = actx.createBufferSource();
  src.buffer = buffer;
  const hp = actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6500;
  const g = actx.createGain(); g.gain.value = 0.10 + Math.random()*0.05;
  src.connect(hp); hp.connect(g); g.connect(bassShelf);
  src.start();
}

// Debounce timers for slider updates
let boostDebounceTimer = null;
let sensDebounceTimer = null;

function applyBoost(){
  // CRITICAL: Prevent feedback loop from Kotlin updates

function applySensitivity(){
  if(!analyser) { sensVal.textContent = sensEl.value; return; }

  analyser.smoothingTimeConstant = 0.88 - (v/100)*0.58;
  if(airShelf) airShelf.gain.setTargetAtTime(1.2 + (v/100)*5.5, actx.currentTime, 0.12);
  sensVal.textContent = v;
  
  // DEBOUNCE: Only send to Kotlin after 150ms of no changes
  clearTimeout(sensDebounceTimer);
  sensDebounceTimer = setTimeout(() => {
    if(typeof AndroidBridge !== 'undefined') {
      console.log('📤 Sending sensitivity (debounced):', Math.floor(v));
      AndroidBridge.onSensitivityChanged(Math.floor(v));

}
