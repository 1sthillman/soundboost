function ormanRoundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function ormanDrawMan(x, gy, flick){
  const s = H/420;
  const c = '#03080f';
  
  // Log
  ctx.fillStyle = ormanPal('wood');
  ormanRoundRect(x-80*s, gy-15*s, 120*s, 12*s, 6*s); ctx.fill();
  ctx.fillStyle = ormanPal('wood');
  ctx.beginPath(); ctx.ellipse(x-80*s, gy-9*s, 5*s, 6*s, 0, 0, 7); ctx.fill();
  ctx.fillStyle = ormanPal('rockHi', 0.25);
  ctx.beginPath(); ctx.ellipse(x-80*s, gy-9*s, 2.5*s, 3*s, 0, 0, 7); ctx.fill();
  
  // Silhouette
  ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(x+4*s, gy-86*s, 12*s, 0, 7); ctx.fill();
  ctx.lineWidth = 20*s;
  ctx.beginPath();
  ctx.moveTo(x-6*s, gy-70*s);
  ctx.quadraticCurveTo(x-15*s, gy-46*s, x-8*s, gy-28*s);
  ctx.stroke();
  ctx.lineWidth = 9*s;
  ctx.beginPath();
  ctx.moveTo(x-4*s, gy-62*s);
  ctx.quadraticCurveTo(x+24*s, gy-52*s, x+44*s, gy-38*s);
  ctx.stroke();
  
  // Stick
  ctx.lineWidth = 3.5*s;
  ctx.beginPath();
  ctx.moveTo(x+40*s, gy-40*s);
  ctx.lineTo(x+80*s, gy-25*s);
  ctx.stroke();
  ctx.lineWidth = 13*s;
  ctx.beginPath();
  ctx.moveTo(x-8*s, gy-30*s);
  ctx.lineTo(x+26*s, gy-22*s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x+26*s, gy-22*s);
  ctx.lineTo(x+26*s, gy-4*s);
  ctx.stroke();
  
  // Fire rim light
  const rimA = 0.22 + flick*0.42;
  ctx.strokeStyle = ormanPal('glow', rimA); ctx.lineWidth = 1.6*s;
  ctx.beginPath(); ctx.arc(x+4*s, gy-86*s, 12*s, -1.25, 0.95); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x+3*s, gy-74*s);
  ctx.quadraticCurveTo(x+10*s, gy-52*s, x+5*s, gy-32*s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x+1*s, gy-62*s);
  ctx.quadraticCurveTo(x+26*s, gy-52*s, x+42*s, gy-40*s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x+1*s, gy-28*s);
  ctx.lineTo(x+24*s, gy-21*s);
  ctx.stroke();
}

function ormanDrawDog(x, gy, flick){
  const s = H/420;
  const c = '#03080f';
  
  ctx.fillStyle = c; ctx.strokeStyle = c; ctx.lineCap='round';
  ctx.beginPath(); ctx.ellipse(x+8*s, gy-17*s, 17*s, 15*s, 0, 0, 7); ctx.fill();
  ctx.lineWidth = 15*s;
  ctx.beginPath();
  ctx.moveTo(x+7*s, gy-24*s);
  ctx.quadraticCurveTo(x-6*s, gy-44*s, x-12*s, gy-52*s);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x-16*s, gy-58*s, 9.5*s, 0, 7); ctx.fill();
  
  // Ears
  ctx.beginPath();
  ctx.moveTo(x-22*s, gy-60*s);
  ctx.lineTo(x-34*s, gy-56*s);
  ctx.lineTo(x-21*s, gy-53*s);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x-11*s, gy-66*s);
  ctx.lineTo(x-5*s, gy-75*s);
  ctx.lineTo(x-16*s, gy-68*s);
  ctx.closePath(); ctx.fill();
  
  // Legs
  ctx.lineWidth = 5*s;
  ctx.beginPath(); ctx.moveTo(x-10*s, gy-40*s); ctx.lineTo(x-10*s, gy-3*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-2*s, gy-38*s); ctx.lineTo(x-2*s, gy-3*s); ctx.stroke();
  
  // Tail wag
  const wag = 0.3 + ormanWagBoost*0.6 + (playing?0.15:0);
  const a = Math.sin(t*9)*wag;
  ctx.lineWidth = 6*s;
  ctx.beginPath();
  ctx.moveTo(x+22*s, gy-24*s);
  ctx.quadraticCurveTo(x+(33+Math.sin(a)*5)*s, gy-(32+Math.cos(a)*7)*s, x+(35+Math.sin(a)*9)*s, gy-(42+Math.cos(a)*10)*s);
  ctx.stroke();
  
  // Fire rim light
  ctx.strokeStyle = ormanPal('glow', 0.18+flick*0.38); ctx.lineWidth = 1.5*s;
  ctx.beginPath(); ctx.arc(x-16*s, gy-58*s, 9.5*s, 2.1, 4.7); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x-3*s, gy-46*s);
  ctx.quadraticCurveTo(x-13*s, gy-48*s, x-16*s, gy-54*s);
  ctx.stroke();
}

function ormanFirePower(){
  return Math.max(0.15, Math.min(1.5, (sensEl.value/100)*0.7 + ormanFireBoost));
}

function ormanFireFlick(){
  const n = Math.sin(t*11.3) + Math.sin(t*5.1+1.3)*0.7 + Math.sin(t*23.7+4.1)*0.4;
  return Math.max(0, Math.min(1, 0.55 + n*0.24));
}

function ormanDrawFire(g, e, windAmt){
  const s = H/420;
  const x = g.fx, y = g.fy;
  const fPow = ormanFirePower();
  const flick = ormanFireFlick();
  const h = H*0.105*(0.62+fPow*0.5)*(1+e.bass*0.45);
  const w = 36*s*(0.8+fPow*0.3);
  const lean = windAmt*12*s + Math.sin(t*3.1)*2*s;
  
  // Stone pit
  for(let i=0;i<7;i++){
    const a = (i/7)*Math.PI*2 + 0.35;
    const sx = x + Math.cos(a)*30*s;
    const sy = y + 3*s + Math.sin(a)*7*s;
    ctx.fillStyle = ormanPal('rock');
    ctx.beginPath(); ctx.ellipse(sx, sy, 8*s, 5.5*s, Math.sin(a)*0.3, 0, 7); ctx.fill();
    ctx.fillStyle = ormanPal('rockHi', 0.35+flick*0.3);
    ctx.beginPath(); ctx.ellipse(sx-Math.cos(a)*1.5*s, sy-1.8*s, 5*s, 2.6*s, Math.sin(a)*0.3, 0, 7); ctx.fill();
  }
  
  // Logs
  ctx.strokeStyle = ormanPal('wood'); ctx.lineCap='round';
  ctx.lineWidth = 7*s;
  ctx.beginPath(); ctx.moveTo(x-22*s, y+7*s); ctx.lineTo(x+16*s, y-6*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+22*s, y+7*s); ctx.lineTo(x-16*s, y-6*s); ctx.stroke();
  ctx.strokeStyle = ormanPal('glow', 0.5+flick*0.3); ctx.lineWidth = 2.5*s;
  ctx.beginPath(); ctx.moveTo(x-8*s, y-1*s); ctx.lineTo(x+3*s, y-4*s); ctx.stroke();
  
  // Ember bed
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const bg = ctx.createRadialGradient(x, y, 2, x, y, 26*s);
  bg.addColorStop(0, ormanPal('fireMid', 0.5+flick*0.3));
  bg.addColorStop(1, ormanPal('fireOuter', 0));
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(x, y, 26*s, 10*s, 0, 0, 7); ctx.fill();
  
  // Flame layers
  const layers = [
    ['fireOuter', 0.5, 1.0],
    ['fireMid', 0.62, 0.68],
    ['fireCore', 0.9, 0.42]
  ];
  layers.forEach((L, li)=>{
    const sc = L[2];
    const wob = Math.sin(t*9+li*2.1)*0.13 + Math.sin(t*15.7+li*1.3)*0.06;
    const hh = h*sc*(1+wob*0.5+e.bass*0.12);
    const ww = w*sc*(1-wob*0.3);
    const tipX = x + lean*(1+li*0.35);
    const lg = ctx.createLinearGradient(0,y,0,y-hh);
    lg.addColorStop(0, ormanPal(L[0], L[1]));
    lg.addColorStop(0.75, ormanPal(L[0], L[1]*0.55));
    lg.addColorStop(1, ormanPal(L[0], 0));
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(x-ww/2, y);
    ctx.quadraticCurveTo(x-ww*0.85+lean*0.5, y-hh*0.52, tipX, y-hh);
    ctx.quadraticCurveTo(x+ww*0.85+lean*0.5, y-hh*0.52, x+ww/2, y);
    ctx.closePath(); ctx.fill();
  });
  ctx.restore();
  
  return {h, fPow, flick};
}

function ormanUpdateParticles(dt, g, e, windAmt, f){
  const fPow = ormanFirePower();
  
  // PERFORMANCE: Aggressive particle limits for smooth FPS
  const MAX_EMBERS = 30;
  const MAX_SMOKE = 12;
  const MAX_SPARKS = 60;
  const MAX_RIPPLES = 10;
  
  // Spawn embers
  if(ormanEmbers.length < MAX_EMBERS && Math.random() < 0.10 + fPow*0.45*(playing?1:0.4)){
    ormanEmbers.push({
      x: g.fx + (Math.random()-0.5)*20,
      y: g.fy - 14 - Math.random()*f.h*0.7,
      vx: (Math.random()-0.5)*14 + windAmt*26,
      vy: -(34+Math.random()*52),
      r: 0.6+Math.random()*1.7, life:1, decay:0.45+Math.random()*0.85,
      ph: Math.random()*7
    });
  }
  
  // Update embers
  ormanEmbers.forEach(m=>{
    m.x += m.vx*dt; m.y += m.vy*dt;
    m.vx += windAmt*22*dt; m.vy += 12*dt;
    m.life -= dt*m.decay;
  });
  ormanEmbers = ormanEmbers.filter(m=>m.life>0);
  
  // Spawn smoke
  if(ormanSmoke.length < MAX_SMOKE && Math.random() < 0.05+fPow*0.08){
    ormanSmoke.push({
      x:g.fx+(Math.random()-0.5)*12, y:g.fy-f.h*0.85,
      r:5+Math.random()*7, vy:-(16+Math.random()*14), life:1, decay:0.22+Math.random()*0.18
    });
  }
  
  // Update smoke
  ormanSmoke.forEach(sm=>{
    sm.y += sm.vy*dt;
    sm.x += (windAmt*30+Math.sin(t+sm.r)*6)*dt;
    sm.r += dt*10;
    sm.life -= dt*sm.decay;
  });
  ormanSmoke = ormanSmoke.filter(sm=>sm.life>0);
  
  // Update sparks - PERFORMANCE: Limit spark count
  if(ormanSparks.length > MAX_SPARKS) {
    ormanSparks = ormanSparks.slice(-MAX_SPARKS);
  }
  
  // Update ripples - PERFORMANCE: Limit ripple count
  ormanRipples.forEach(r=>{
    r.r += r.v*dt;
    r.life -= dt*r.decay;
  });
  ormanRipples = ormanRipples.filter(r=>r.life>0 && r.r < W*0.5);
  if(ormanRipples.length > MAX_RIPPLES) {
    ormanRipples = ormanRipples.slice(-MAX_RIPPLES);
  }
  
  // Update shooting star
  if(ormanShootingStar){
    ormanShootingStar.x += ormanShootingStar.vx*dt;
    ormanShootingStar.y += ormanShootingStar.vy*dt;
    ormanShootingStar.life -= dt*0.75;
    if(ormanShootingStar.life<=0 || ormanShootingStar.y>H*0.6) ormanShootingStar = null;
  }
  
  // Update sparks
  ormanSparks.forEach(s=>{
    s.x+=s.vx; s.y+=s.vy; s.vy+=s.grav; s.vx*=s.drag; s.vy*=s.drag; s.life-=s.decay;
  });
  ormanSparks = ormanSparks.filter(s=>s.life>0);
  
  // Decay boosts
  ormanWagBoost = Math.max(0, ormanWagBoost - dt*0.8);
  ormanFireBoost *= Math.pow(0.28, dt);
  ormanWaterPulse *= Math.pow(0.04, dt);
}

function ormanDrawParticles(g){
  // Smoke
  ormanSmoke.forEach(sm=>{
    ctx.fillStyle = ormanPal('smoke', Math.max(0, sm.life)*0.09);
    ctx.beginPath(); ctx.arc(sm.x, sm.y, sm.r, 0, 7); ctx.fill();
  });
  
  // Embers
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ormanEmbers.forEach(m=>{
    const tw = 0.5+0.5*Math.sin(t*6+m.ph);
    ctx.shadowColor = ormanPal('ember'); ctx.shadowBlur = 7;
    ctx.fillStyle = ormanPal('ember', Math.max(0,m.life)*(0.55+tw*0.45));
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r*(0.6+tw*0.5)*Math.max(0.3,m.life), 0, 7); ctx.fill();
  });
  ctx.restore();
  ctx.shadowBlur = 0;
  
  // Shooting star
  if(ormanShootingStar){
    const s2 = ormanShootingStar;
    const tx = s2.x - s2.vx*0.09, ty = s2.y - s2.vy*0.09;
    const gr = ctx.createLinearGradient(s2.x, s2.y, tx, ty);
    gr.addColorStop(0, `rgba(255,255,255,${0.9*Math.max(0,s2.life)})`);
    gr.addColorStop(1, 'rgba(160,200,255,0)');
    ctx.strokeStyle = gr; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(s2.x, s2.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${Math.max(0,s2.life)})`;
    ctx.beginPath(); ctx.arc(s2.x, s2.y, 1.8, 0, 7); ctx.fill();
  }
  
  // Sparks
  ormanSparks.forEach(s=>{
    ctx.beginPath(); ctx.arc(s.x,s.y,Math.max(0.2,s.r*s.life),0,7);
    ctx.shadowColor = s.color; ctx.shadowBlur = 8;
    ctx.fillStyle = s.color; ctx.globalAlpha = Math.max(0,s.life);
    ctx.fill(); ctx.globalAlpha=1; ctx.shadowBlur=0;
  });
}

function ormanDrawGrass(windAmt){
  ctx.strokeStyle = ormanPal('grass');
  ctx.lineWidth = 1.4; ctx.lineCap='round';
  ormanGrassTufts.forEach(gf=>{
    const bx = gf.x*W, by = gf.y*H;
    const sway = Math.sin(t*1.4+gf.ph)*windAmt*5;
    for(let b=-1;b<=1;b++){
      ctx.beginPath();
      ctx.moveTo(bx+b*2.5, by);
      ctx.quadraticCurveTo(bx+b*3+sway*0.4, by-gf.h*0.6, bx+b*4+sway, by-gf.h*(0.9+Math.abs(b)*-0.15));
      ctx.stroke();
    }
  });
}

function drawOrman(bars, wave, e){
  initOrman();
  
  const now = performance.now();
  if(!ormanLastFrameTime) ormanLastFrameTime = now;
  let dt = (now - ormanLastFrameTime) / 1000;
  ormanLastFrameTime = now;
  if(!isFinite(dt) || dt<=0) dt = 1/60;
  dt = Math.min(dt, 0.05);
  
  // Mode transition
  const modeTarget = currentMode==='light' ? 1 : 0;
  ormanModeMix += (modeTarget-ormanModeMix) * Math.min(1, dt*1.4);
  
  const windAmt = (sensEl.value/100);
  const g = ormanGeo();
  const flick = ormanFireFlick();
  
  // Beat detection - OPTIMIZED: Reduced particle count from 10 to 5
  if(e.beat){
    ormanBeatFlash = 1;
    ormanFireBoost = Math.min(1.4, ormanFireBoost+0.15);
    ormanWaterPulse = 1;
    for(let i=0;i<5;i++){
      ormanSparks.push({
        x: g.fx+(Math.random()-0.5)*18, y: g.fy-30,
        vx:(Math.random()-0.5)*1.2, vy:-(0.8+Math.random()*2),
        r:0.6+Math.random()*1.4, life:1, decay:1/(30+Math.random()*30),
        color: ormanPal('ember',1), grav:-0.006, drag:0.978
      });
    }
  }
  
  // Sky - OPTIMIZED: Use cached gradient
  const needsGradientUpdate = 
    !ormanGradientCache.sky || 
    Math.abs(ormanModeMix - ormanGradientCache.lastModeMix) > 0.1 ||
    W !== ormanGradientCache.lastW || 
    H !== ormanGradientCache.lastH;
  
  if(needsGradientUpdate) {
    ormanGradientCache.sky = ctx.createLinearGradient(0,0,0,g.skyH);
    ormanGradientCache.sky.addColorStop(0, ormanPal('skyTop'));
    ormanGradientCache.sky.addColorStop(0.62, ormanPal('skyMid'));
    ormanGradientCache.sky.addColorStop(1, ormanPal('skyHorizon'));
    
    ormanGradientCache.fog = ctx.createLinearGradient(0,g.waterTop-24,0,g.waterTop+14);
    ormanGradientCache.fog.addColorStop(0, ormanPal('skyHorizon',0));
    ormanGradientCache.fog.addColorStop(0.5, ormanPal('skyHorizon',0.28));
    ormanGradientCache.fog.addColorStop(1, ormanPal('waterTop',0));
    
    ormanGradientCache.lastModeMix = ormanModeMix;
    ormanGradientCache.lastW = W;
    ormanGradientCache.lastH = H;
  }
  
  ctx.fillStyle = ormanGradientCache.sky;
  ctx.fillRect(0,0,W,g.skyH+2);
  
  // Stars - OPTIMIZED: Batch rendering
  const starAlpha = Math.max(0, 1-ormanModeMix*1.7);
  if(starAlpha>0.01){
    const starColor = ormanPal('star', starAlpha);
    ormanStars.forEach(st=>{
      const tw = 0.5+0.5*Math.sin(t*st.speed+st.phase);
      const alpha = starAlpha*(0.35+tw*0.65)*st.baseA;
      ctx.fillStyle = starColor.replace(/[\d.]+\)$/,`${alpha})`); // Reuse color, just change alpha
      ctx.beginPath();
      ctx.arc(st.x*W, st.y*g.skyH*0.95, st.r*(0.6+tw*0.6), 0, 7);
      ctx.fill();
    });
  }
  
  // Moon
  const mR = Math.min(W,g.skyH)*0.075 + e.bass*3;
  const mg = ctx.createRadialGradient(g.mx,g.my,mR*0.15, g.mx,g.my,mR*7);
  mg.addColorStop(0, ormanPal('moonGlow', 0.5+e.energy*0.18));
  mg.addColorStop(0.35, ormanPal('moonGlow', 0.12));
  mg.addColorStop(1, ormanPal('moonGlow', 0));
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(g.mx,g.my,mR*7,0,7); ctx.fill();
  const bodyGrad = ctx.createRadialGradient(g.mx-mR*0.25,g.my-mR*0.25,mR*0.1, g.mx,g.my,mR);
  bodyGrad.addColorStop(0, ormanPal('moonCore'));
  bodyGrad.addColorStop(1, ormanPal('moonBody'));
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.arc(g.mx,g.my,mR,0,7); ctx.fill();
  
  // Ridges with pines
  const farPts = ormanDrawRidge(H*0.475, H*0.042, 1.3, 'ridgeFar', 0.08, e);
  ormanPinesFar.forEach(p=>{
    const i = Math.min(farPts.length-1, Math.floor(p.x*farPts.length));
    ormanDrawPine(p.x*W, farPts[i][1]+2, H*0.10*p.s, 'ridgeFar');
  });
  const midPts = ormanDrawRidge(H*0.53, H*0.055, 4.1, 'ridgeMid', 0.07, e);
  ormanPinesMid.forEach(p=>{
    const i = Math.min(midPts.length-1, Math.floor(p.x*midPts.length));
    ormanDrawPine(p.x*W, midPts[i][1]+2, H*0.13*p.s, 'ridgeMid');
  });
  
  // Fog band - OPTIMIZED: Use cached gradient
  ctx.fillStyle = ormanGradientCache.fog;
  ctx.fillRect(0,g.waterTop-24,W,40);
  
  // Water
  ormanDrawWater(e, g, flick);
  
  // Shore
  ormanDrawShore(g);
  
  // Ground fire glow
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const fPow = ormanFirePower();
  const gg2 = ctx.createRadialGradient(g.fx, g.fy-16, 8, g.fx, g.fy-16, W*0.36);
  gg2.addColorStop(0, ormanPal('glow', 0.22*flick+0.08*fPow));
  gg2.addColorStop(0.5, ormanPal('glow', 0.07*flick));
  gg2.addColorStop(1, ormanPal('glow', 0));
  ctx.fillStyle = gg2;
  ctx.fillRect(0, g.shoreY-6, W, H-g.shoreY+6);
  
  // Beat flash
  if(ormanBeatFlash>0.01){
    const bfg = ctx.createRadialGradient(g.fx, g.fy-30, 0, g.fx, g.fy-30, W*0.45);
    bfg.addColorStop(0, ormanPal('fireMid', 0.14*ormanBeatFlash));
    bfg.addColorStop(1, ormanPal('fireMid', 0));
    ctx.fillStyle = bfg;
    ctx.fillRect(0,0,W,H);
    ormanBeatFlash *= Math.pow(0.02, dt);
  }
  ctx.restore();
  
  // Scene elements
  ormanDrawTent(g, flick);
  ormanDrawMan(g.manX, g.fy, flick);
  ormanDrawDog(g.dogX, g.fy, flick);
  const fInfo = ormanDrawFire(g, e, windAmt);
  
  // Grass
  ormanDrawGrass(windAmt);
  
  // Particles
  ormanUpdateParticles(dt, g, e, windAmt, fInfo);
  ormanDrawParticles(g);
}

// Orman interaction handlers
let ormanTouchHandler = null;

function setupOrmanInteractions(){
  if(ormanTouchHandler) return; // Already setup
  
  ormanTouchHandler = (ev)=>{
    const r = stageEl.getBoundingClientRect();
    const x = ((ev.clientX - r.left) / r.width) * W;
    const y = ((ev.clientY - r.top) / r.height) * H;
    const g = ormanGeo();
    const s = H/420;
    
    // Touch water -> create ripples
    if(y > g.waterTop && y < g.shoreY){
      const ry = Math.min(Math.max(y, g.waterTop+8), g.shoreY-6);
      ormanRipples.push({x, y:ry, r:3, v:70+H*0.3, life:1, decay:0.85});
      ormanRipples.push({x, y:ry, r:1, v:44+H*0.18, life:1, decay:1.25});
      
      // Burst particles
      for(let i=0;i<8;i++){
        const ang = Math.random()*Math.PI*2;
        const sp = 1.0 * (0.45+Math.random()*0.9);
        ormanSparks.push({
          x, y:ry,
          vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
          r:0.5+Math.random()*1.2,
          life:1, decay:1/24,
          color:ormanPal('glint',1),
          grav:0.02, drag:0.965
        });
      }
    }
    // Touch fire -> stoke it
    else if(Math.hypot(x-g.fx, y-(g.fy-24*s)) < 58*s+18){
      ormanFireBoost = Math.min(1.4, ormanFireBoost+0.55);
      for(let i=0;i<22;i++){
        const ang = Math.random()*Math.PI*2;
        const sp = 1.6 * (0.45+Math.random()*0.9);
        ormanSparks.push({
          x: g.fx+(Math.random()-0.5)*22,
          y: g.fy-26,
          vx:Math.cos(ang)*sp,
          vy:Math.sin(ang)*sp - (1+Math.random()*2.6),
          r:0.7+Math.random()*1.7,
          life:1, decay:1/(28+Math.random()*34),
          color: ormanPal('ember',1),
          grav:-0.008, drag:0.975
        });
      }
    }
    // Touch man -> owl calls and dog wag
    else if(Math.hypot(x-(g.manX+4*s), y-(g.fy-86*s)) < 44){
      ormanWagBoost = Math.min(1.6, ormanWagBoost+0.8);
      for(let i=0;i<10;i++){
        const ang = Math.random()*Math.PI*2;
        const sp = 1.2 * (0.45+Math.random()*0.9);
        ormanSparks.push({
          x, y,
          vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
          r:0.5+Math.random()*1.5,
          life:1, decay:1/26,
          color:ormanPal('ember',1),
          grav:0.01, drag:0.965
        });
      }
    }
    // Touch dog -> bark and wag
    else if(Math.hypot(x-g.dogX, y-(g.fy-50*s)) < 42){
      ormanWagBoost = 1.8;
      for(let i=0;i<8;i++){
        const ang = Math.random()*Math.PI*2;
        const sp = 1.0 * (0.45+Math.random()*0.9);
        ormanSparks.push({
          x, y,
          vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
          r:0.5+Math.random()*1.5,
          life:1, decay:1/22,
          color:ormanPal('ember',1),
          grav:0.02, drag:0.965
        });
      }
    }
    // Touch sky -> shooting star
    else if(y < g.skyH){
      if(!ormanShootingStar){
        ormanShootingStar = {
          x: W*(0.25+Math.random()*0.55),
          y: H*(0.05+Math.random()*0.14),
          vx: -(220+Math.random()*160),
          vy: 90+Math.random()*70,
          life: 1
        };
      }
    }
    // Touch anywhere else -> small burst
    else {
      for(let i=0;i<6;i++){
        const ang = Math.random()*Math.PI*2;
        const sp = 0.5 * (0.45+Math.random()*0.9);
        ormanSparks.push({
          x, y,
          vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
          r:1.4+Math.random()*2.8,
          life:1, decay:1/20,
          color:ormanPal('smoke',1),
          grav:-0.004, drag:0.98
        });
      }
    }
  };
  
  stageEl.addEventListener('pointerdown', ormanTouchHandler);
}

function removeOrmanInteractions(){
  if(ormanTouchHandler){
    stageEl.removeEventListener('pointerdown', ormanTouchHandler);
    ormanTouchHandler = null;
  }
}

const RENDERERS = {
  mehtap: drawMehtap,
  sumi: drawSumi, aurora: drawAurora, fener: drawFener,
  orman: drawOrman,
  mycel: drawMycel, reef: drawReef, monsoon: drawMonsoon,
  murekkep: drawMurekkep, col: drawCol, divit: drawDivit,
};

let lastResize = 0;
function render(){
  // Only resize on actual window size changes (not every frame)
  const now = Date.now();
  if(now - lastResize > 500) { // Check every 500ms max
    resize();
    lastResize = now;
  }
  
  t += 0.045;
  const sensBoost = 0.55 + (parseFloat(sensEl.value)/100)*1.1;
  const bars = getBars(sensBoost);
  const wave = getWave();
  const e = analyze(bars, sensBoost);
  updateMeter(bars);
  phone.style.setProperty('--lvl', playing || useRealAudioData ? Math.min(1, e.bass*1.3) : 0);
  const fn = RENDERERS[currentTheme] || drawSumi;
  fn(bars, wave, e);
  requestAnimationFrame(render);
}

setTheme('sumi');
sensVal.textContent = sensEl.value;
boostVal.textContent = boostEl.value;
resize();
updateUI(); // Initialize all i18n texts
render();

// Map Kotlin volume value (60-200) to HTML slider value (0-100)
let isUpdatingFromKotlin = false; // FLAG to prevent feedback loop
window.setVolumeFromKotlin = function(kotlinValue) {
  const clamped = Math.max(60, Math.min(200, kotlinValue));
  const htmlValue = Math.round((clamped - 60) / 140 * 100); // 60→0, 200→100
  if(boostEl) {
    isUpdatingFromKotlin = true; // SET FLAG before updating
    boostEl.value = htmlValue;
    boostVal.textContent = htmlValue;
    isUpdatingFromKotlin = false; // CLEAR FLAG after updating
  }
  console.log('✅ Volume from Kotlin:', kotlinValue, '→ HTML slider:', htmlValue);
};

window.setThemeFromAndroid = function(themeName) {
  if(i18n[currentLang].themes[themeName]) {
    setTheme(themeName);
  }
};

window.setLanguage = function(lang) {
  console.log('🌐 Language change requested:', lang);
  if(!i18n[lang]) {
    console.error('❌ Language not found:', lang);
    return;
  }
  
  // Validate lang has all required keys
  if(!i18n[lang].boost || !i18n[lang].themes) {
    console.error('❌ Incomplete translations for:', lang);
    return;
  }
  
  currentLang = lang;
  console.log('✅ Language set to:', lang);
  
  // Use requestAnimationFrame for smooth DOM updates
  requestAnimationFrame(() => {
    try {
      updateUI();
      console.log('✅ UI updated successfully');
    } catch(e) {
      console.error('❌ Error updating UI:', e);
    }
  });
};

function updateUI() {
  console.log('🔄 Updating UI for language:', currentLang);
  
  try {
    // 1. Update labels with safe checks
    const i18nElements = document.querySelectorAll('[data-i18n]');
    console.log('Found', i18nElements.length, 'i18n elements');
    
    i18nElements.forEach(el => {
      try {
        const key = el.dataset.i18n;
        if(key && i18n[currentLang] && i18n[currentLang][key]) {
          el.textContent = i18n[currentLang][key];
        }
      } catch(e) {
        console.warn('Failed to update element:', el, e);
      }
    });
    
    // 2. Update stage hint safely
    if(stageHint && i18n[currentLang] && i18n[currentLang].play_hint) {
      stageHint.textContent = i18n[currentLang].play_hint;
    }
    
    // 3. Update theme chips with safe checks
    const themeChips = document.querySelectorAll('[data-i18n-theme]');
    console.log('Found', themeChips.length, 'theme chips');
    
    themeChips.forEach(chip => {
      try {
        const theme = chip.dataset.i18nTheme;
        if(theme && i18n[currentLang] && i18n[currentLang].themes && i18n[currentLang].themes[theme]) {
          chip.textContent = i18n[currentLang].themes[theme].label;
        }
      } catch(e) {
        console.warn('Failed to update chip:', chip, e);
      }
    });
    
    // 4. Update current theme title/subtitle with animation
    if(currentTheme && i18n[currentLang] && i18n[currentLang].themes && i18n[currentLang].themes[currentTheme]) {
      const meta = i18n[currentLang].themes[currentTheme];
      
      // Smooth fade transition
      if(trackTitle && trackSub) {
        trackTitle.style.opacity = '0';
        trackSub.style.opacity = '0';
        
        setTimeout(() => {
          try {
            trackTitle.textContent = meta.title;
            trackSub.textContent = meta.sub;
            trackTitle.style.opacity = '1';
            trackSub.style.opacity = '1';
          } catch(e) {
            console.warn('Failed to update track info:', e);
          }
        }, 150);
      }
    }
    
    console.log('✅ UI update completed');
  } catch(e) {
    console.error('❌ Critical error in updateUI:', e);
    // Don't crash - just log and continue
  }
}

// CRITICAL: Expose to window for Android access
window.updateUI = updateUI;

// ===== ONBOARDING: Element Position Tracking =====
window.getElementPosition = function(elementId) {
  const el = document.getElementById(elementId);
  if (!el) {
    console.warn('Element not found:', elementId);
    return null;
  }
  
  const rect = el.getBoundingClientRect();
  return {
    left: rect.left,
    top: rect.top,
    right: rect.right,
    bottom: rect.bottom,
    width: rect.width,
    height: rect.height
  };
};

// Get onboarding target positions
window.getOnboardingTargets = function() {
  return {
    playButton: getElementPosition('play'),
    volumeSlider: getElementPosition('vol'),
    sensitivitySlider: getElementPosition('sens'),
    themeChips: (function() {
      const container = document.querySelector('.theme-chips');
      if (container) {
        const rect = container.getBoundingClientRect();
        return {
          left: rect.left,
          top: rect.top,
          right: rect.right,
          bottom: rect.bottom,
          width: rect.width,
          height: rect.height
        };
      }
      return null;
    })()
  };
};
