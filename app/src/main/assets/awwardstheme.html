    ctx.arc(g.x,g.y,g.size*Math.max(0,g.life),0,7);
    ctx.fillStyle = pal('reflect',Math.max(0,g.life)*0.85);
    ctx.fill();
  });
  
  // Boat rig computation
  const boatP = 0.46;
  const waterYc = waveY(boatP,WAVE_LAYERS[1]);
  const slope = waveY(boatP+0.015,WAVE_LAYERS[1])-waveY(boatP-0.015,WAVE_LAYERS[1]);
  const rot = Math.atan2(slope,0.035*W)*0.35;
  const bx = boatP*W, by = waterYc-H*0.010, scale = Math.min(W,H)*0.0026;
  const cosR = Math.cos(rot), sinR = Math.sin(rot);
  const toWorld = (lx,ly) => ({x:bx+(lx*cosR-ly*sinR)*scale, y:by+(lx*sinR+ly*cosR)*scale});
  const hand = toWorld(20,-34);
  const rodAngle = -1.05+rot*0.5+st.catchRodBend;
  const rodLen = Math.min(W,H)*0.11;
  const rodTip = {x:hand.x+Math.cos(rodAngle)*rodLen, y:hand.y+Math.sin(rodAngle)*rodLen};
  const bobberP = boatP+0.155;
  const bobber = {x:bobberP*W, y:waveY(bobberP,WAVE_LAYERS[1])};
  
  // Fish catch system
  const dt = 0.016;
  if(!playing){
    st.catchRodBend += (0-st.catchRodBend)*Math.min(1,dt*3);
  } else {
    if(st.catchPhaseIdx===null){
      st.nextCatchIn -= dt;
      st.catchRodBend += (0-st.catchRodBend)*Math.min(1,dt*3);
      if(st.nextCatchIn<=0){
        st.catchPhaseIdx = 0;
        st.catchElapsed = 0;
        st.catchBurstFlags = {};
      }
    } else {
      st.catchElapsed += dt;
      const ph = CATCH_PHASES[st.catchPhaseIdx], p = Math.min(1,st.catchElapsed/ph.dur);
      if(ph.name==='bite'){
        st.catchRodBend = Math.sin(p*Math.PI*6)*0.045*(1-p*0.3);
        if(p>0.15&&!st.catchBurstFlags.bite){
          burst(bobber.x,bobber.y,6,css('--foam'),0.8,26,{gravity:0.05,drag:0.92,r0:0.6,r1:1.4});
          st.catchBurstFlags.bite=true;
        }
      } else if(ph.name==='pull'){
        st.catchRodBend = 0.06+p*0.30;
        if(p>0.1&&!st.catchBurstFlags.pull){
          burst(bobber.x,bobber.y,14,css('--foam'),1.6,34,{gravity:0.08,drag:0.93,r0:0.8,r1:2});
          st.catchBurstFlags.pull=true;
        }
      } else if(ph.name==='leap'){
        if(!st.catchBurstFlags.leap){
          burst(bobber.x,bobber.y,22,css('--foam'),2.4,42,{gravity:0.1,drag:0.94,r0:1,r1:2.6});
          st.catchBurstFlags.leap=true;
        }
        st.catchRodBend = 0.36-p*0.06;
        st.fishLift = p*0.5;
        st.fishAlpha = Math.min(1,p*3);
      } else if(ph.name==='reel'){
        st.catchRodBend = 0.30-p*0.24;
        st.fishLift = 0.5+p*0.5;
        st.fishAlpha = 1;
        if(p>0.85&&!st.catchBurstFlags.reel){
          burst(hand.x+10,hand.y-30,16,css('--a1'),1.4,30,{gravity:-0.02,drag:0.95,r0:0.6,r1:1.6});
          st.catchBurstFlags.reel=true;
        }
      } else if(ph.name==='release'){
        st.catchRodBend = 0.06*(1-p);
        st.fishLift = 1;
        st.fishAlpha = 1-p;
      }
      if(p>=1){
        st.catchElapsed = 0;
        st.catchPhaseIdx++;
        if(st.catchPhaseIdx>=CATCH_PHASES.length){
          st.catchPhaseIdx = null;
          st.catchRodBend = 0;
          st.fishAlpha = 0;
          st.fishLift = 0;
          st.nextCatchIn = 16+Math.random()*22;
        }
      }
    }
  }
  
  // Draw boat
  ctx.save();
  ctx.translate(bx,by);
  ctx.rotate(rot);
  ctx.scale(scale,scale);
  const sil = pal('silhouette',1);
  ctx.fillStyle = sil;
  ctx.beginPath();
  ctx.moveTo(-95,0);
  ctx.quadraticCurveTo(-70,24,0,28);
  ctx.quadraticCurveTo(70,24,95,0);
  ctx.quadraticCurveTo(55,-10,0,-11);
  ctx.quadraticCurveTo(-55,-10,-95,0);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-86,-3);
  ctx.quadraticCurveTo(0,-13,86,-3);
  ctx.strokeStyle = pal('reflect',0.45);
  ctx.lineWidth = 1.3;
  ctx.stroke();
  // Fisherman
  ctx.beginPath();
  ctx.moveTo(-16,-9);
  ctx.bezierCurveTo(-18,-32,-6,-50,5,-52);
  ctx.bezierCurveTo(16,-50,17,-35,13,-25);
  ctx.bezierCurveTo(22,-21,24,-11,19,-7);
  ctx.bezierCurveTo(6,-11,-8,-11,-16,-9);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(7,-58,8.4,0,7);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(7,-64,10,3.2,0,0,7);
  ctx.fill();
  ctx.restore();
  
  // Rod
  ctx.beginPath();
  ctx.moveTo(hand.x,hand.y);
  const sag = 4+Math.max(0,st.catchRodBend)*10;
  ctx.quadraticCurveTo((hand.x+rodTip.x)/2,(hand.y+rodTip.y)/2+sag*0.3,rodTip.x,rodTip.y);
  ctx.strokeStyle = sil;
  ctx.lineWidth = 1.6;
  ctx.stroke();
  
  // Fishing line
  const fishPos = st.fishAlpha>0.02 ? {x:bobber.x+(hand.x+18-bobber.x)*Math.min(1,st.fishLift), y:bobber.y+(hand.y-6-bobber.y)*Math.min(1,st.fishLift)-Math.sin(Math.min(1,st.fishLift)*Math.PI)*38} : bobber;
  const slack = st.fishAlpha>0.02 ? 2 : 10;
  ctx.beginPath();
  ctx.moveTo(rodTip.x,rodTip.y);
  ctx.quadraticCurveTo((rodTip.x+fishPos.x)/2,(rodTip.y+fishPos.y)/2+slack,fishPos.x,fishPos.y);
  ctx.strokeStyle = pal('reflect',0.55);
  ctx.lineWidth = 0.8;
  ctx.stroke();
  
  // Fish
  if(st.fishAlpha>0.02){
    ctx.save();
    ctx.globalAlpha = Math.max(0,st.fishAlpha);
    ctx.translate(fishPos.x,fishPos.y);
    const wig = Math.sin(t*14)*0.15;
    ctx.rotate(wig-0.3);
    ctx.beginPath();
    ctx.moveTo(-9,0);
    ctx.quadraticCurveTo(-4,-5,5,0);
    ctx.quadraticCurveTo(-4,5,-9,0);
    ctx.closePath();
    ctx.fillStyle = pal('silhouette',1);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(5,0);
    ctx.lineTo(11,-4);
    ctx.lineTo(11,4);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-2,-1.5);
    ctx.lineTo(2,-3);
    ctx.strokeStyle = pal('reflect',0.8);
    ctx.lineWidth = 0.6;
    ctx.stroke();
    ctx.restore();
  } else {
    // Bobber
    ctx.beginPath();
    ctx.arc(bobber.x,bobber.y,3+Math.sin(t*2)*0.6,0,7);
    ctx.strokeStyle = pal('reflect',0.25);
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }
  
  drawSparks(true);
}

/* ============================================================
   FENER THEME — "Son Işık" — Lighthouse with rotating beam
   Features: lighthouse, rotating beam, ship signaling, waves
   ============================================================ */

/* --- Color palette: night/day --- */
const PALETTE_FENER = {
  night:{
    skyTop:'#030810', skyMid:'#0b2033', skyBottom:'#17374f',
    waterTop:'#0d2738', waterBottom:'#03090f',
    body:'#e6edf3', bodyGlow:'#b9d1e6', bodyCore:'#fdfbf0',
    silhouette:'#02060b', rock:'#0a141e', tower:'#d8d3c4', towerBand:'#8e2f2f',
    reflect:'#d9b46a', starColor:'#eaf1ff', beam:'#ffe9b0', lamp:'#ffd98a'
  },
  day:{
    skyTop:'#a4cbda', skyMid:'#ecf4ef', skyBottom:'#fce3bc',
    waterTop:'#aad9d3', waterBottom:'#417f88',
    body:'#fff3d0', bodyGlow:'#ffdf9e', bodyCore:'#fffaf0',
    silhouette:'#16262b', rock:'#3d575d', tower:'#f3ead8', towerBand:'#b0552f',
    reflect:'#c98b2e', starColor:'#ffffff', beam:'#fff3cf', lamp:'#ffd27a'
  }
};

function hexToRgbObj(h){ h=h.replace('#',''); return {r:parseInt(h.substring(0,2),16),g:parseInt(h.substring(2,4),16),b:parseInt(h.substring(4,6),16)}; }
function lerpRgb(h1,h2,tt){ const c1=hexToRgbObj(h1),c2=hexToRgbObj(h2); return {r:c1.r+(c2.r-c1.r)*tt,g:c1.g+(c2.g-c1.g)*tt,b:c1.b+(c2.b-c1.b)*tt}; }

let fenerModeMix = 0;
function palFener(key, a){
  const c = lerpRgb(PALETTE_FENER.night[key], PALETTE_FENER.day[key], fenerModeMix);
  if(a===undefined) return `rgb(${c.r|0},${c.g|0},${c.b|0})`;
  return `rgba(${c.r|0},${c.g|0},${c.b|0},${Math.max(0,a)})`;
}

/* --- Stars --- */
let fenerStars = [];
function initFenerStars(){
  fenerStars = [];
  for(let i=0;i<110;i++){
    fenerStars.push({ x:Math.random(), y:Math.random()*0.75, r:0.5+Math.random()*1.3,
      phase:Math.random()*Math.PI*2, speed:0.3+Math.random()*1.1, baseA:0.4+Math.random()*0.6 });
  }
}
initFenerStars();

const fenerCraters = [
  {dx:-0.30,dy:-0.20,r:0.16},{dx:0.25,dy:0.15,r:0.12},{dx:0.05,dy:0.32,r:0.09},{dx:-0.15,dy:0.25,r:0.07}
];

/* --- Wave layers --- */
const WAVE_LAYERS_FENER = [
  { ampScale:0.34, freq:10, speed:0.55, key:'waterBottom', baseFactor:0.05 },
  { ampScale:0.20, freq:16, speed:0.8,  key:'waterTop',    baseFactor:0.02 },
];

function waveYFener(p, e, layer, horizonY){
  const amp = (6+e.bass*26) * layer.ampScale * 3.4;
  const baseY = horizonY + (H-horizonY)*(0.05+layer.baseFactor);
  return baseY + Math.sin(p*layer.freq + t*layer.speed)*amp + Math.sin(p*layer.freq*2.3 - t*layer.speed*1.6)*amp*0.35;
}

function drawWaveLayerFener(layer, e, horizonY){
  ctx.beginPath();
  ctx.moveTo(0,H+4);
  const steps=40;
  for(let i=0;i<=steps;i++){ const p=i/steps; ctx.lineTo(p*W, waveYFener(p,e,layer,horizonY)); }
  ctx.lineTo(W,H+4);
  ctx.closePath();
  ctx.fillStyle = palFener(layer.key, 0.92);
  ctx.fill();
}

/* --- Ship --- */
let fenerShipP = -0.25;
let fenerShipDir = 1;
let fenerShipLights = 0;
let fenerNextSignalIn = 12;
let fenerSignalPhase = null;

function fenerShipPos(e, horizonY){
  const layer = WAVE_LAYERS_FENER[1];
  const x = fenerShipP * W;
  const y = waveYFener(fenerShipP, e, layer, horizonY) - H*0.004;
  return {x, y};
}

function drawFenerShip(pos, e){
  const s = Math.min(W,H)*0.0016;
  ctx.save();
  ctx.translate(pos.x, pos.y);
  ctx.scale(s,s);
  const sil = palFener('silhouette',1);
  ctx.fillStyle = sil;
  /* hull */
  ctx.beginPath();
  ctx.moveTo(-70,0); ctx.lineTo(70,0); ctx.lineTo(56,-16); ctx.lineTo(-56,-16);
  ctx.closePath(); ctx.fill();
  /* superstructure + smokestack */
  ctx.fillRect(-18,-30,36,14);
  ctx.fillRect(6,-44,10,14);
  ctx.beginPath(); ctx.arc(-8,-34,4,0,7); ctx.fill();
  /* bridge lights */
  const glow = 0.25 + fenerShipLights*0.75;
  ctx.fillStyle = palFener('lamp', glow);
  for(let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(-10+i*10, -26, 2.4, 0, 7); ctx.fill(); }
  /* mast tip */
  ctx.strokeStyle = sil; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,-30); ctx.lineTo(0,-58); ctx.stroke();
  ctx.fillStyle = palFener('lamp', glow);
  ctx.beginPath(); ctx.arc(0,-58,2.8,0,7); ctx.fill();
  ctx.restore();
  /* smoke */
  ctx.fillStyle = palFener('starColor', 0.05 + 0.04*Math.sin(t*0.7));
  ctx.beginPath();
  ctx.ellipse(pos.x + 12 + Math.sin(t*0.4)*4, pos.y - H*0.09, 14, 5, -0.25, 0, 7);
  ctx.fill();
}

/* --- Lighthouse --- */
function lighthouseGeomFener(horizonY){
  const baseX = W*0.76;
  const baseY = horizonY + (H-horizonY)*0.04;
  const scale = Math.min(W,H)*0.0011;
  return { baseX, baseY, scale };
}

function drawFenerLighthouse(geom, e, beamAngle, horizonY){
  const { baseX, baseY, scale } = geom;
  const sil = palFener('silhouette',1);
  ctx.save();
  ctx.translate(baseX, baseY);
  ctx.scale(scale, scale);
  /* rocky cliff */
  ctx.fillStyle = palFener('rock',1);
  ctx.beginPath();
  ctx.moveTo(-150,40); ctx.lineTo(-110,-30); ctx.lineTo(-60,-52); ctx.lineTo(-10,-38);
  ctx.lineTo(40,-58); ctx.lineTo(90,-30); ctx.lineTo(140,10); ctx.lineTo(150,40);
  ctx.closePath(); ctx.fill();
  /* secondary rock layer */
  ctx.beginPath();
  ctx.moveTo(-150,40); ctx.lineTo(-120,8); ctx.lineTo(-40,18); ctx.lineTo(30,6);
  ctx.lineTo(110,16); ctx.lineTo(150,40); ctx.closePath(); ctx.fill();
  /* tower: slightly tapered, red-white striped */
  const tw = 34, th = 150, tx = 0, ty = -52;
  ctx.beginPath();
  ctx.moveTo(tx-tw, ty);
  ctx.lineTo(tx-tw*0.62, ty-th);
  ctx.lineTo(tx+tw*0.62, ty-th);
  ctx.lineTo(tx+tw, ty);
  ctx.closePath();
  ctx.fillStyle = palFener('tower',1); ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = palFener('towerBand',0.92);
  for(let i=0;i<4;i++){
    const yy = ty - th*(0.16 + i*0.24);
    ctx.fillRect(tx-tw*1.4, yy, tw*2.8, th*0.10);
  }
  ctx.restore();
  /* gallery + lamp room */
  ctx.fillStyle = palFener('silhouette',1);
  ctx.fillRect(tx-tw*0.8, ty-th-8, tw*1.6, 6);
  ctx.fillStyle = palFener('lamp', 0.9);
  ctx.beginPath(); ctx.arc(tx, ty-th-20, 11, 0, 7); ctx.fill();
  ctx.fillStyle = palFener('silhouette',1);
  ctx.beginPath();
  ctx.moveTo(tx-14, ty-th-30); ctx.lineTo(tx+14, ty-th-30); ctx.lineTo(tx, ty-th-44);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  return { x: baseX, y: baseY + (ty-th-20)*scale };
}

function drawFenerBeam(lamp, angle, intensity){
  if(intensity <= 0.01) return;
  const len = W*1.1;
  const spread = 0.10;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const dir of [1,-1]){
    const a = angle*dir;
    const str = dir===1 ? intensity : intensity*0.22;
    const g = ctx.createLinearGradient(lamp.x, lamp.y, lamp.x+Math.cos(a)*len, lamp.y+Math.sin(a)*len);
    g.addColorStop(0, palFener('beam', 0.30*str));
    g.addColorStop(0.5, palFener('beam', 0.10*str));
    g.addColorStop(1, palFener('beam', 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(lamp.x, lamp.y);
    ctx.lineTo(lamp.x+Math.cos(a-spread)*len, lamp.y+Math.sin(a-spread)*len);
    ctx.lineTo(lamp.x+Math.cos(a+spread)*len, lamp.y+Math.sin(a+spread)*len);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/* --- Story engine: beam finds ship, ship signals back --- */
function angDiff(a,b){ let d = a-b; while(d>Math.PI) d-=Math.PI*2; while(d<-Math.PI) d+=Math.PI*2; return d; }

function updateFenerStory(dt, e, horizonY, lamp, beamA){
  if(!playing){
    fenerShipLights += (0.15 - fenerShipLights)*Math.min(1,dt*2);
    return;
  }
  /* ship movement */
  fenerShipP += fenerShipDir * dt * 0.0085;
  if(fenerShipP > 1.25){ fenerShipP = -0.25; fenerShipDir = 1; }
  if(fenerShipP < -0.30){ fenerShipP = 1.25; fenerShipDir = -1; }

  const ship = fenerShipPos(e, horizonY);
  const toShip = Math.atan2(ship.y - lamp.y, ship.x - lamp.x);
  const d = Math.abs(angDiff(beamA, toShip));
  const lit = Math.max(0, 1 - d/0.16);

  fenerShipLights += (0.15 + lit*0.85 - fenerShipLights) * Math.min(1, dt*5);

  /* beam hits ship: three signal flashes + lighthouse "ping" */
  if(fenerSignalPhase === null){
    fenerNextSignalIn -= dt;
    if(fenerNextSignalIn <= 0 && lit > 0.7){
      fenerSignalPhase = { t:0, flashes:0 };
    }
  } else {
    fenerSignalPhase.t += dt;
    const FLASH_GAP = 0.42;
    if(fenerSignalPhase.flashes < 3 && fenerSignalPhase.t > fenerSignalPhase.flashes * FLASH_GAP){
      fenerSignalPhase.flashes++;
      burst(ship.x, ship.y - 8, 12, css('--a1'), 1.5, 30, {gravity:0, drag:0.94, r0:0.7, r1:1.8});
    }
    if(fenerSignalPhase.t > 1.8){
      fenerSignalPhase = null;
      fenerNextSignalIn = 14 + Math.random()*18;
    }
  }
}

/* --- Glints on water --- */
let fenerGlints = [];
function updateFenerGlints(e, horizonY, dt){
  const spawnChance = (0.12+e.treble*0.55) * (playing?1:0.15);
  if(Math.random() < spawnChance){
    let p = Math.random();
    if(Math.random()<0.25) p = 0.45 + (Math.random()-0.5)*0.12;
    const y = waveYFener(p, e, WAVE_LAYERS_FENER[1], horizonY) - Math.random()*3;
    fenerGlints.push({ x:p*W, y, life:1, size:0.6+Math.random()*1.5, decay:0.8+Math.random()*1.3 });
  }
  fenerGlints.forEach(g=> g.life -= dt*g.decay);
  fenerGlints = fenerGlints.filter(g=>g.life>0);
}

function drawFenerGlints(){
  fenerGlints.forEach(g=>{
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.size*Math.max(0,g.life), 0, 7);
    ctx.fillStyle = palFener('reflect', Math.max(0,g.life)*0.85);
    ctx.fill();
  });
}

function drawFenerReflection(bodyX, horizonY, e){
  const rows=26;
  const bandBase = W*0.1;
  for(let i=0;i<rows;i++){
    const p = i/rows;
    const y = horizonY+6+p*(H-horizonY)*0.85;
    const fade = 1-p*0.85;
    const jitter = (Math.pow(Math.random(),2)-0.3) * (12+e.treble*38) * fade;
    const w = (bandBase*(1-p*0.55) + jitter) * (0.6+e.energy*0.6);
    const cx = bodyX + Math.sin(p*22 + t*1.3) * (4+(1-p)*10);
    const h = 1.3 + Math.random()*2*fade;
    ctx.fillStyle = palFener('reflect', (0.1+Math.random()*0.2)*fade*(0.5+e.treble*0.8));
    ctx.fillRect(cx-w/2, y, Math.max(0,w), h);
  }
}

let fenerBeamAngle = 0;

function drawFener(bars, wave, e){
  const horizonY = H*0.60;
  const isDark = phone.dataset.mode === 'dark';
  const modeTarget = isDark ? 0 : 1;
  fenerModeMix += (modeTarget - fenerModeMix) * Math.min(1, 0.016*1.4);

  /* Sky gradient */
  const skyGrad = ctx.createLinearGradient(0,0,0,horizonY);
  skyGrad.addColorStop(0, palFener('skyTop'));
  skyGrad.addColorStop(0.55, palFener('skyMid'));
  skyGrad.addColorStop(1, palFener('skyBottom'));
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0,0,W,horizonY+2);

  /* Stars (night mode) */
  const starAlpha = Math.max(0, 1-fenerModeMix*1.7);
  if(starAlpha>0.01){
    fenerStars.forEach(s=>{
      const tw = 0.5+0.5*Math.sin(t*s.speed+s.phase);
      ctx.beginPath();
      ctx.arc(s.x*W, s.y*horizonY*0.9, s.r*(0.6+tw*0.6), 0, 7);
      ctx.fillStyle = palFener('starColor', starAlpha*(0.35+tw*0.65)*s.baseA);
      ctx.fill();
    });
  }

  /* Moon / Sun */
  const bodyX = W*0.20 + Math.sin(t*0.015)*W*0.015;
  const bodyY = horizonY*0.24 + Math.cos(t*0.011)*7;
  const bodyR = Math.min(W,horizonY)*0.10 + e.bass*6;
  const glow = ctx.createRadialGradient(bodyX,bodyY,bodyR*0.15, bodyX,bodyY,bodyR*6);
  glow.addColorStop(0, palFener('bodyGlow', 0.5+e.energy*0.22));
  glow.addColorStop(0.35, palFener('bodyGlow', 0.13));
  glow.addColorStop(1, palFener('bodyGlow', 0));
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(bodyX,bodyY,bodyR*6,0,7); ctx.fill();

  /* Sun rays (day mode) */
  if(fenerModeMix>0.15){
    ctx.save();
    ctx.globalAlpha = Math.min(1,(fenerModeMix-0.15)/0.85)*0.22;
    ctx.strokeStyle = palFener('bodyGlow'); ctx.lineWidth = 1;
    for(let i=0;i<10;i++){
      const ang = (i/10)*Math.PI*2 + t*0.04;
      ctx.beginPath();
      ctx.moveTo(bodyX+Math.cos(ang)*bodyR*1.3, bodyY+Math.sin(ang)*bodyR*1.3);
      ctx.lineTo(bodyX+Math.cos(ang)*bodyR*3.4, bodyY+Math.sin(ang)*bodyR*3.4);
      ctx.stroke();
    }
    ctx.restore();
  }

  /* Moon/Sun body */
  const bodyGrad = ctx.createRadialGradient(bodyX-bodyR*0.25,bodyY-bodyR*0.25,bodyR*0.1, bodyX,bodyY,bodyR);
  bodyGrad.addColorStop(0, palFener('bodyCore'));
  bodyGrad.addColorStop(1, palFener('body'));
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.arc(bodyX,bodyY,bodyR,0,7); ctx.fill();

  /* Moon craters (night mode) */
  if(fenerModeMix<0.7){
    ctx.globalAlpha = (1-fenerModeMix)*0.16;
    ctx.fillStyle = palFener('skyMid');
    fenerCraters.forEach(c=>{
      ctx.beginPath();
      ctx.arc(bodyX+c.dx*bodyR, bodyY+c.dy*bodyR, c.r*bodyR, 0, 7);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  /* Fog at horizon */
  const fogGrad = ctx.createLinearGradient(0,horizonY-36,0,horizonY+22);
  fogGrad.addColorStop(0, palFener('skyBottom',0));
  fogGrad.addColorStop(0.5, palFener('skyBottom',0.3));
  fogGrad.addColorStop(1, palFener('waterTop',0));
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0,horizonY-36,W,58);

  /* Water */
  const waterGrad = ctx.createLinearGradient(0,horizonY,0,H);
  waterGrad.addColorStop(0, palFener('waterTop'));
  waterGrad.addColorStop(1, palFener('waterBottom'));
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0,horizonY-2,W,H-horizonY+2);

  /* Reflection */
  drawFenerReflection(bodyX, horizonY, e);

  /* Lighthouse + rotating beam (behind ship) */
  const geom = lighthouseGeomFener(horizonY);
  const beamPulse = playing ? (0.75 + e.energy*0.5 + (e.beat?0.5:0)) : 0.35;
  fenerBeamAngle = t*0.30;
  const lamp = drawFenerLighthouse(geom, e, fenerBeamAngle, horizonY);
  drawFenerBeam(lamp, fenerBeamAngle, beamPulse * (0.35 + 0.65*(1-fenerModeMix*0.4)));

  /* Ship */
  const ship = fenerShipPos(e, horizonY);
  drawFenerShip(ship, e);

  /* Waves and glints in front */
  drawWaveLayerFener(WAVE_LAYERS_FENER[0], e, horizonY);
  drawFenerGlints();
  drawWaveLayerFener(WAVE_LAYERS_FENER[1], e, horizonY);

  /* Update story logic */
  updateFenerStory(0.016, e, horizonY, lamp, fenerBeamAngle);
  updateFenerGlints(e, horizonY, 0.016);

  drawSparks(true);
}

/* ============================================================
   DEEP EYES THEME — "Derin Bakış" — Ocean Eye with Tears & Redness
   A single eye scene with physiological reactions to sound
   Features: iris dilation, redness, tears, vessel networks
   ============================================================ */

// Deep Eyes State
const deepEyesState = {
  openCur: 0.86, openTarget: 0.86, restOpen: 0.86,
  gazeX: 0, gazeY: 0, gazeTargetX: 0, gazeTargetY: 0,
  pupilRatio: 0.30, pupilVel: 0, irisPulse: 1,
  bassEnv: 0, trebleEnv: 0, lashKick: 0,
  loudnessEnv: 0, redness: 0, well: 0, tears: [],
  vesselTrees: null, lastTearSpawn: 0, emotionBoost: 0,
  lastIdleDrift: 0
};

// Helper functions for Deep Eyes
function clampDE(v,a,b){ return v<a?a:v>b?b:v; }
function approachDE(cur,target,dt,speed){ return cur + (target-cur)*(1-Math.exp(-speed*dt)); }
function qbezierDE(P0,C,P1,u){
  const mt=1-u;
  return { x: mt*mt*P0.x + 2*mt*u*C.x + u*u*P1.x, y: mt*mt*P0.y + 2*mt*u*C.y + u*u*P1.y };
}

// Conjunctival vessel network (branching blood vessels)
function growVesselDE(segs, x, y, ang, len, w, depth){
  if(depth <= 0 || w < 0.18) return;
  const nx = x + Math.cos(ang)*len;
  const ny = y + Math.sin(ang)*len*0.62;
  segs.push({x0:x, y0:y, x1:nx, y1:ny, w, d:depth});
  const n = Math.random() < 0.78 ? 2 : 1;
  for(let i=0;i<n;i++){
    growVesselDE(segs, nx, ny, ang + (Math.random()-0.5)*0.85, len*(0.58+Math.random()*0.28), w*0.62, depth-1);
  }
}

function initVesselTreesDE(){
  if(deepEyesState.vesselTrees) return;
  const trees = [];
  const defs = [
    {ox:-0.97, oy: 0.08, ang: 0.02, n:5},
    {ox:-0.97, oy:-0.04, ang:-0.16, n:3},
    {ox: 0.97, oy: 0.04, ang: Math.PI-0.02, n:5},
    {ox: 0.97, oy:-0.08, ang: Math.PI+0.16, n:3},
  ];
  defs.forEach(d=>{
    const segs = [];
    for(let k=0;k<d.n;k++){
      growVesselDE(segs, d.ox, d.oy + (Math.random()-0.5)*0.10,
                 d.ang + (Math.random()-0.5)*0.30, 0.15+Math.random()*0.09, 1.6+Math.random()*0.9, 4);
    }
    trees.push(segs);
  });
  deepEyesState.vesselTrees = trees;
}

// Eye geometry
function getEyeGeometryDE(open){
  const cx = W*0.5, cy = H*0.50;
  const rx = W*0.345;
  const ryTop = H*0.430, ryBot = H*0.285;
  const upTilt = -H*0.018;
  const left = {x:cx-rx, y:cy};
  const right = {x:cx+rx, y:cy+upTilt};
  const upperCtrl = {x:cx-rx*0.14, y:cy-ryTop*open};
  const lowerCtrl = {x:cx+rx*0.03, y:cy+ryBot*open};
  return {cx,cy,rx,ryTop,ryBot,left,right,upperCtrl,lowerCtrl};
}

// Decorative elements (pre-generated for performance)
const IRIS_LINES_DE = Array.from({length:46}, ()=>({a:Math.random()*Math.PI*2, len:0.55+Math.random()*0.4, w:0.4+Math.random()*0.5, op:0.08+Math.random()*0.10}));
const FLECKS_DE = Array.from({length:20}, ()=>({x:Math.random(), y:Math.random(), r:0.4+Math.random()*1.1, phase:Math.random()*Math.PI*2, speed:0.5+Math.random()*1.0}));
const BUBBLES_DE = Array.from({length:7}, ()=>({x:Math.random(), y:Math.random(), r:2+Math.random()*4, speed:6+Math.random()*10, drift:(Math.random()-0.5)*8, phase:Math.random()*Math.PI*2}));
const SNOW_DE = Array.from({length:26}, ()=>({x:Math.random(), y:Math.random(), r:0.4+Math.random()*1.0, vy:2+Math.random()*7, drift:(Math.random()-0.5)*6, phase:Math.random()*Math.PI*2, op:0.05+Math.random()*0.12}));
const IRIS_CRYPTS_DE = Array.from({length:10}, ()=>({
  a: Math.random()*Math.PI*2, r: 0.30+Math.random()*0.55,
  size: 0.10+Math.random()*0.15, dark: Math.random()<0.55
}));
const COLLARETTE_DE = Array.from({length:72}, ()=> 0.40 + (Math.random()-0.5)*0.05);

// Tear system
function spawnTearDE(now){
  const g = getEyeGeometryDE(deepEyesState.openCur);
  const b = qbezierDE(g.left, g.lowerCtrl, g.right, 0.15);
  deepEyesState.tears.push({
    x: b.x + 3, y: b.y + 1,
    vx: 3 + Math.random()*7, vy: 4,
    age: 0, scale: 0.8 + Math.random()*0.45,
    trail: [], trailClock: 0,
    state: 'fall', fadeT: 0
  });
  deepEyesState.lastTearSpawn = now;
}

function updateTearsDE(dt, now){
  for(let i=deepEyesState.tears.length-1;i>=0;i--){
    const tear = deepEyesState.tears[i];
    tear.age += dt;
    if(tear.state==='fall'){
      tear.vy += 640*dt;
      tear.vx *= Math.exp(-dt*1.4);
      tear.x += tear.vx*dt;
      tear.y += tear.vy*dt;
      tear.trailClock += dt;
      if(tear.trailClock > 0.035){
        tear.trailClock = 0;
        tear.trail.push({x:tear.x, y:tear.y, age:0});
        if(tear.trail.length > 90) tear.trail.shift();
      }
      if(tear.y > H-30){ tear.state='fade'; tear.fadeT = 0; }
    } else {
      tear.fadeT += dt;
      if(tear.fadeT > 0.7) deepEyesState.tears.splice(i,1);
    }
    for(let j=tear.trail.length-1;j>=0;j--){
      tear.trail[j].age += dt;
      if(tear.trail[j].age > 3.2) tear.trail.splice(j,1);
    }
  }
  if(deepEyesState.well > 0.72 && now - deepEyesState.lastTearSpawn > 2300 && deepEyesState.tears.length < 3){
    spawnTearDE(now);
    deepEyesState.well *= 0.5;
  }
}

function drawTearDropDE(tear, alphaMul){
  const wob = Math.exp(-tear.age*2.6);
  const sy = 1 + 0.20*Math.sin(tear.age*24)*wob;
  const sx = 1 - 0.10*Math.sin(tear.age*24)*wob;
  const r = 3.4*tear.scale * (tear.state==='fade' ? Math.max(0.05, 1-tear.fadeT/0.7) : 1);
  ctx.save();
  ctx.translate(tear.x, tear.y);
  ctx.scale(sx, sy);
  const grad = ctx.createRadialGradient(-r*0.35,-r*0.55,r*0.2, 0, 0, r*2.1);
  grad.addColorStop(0,   `rgba(240,253,255,${0.95*alphaMul})`);
  grad.addColorStop(0.38,`rgba(188,232,244,${0.55*alphaMul})`);
  grad.addColorStop(0.75,`rgba(150,214,232,${0.22*alphaMul})`);
  grad.addColorStop(1,   `rgba(140,205,225,0)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, -r*2.0);
  ctx.bezierCurveTo( r*1.55, -r*0.5,  r*1.25, r*1.25, 0, r*1.25);
  ctx.bezierCurveTo(-r*1.25, r*1.25, -r*1.55, -r*0.5, 0, -r*2.0);
  ctx.fill();
  ctx.strokeStyle = `rgba(255,255,255,${0.35*alphaMul})`;
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  ctx.moveTo(0, -r*2.0);
  ctx.bezierCurveTo( r*1.55, -r*0.5,  r*1.25, r*1.25, 0, r*1.25);
  ctx.stroke();
  ctx.fillStyle = `rgba(255,255,255,${0.9*alphaMul})`;
  ctx.beginPath(); ctx.arc(-r*0.38, -r*0.6, Math.max(0.4, r*0.30), 0, 7); ctx.fill();
  ctx.restore();
}

function drawTearsDE(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  deepEyesState.tears.forEach(tear=>{
    if(tear.trail.length < 2) return;
    for(let i=1;i<tear.trail.length;i++){
      const p = tear.trail[i];
      const a = Math.max(0, 1 - p.age/3.2);
      ctx.strokeStyle = `rgba(190,235,245,${(0.16*a).toFixed(3)})`;
      ctx.lineWidth = 2.6*a + 0.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tear.trail[i-1].x, tear.trail[i-1].y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
  });
  ctx.restore();
  deepEyesState.tears.forEach(tear=>{
    const alphaMul = tear.state==='fade' ? Math.max(0, 1-tear.fadeT/0.7) : 1;
    drawTearDropDE(tear, alphaMul);
  });
}

function drawDeepEyes(bars, wave, e){
  initVesselTreesDE();
  
  const dt = 0.016;
  const now = t * 1000;
  
  // Deep ocean background
  const bg = ctx.createRadialGradient(W*0.5,H*0.38,10, W*0.5,H*0.55,Math.max(W,H)*0.78);
  bg.addColorStop(0,'#062230'); bg.addColorStop(1,'#010509');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Caustic water effects
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const baseA = 0.028 + deepEyesState.redness*0.012;
  for(let k=0;k<4;k++){
    ctx.beginPath();
    const baseY = H*(0.12 + k*0.07);
    const speed = (0.35 + k*0.12);
    for(let x=0;x<=W;x+=7){
      const y = baseY + Math.sin(x*0.022 + t*speed + k*1.7)*6 + Math.sin(x*0.05 - t*speed*1.6)*3;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle = `rgba(96,225,208,${baseA})`;
    ctx.lineWidth = 5 + k*2; ctx.filter = 'blur(3px)'; ctx.stroke();
  }
  ctx.filter = 'none'; ctx.restore();

  // Floating particles
  BUBBLES_DE.forEach(b=>{
    const span = H+20;
    const yy = (((b.y*H - t*b.speed*6) % span) + span) % span - 10;
    const xx = b.x*W + Math.sin(t*0.4+b.phase)*b.drift;
    const r = b.r;
    const grad = ctx.createRadialGradient(xx-r*0.3,yy-r*0.3,0.2, xx,yy,r);
    grad.addColorStop(0,'rgba(180,240,235,0.26)');
    grad.addColorStop(1,'rgba(180,240,235,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(xx,yy,r,0,7); ctx.fill();
  });
  SNOW_DE.forEach(s=>{
    const span = H+10;
    const yy = (((s.y*H - t*s.vy) % span) + span) % span - 5;
    const xx = s.x*W + Math.sin(t*0.25+s.phase)*s.drift;
    ctx.fillStyle = `rgba(200,240,235,${(s.op*(0.6+0.4*Math.sin(t+s.phase)))})`;
    ctx.beginPath(); ctx.arc(xx,yy,s.r,0,7); ctx.fill();
  });

  const g = getEyeGeometryDE(deepEyesState.openCur);
  const apH = 0.5*g.ryTop*deepEyesState.restOpen + 0.5*g.ryBot*deepEyesState.restOpen;

  // Lid shadow
  ctx.save(); ctx.filter = 'blur(16px)';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.beginPath(); ctx.ellipse(g.cx, g.cy+apH*0.15, g.rx*1.22, apH*1.35, 0, 0, 7); ctx.fill();
  ctx.restore();

  // Lid shape
  ctx.save(); ctx.filter = 'blur(7px)';
  const lidGrad = ctx.createLinearGradient(g.cx, g.cy-apH*1.5, g.cx, g.cy+apH*1.5);
  lidGrad.addColorStop(0,'#123246'); lidGrad.addColorStop(1,'#07202c');
  ctx.fillStyle = lidGrad;
  ctx.beginPath(); ctx.ellipse(g.cx, g.cy, g.rx*1.08, apH*1.15, 0, 0, 7); ctx.fill();
  ctx.restore();

  // Aperture clip
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(g.left.x, g.left.y);
  ctx.quadraticCurveTo(g.upperCtrl.x, g.upperCtrl.y, g.right.x, g.right.y);
  ctx.quadraticCurveTo(g.lowerCtrl.x, g.lowerCtrl.y, g.left.x, g.left.y);
  ctx.closePath(); ctx.clip();

  // Sclera with redness
  const scGrad = ctx.createRadialGradient(g.cx,g.cy,4, g.cx,g.cy,g.rx*1.15);
  const rTint = Math.round(deepEyesState.redness*38);
  scGrad.addColorStop(0,`rgb(${234+rTint},${247-rTint*0.6},${249-rTint*0.6})`);
  scGrad.addColorStop(0.45,`rgb(${191+rTint},${227-rTint},${231-rTint})`);
  scGrad.addColorStop(0.8,`rgb(${127+rTint},${185-rTint*1.3},${194-rTint*1.3})`);
  scGrad.addColorStop(1,`rgb(${63+rTint*0.6},${109-rTint},${120-rTint})`);
  ctx.fillStyle = scGrad; ctx.fillRect(g.cx-g.rx*1.2, g.cy-g.ryTop*1.3, g.rx*2.4, (g.ryTop+g.ryBot)*1.4);

  // Inflamed flush
  if(deepEyesState.redness > 0.02){
    [['l',g.left.x+g.rx*0.16],['r',g.right.x-g.rx*0.16]].forEach(([side,x])=>{
      const infl = ctx.createRadialGradient(x, g.cy, 2, x, g.cy, g.rx*0.85);
      infl.addColorStop(0, `rgba(198,52,62,${0.30*deepEyesState.redness})`);
      infl.addColorStop(0.55, `rgba(190,60,66,${0.12*deepEyesState.redness})`);
      infl.addColorStop(1, 'rgba(190,60,66,0)');
      ctx.fillStyle = infl; ctx.fillRect(g.cx-g.rx*1.2, g.cy-g.ryTop*1.3, g.rx*2.4, (g.ryTop+g.ryBot)*1.4);
    });
  }

  // Vessels
  const veinPulse = 0.78 + 0.22*Math.sin(t*Math.PI*2*0.9) * (0.5+deepEyesState.bassEnv);
  if(deepEyesState.redness >= 0.015 && deepEyesState.vesselTrees){
    deepEyesState.vesselTrees.forEach(tree=>{
      tree.forEach(s=>{
        const depthFade = 0.45 + 0.55*(s.d/4);
        const a = (0.03 + deepEyesState.redness*0.5*veinPulse) * depthFade;
        ctx.strokeStyle = `rgba(172,38,52,${a})`;
        ctx.lineWidth = s.w * (0.55 + deepEyesState.redness*0.95);
        ctx.lineCap = 'round'; ctx.beginPath();
        ctx.moveTo(g.cx + s.x0*g.rx, g.cy + s.y0*apH);
        ctx.lineTo(g.cx + s.x1*g.rx, g.cy + s.y1*apH);
        ctx.stroke();
      });
    });
  }

  // Caruncle (inner corner)
  ctx.fillStyle = 'rgba(150,85,90,0.45)';
  ctx.beginPath();
  ctx.ellipse(g.left.x+g.rx*0.14, g.cy, apH*0.15, apH*0.20, 0, 0, 7);
  ctx.fill();

  // Sparkles
  FLECKS_DE.forEach(f=>{
    const fx = g.cx + (f.x-0.5)*g.rx*2.1;
    const fy = g.cy + (f.y-0.5)*(g.ryTop+g.ryBot);
    const tw = 0.35+0.65*(0.5+0.5*Math.sin(t*f.speed+f.phase));
    ctx.fillStyle = `rgba(190,240,235,${(0.10+deepEyesState.trebleEnv*0.12)*tw})`;
    ctx.beginPath(); ctx.arc(fx,fy,f.r,0,7); ctx.fill();
  });

  // Iris
  const maxGX = g.rx*0.30, maxGY = ((g.ryTop+g.ryBot)/2)*0.20;
  const ix = g.cx + deepEyesState.gazeX*maxGX;
  const iy = g.cy + deepEyesState.gazeY*maxGY;
  const irisBase = (0.5*g.ryTop*deepEyesState.restOpen) * 1.05;
  const irisR = irisBase*deepEyesState.irisPulse;

  const irGrad = ctx.createRadialGradient(ix,iy,irisR*0.10, ix,iy,irisR);
  irGrad.addColorStop(0,'#aefaf0'); irGrad.addColorStop(0.22,'#5ff0dd'); irGrad.addColorStop(0.48,'#2fd9c9');
  irGrad.addColorStop(0.74,'#12839a'); irGrad.addColorStop(0.93,'#0e5f7a'); irGrad.addColorStop(1,'#062230');
  ctx.fillStyle = irGrad;
  ctx.beginPath(); ctx.arc(ix,iy,irisR,0,7); ctx.fill();

  // Iris lines
  ctx.save();
  ctx.translate(ix,iy);
  IRIS_LINES_DE.forEach(l=>{
    ctx.strokeStyle = `rgba(6,30,38,${l.op})`;
    ctx.lineWidth = l.w;
    ctx.beginPath();
    ctx.moveTo(Math.cos(l.a)*irisR*0.20, Math.sin(l.a)*irisR*0.20);
    ctx.lineTo(Math.cos(l.a)*irisR*l.len, Math.sin(l.a)*irisR*l.len);
    ctx.stroke();
  });
  
  // Collarette
  ctx.beginPath();
  COLLARETTE_DE.forEach((rr,i)=>{
    const a = (i/COLLARETTE_DE.length)*Math.PI*2;
    const px = Math.cos(a)*irisR*rr, py = Math.sin(a)*irisR*rr;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.closePath();
  ctx.strokeStyle = 'rgba(5,26,32,0.38)';
  ctx.lineWidth = irisR*0.05;
  ctx.stroke();
  
  ctx.filter = 'blur(1.5px)';
  IRIS_CRYPTS_DE.forEach(c=>{
    const px = Math.cos(c.a)*irisR*c.r, py = Math.sin(c.a)*irisR*c.r;
    ctx.fillStyle = c.dark ? 'rgba(4,22,28,0.16)' : 'rgba(255,255,255,0.09)';
    ctx.beginPath(); ctx.ellipse(px,py, irisR*c.size, irisR*c.size*0.72, c.a, 0, 7); ctx.fill();
  });
  ctx.filter = 'none';
  ctx.restore();

  // Limbal ring
  ctx.strokeStyle = 'rgba(3,14,20,0.6)';
  ctx.lineWidth = Math.max(1, irisR*0.07);
  ctx.beginPath(); ctx.arc(ix,iy,irisR*0.97,0,7); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,90,110,0.10)';
  ctx.lineWidth = Math.max(0.6, irisR*0.03);
  ctx.beginPath(); ctx.arc(ix+0.7,iy,irisR*0.985,0,7); ctx.stroke();
  ctx.strokeStyle = 'rgba(90,210,255,0.10)';
  ctx.beginPath(); ctx.arc(ix-0.7,iy,irisR*0.985,0,7); ctx.stroke();

  // Pupil
  const pr = irisR*deepEyesState.pupilRatio;
  const puGrad = ctx.createRadialGradient(ix,iy,pr*0.1, ix,iy,pr);
  puGrad.addColorStop(0,'#000000'); puGrad.addColorStop(1,'#050b12');
  ctx.fillStyle = puGrad;
  ctx.beginPath(); ctx.arc(ix,iy,pr,0,7); ctx.fill();

  // Catchlights
  ctx.save();
  ctx.filter = 'blur(3px)';
  ctx.fillStyle = `rgba(255,255,255,${0.08+deepEyesState.trebleEnv*0.10})`;
  ctx.beginPath();
  ctx.ellipse(ix-irisR*0.12, iy-irisR*0.5, irisR*0.62, irisR*0.34, -0.35, 0, 7);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(ix-irisR*0.30, iy-irisR*0.42);
  ctx.rotate(-0.35);
  ctx.fillStyle = `rgba(255,255,255,${0.10+deepEyesState.trebleEnv*0.08})`;
  ctx.beginPath();
  ctx.roundRect(-irisR*0.30, -irisR*0.14, irisR*0.42, irisR*0.24, irisR*0.05);
  ctx.fill();
  ctx.restore();

  const glintBoost = 0.5+deepEyesState.trebleEnv*0.9;
  ctx.fillStyle = `rgba(255,255,255,${Math.min(0.95,0.55*glintBoost)})`;
  ctx.beginPath(); ctx.arc(ix-irisR*0.34, iy-irisR*0.36, Math.max(1,irisR*0.13*glintBoost), 0, 7); ctx.fill();
  ctx.fillStyle = `rgba(200,255,248,${Math.min(0.55,0.16*glintBoost)})`;
  ctx.beginPath(); ctx.arc(ix+irisR*0.26, iy+irisR*0.30, Math.max(0.6,irisR*0.06*glintBoost), 0, 7); ctx.fill();

  // Lid shadows
  const lidShadow = ctx.createLinearGradient(g.cx, g.cy-g.ryTop*deepEyesState.openCur*0.9, g.cx, g.cy);
  lidShadow.addColorStop(0,'rgba(0,0,0,0.34)');
  lidShadow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = lidShadow;
  ctx.fillRect(g.cx-g.rx*1.2, g.cy-g.ryTop*1.3, g.rx*2.4, (g.ryTop+g.ryBot)*1.4);
  
  const bounce = ctx.createLinearGradient(g.cx, g.cy+g.ryBot*deepEyesState.openCur*0.7, g.cx, g.cy+g.ryBot*deepEyesState.openCur*0.1);
  bounce.addColorStop(0,'rgba(70,210,195,0.10)');
  bounce.addColorStop(1,'rgba(70,210,195,0)');
  ctx.fillStyle = bounce;
  ctx.fillRect(g.cx-g.rx*1.2, g.cy, g.rx*2.4, g.ryBot*deepEyesState.openCur);

  // Tear meniscus
  if(deepEyesState.well > 0.02){
    ctx.beginPath();
    for(let i=0;i<=28;i++){
      const tt = 0.06 + (i/28)*0.88;
      const b = qbezierDE(g.left, g.lowerCtrl, g.right, tt);
      const lift = (1 + deepEyesState.well*2.2);
      if(i===0) ctx.moveTo(b.x, b.y-lift*0.4); else ctx.lineTo(b.x, b.y-lift*0.4);
    }
    ctx.strokeStyle = `rgba(214,244,250,${0.10+deepEyesState.well*0.30})`;
    ctx.lineWidth = 1.2 + deepEyesState.well*3.6;
    ctx.lineCap = 'round';
    ctx.stroke();

    const bulgeR = apH*(0.06 + deepEyesState.well*0.22);
    const bx = g.left.x + g.rx*0.15, by = g.cy + apH*0.35;
    const bg2 = ctx.createRadialGradient(bx-bulgeR*0.3, by-bulgeR*0.4, 0.5, bx, by, bulgeR*1.6);
    bg2.addColorStop(0, `rgba(235,251,255,${0.30+deepEyesState.well*0.40})`);
    bg2.addColorStop(0.6, `rgba(190,235,245,${0.14+deepEyesState.well*0.20})`);
    bg2.addColorStop(1, 'rgba(190,235,245,0)');
    ctx.fillStyle = bg2;
    ctx.beginPath(); ctx.ellipse(bx, by, bulgeR*1.5, bulgeR, 0.15, 0, 7); ctx.fill();
  }

  // Tear film gloss
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const film = ctx.createLinearGradient(g.cx, g.cy-apH, g.cx, g.cy+apH);
  film.addColorStop(0, `rgba(220,250,255,${0.05+deepEyesState.well*0.13})`);
  film.addColorStop(0.5, 'rgba(220,250,255,0)');
  film.addColorStop(1, `rgba(160,230,240,${0.03+deepEyesState.well*0.07})`);
  ctx.fillStyle = film;
  ctx.fillRect(g.cx-g.rx*1.2, g.cy-g.ryTop*1.3, g.rx*2.4, (g.ryTop+g.ryBot)*1.4);
  ctx.restore();

  ctx.restore();

  // Lid outlines
  ctx.strokeStyle = 'rgba(2,10,15,0.85)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(g.left.x,g.left.y);
  ctx.quadraticCurveTo(g.upperCtrl.x,g.upperCtrl.y,g.right.x,g.right.y);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(220,245,250,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(g.left.x-3, g.left.y-3);
  ctx.quadraticCurveTo(g.upperCtrl.x, g.upperCtrl.y-apH*0.30, g.right.x+3, g.right.y-3);
  ctx.stroke();

  // Lashes (simplified)
  const LASH_N = 18;
  const maxLen = Math.max(18, g.rx*0.46);
  for(let i=0;i<LASH_N;i++){
    const tt = 0.06 + (i/(LASH_N-1))*0.88;
    const basex = (1-tt)*(1-tt)*g.left.x + 2*(1-tt)*tt*g.upperCtrl.x + tt*tt*g.right.x;
    const basey = (1-tt)*(1-tt)*g.left.y + 2*(1-tt)*tt*g.upperCtrl.y + tt*tt*g.right.y;
    const sweep = (tt-0.5)*0.85;
    const angle = -Math.PI/2 + sweep + (Math.random()-0.5)*0.16;
    const lenFactor = Math.pow(Math.sin(Math.PI*tt), 0.85);
    const length = (11 + lenFactor*maxLen) * (1+deepEyesState.bassEnv*0.12) * (0.55+0.45*deepEyesState.openCur);
    const endx = basex + Math.cos(angle)*length;
    const endy = basey + Math.sin(angle)*length;
    ctx.strokeStyle = 'rgba(2,9,14,0.94)'; ctx.lineWidth = 1.8; ctx.beginPath();
    ctx.moveTo(basex, basey); ctx.lineTo(endx, endy); ctx.stroke();
  }

  // Tears roll over everything
  drawTearsDE();

  // Update physics
  const bassRaw = bars[3]||0, trebleRaw = bars[40]||0, overall = bars.reduce((a,b)=>a+b,0)/bars.length;
  const bassAtk = 1-Math.exp(-dt*4.5), bassRel = 1-Math.exp(-dt*2.2);
  deepEyesState.bassEnv += (bassRaw-deepEyesState.bassEnv) * (bassRaw>deepEyesState.bassEnv?bassAtk:bassRel);
  const trebAtk = 1-Math.exp(-dt*22), trebRel = 1-Math.exp(-dt*10);
  deepEyesState.trebleEnv += (trebleRaw-deepEyesState.trebleEnv) * (trebleRaw>deepEyesState.trebleEnv?trebAtk:trebRel);

  // Loudness -> redness
  deepEyesState.loudnessEnv += (overall-deepEyesState.loudnessEnv) * (1-Math.exp(-dt*(overall>deepEyesState.loudnessEnv?3.0:0.55)));
  const redTarget = playing ? clampDE((deepEyesState.loudnessEnv-0.30)/0.30, 0, 1) : 0;
  deepEyesState.redness += (redTarget-deepEyesState.redness) * (1-Math.exp(-dt*1.15));

  // Crying
  deepEyesState.emotionBoost = Math.max(0, deepEyesState.emotionBoost - dt*0.055);
  const cryTarget = playing ? clampDE((deepEyesState.loudnessEnv-0.40)*3.2, 0, 1) + deepEyesState.emotionBoost : deepEyesState.emotionBoost*0.6;
  const cryDrive = clampDE(cryTarget, 0, 1);
  const wellTarget = cryDrive;
  deepEyesState.well += (wellTarget-deepEyesState.well) * (1-Math.exp(-dt*(wellTarget>deepEyesState.well?0.9:0.28)));

  updateTearsDE(dt, now);

  // Pupil dilation
  const pupilTarget = clampDE(0.26 + deepEyesState.bassEnv*0.46, 0.20, 0.74);
  const k=90, c=18; const force=(pupilTarget-deepEyesState.pupilRatio)*k - deepEyesState.pupilVel*c;
  deepEyesState.pupilVel += force*dt; deepEyesState.pupilRatio += deepEyesState.pupilVel*dt;
  deepEyesState.irisPulse += ((1 + deepEyesState.bassEnv*0.05)-deepEyesState.irisPulse) * (1-Math.exp(-dt*6));

  // Heavy-lidded when crying
  deepEyesState.restOpen = 0.86 - cryDrive*0.10;
  deepEyesState.openTarget = deepEyesState.restOpen;
  deepEyesState.openCur = approachDE(deepEyesState.openCur, deepEyesState.openTarget, dt, 10);

  // Idle gaze drift
  if(now - deepEyesState.lastIdleDrift > 2500){
    deepEyesState.gazeTargetX = clampDE(deepEyesState.gazeTargetX + (Math.random()-0.5)*0.5, -0.35, 0.35);
    deepEyesState.gazeTargetY = clampDE((Math.random()-0.5)*0.3, -0.3, 0.3);
    deepEyesState.lastIdleDrift = now;
  }
  deepEyesState.gazeX = approachDE(deepEyesState.gazeX, deepEyesState.gazeTargetX, dt, 1.4);
  deepEyesState.gazeY = approachDE(deepEyesState.gazeY, deepEyesState.gazeTargetY, dt, 1.2);
  
  // Tremor when red
  if(deepEyesState.redness > 0.25){
    deepEyesState.gazeX += (Math.random()-0.5)*0.045*(deepEyesState.redness-0.2);
    deepEyesState.gazeY += (Math.random()-0.5)*0.03*(deepEyesState.redness-0.2);
  }
}

const RENDERERS = {
  mehtap: drawMehtap,
  sumi: drawSumi, aurora: drawAurora, fener: drawFener,
  deep_eyes: drawDeepEyes,
  mycel: drawMycel, reef: drawReef, monsoon: drawMonsoon,
  murekkep: drawMurekkep, col: drawCol, divit: drawDivit,
};

let lastResize = 0;
function render(){
  // Only resize on actual window size changes (not every frame)
  const now = Date.now();
  if(now - lastResize > 500) { // Check every 500ms max
    resize();
    lastResize = now;
  }
  
  t += 0.045;
  const sensBoost = 0.55 + (parseFloat(sensEl.value)/100)*1.1;
  const bars = getBars(sensBoost);
  const wave = getWave();
  const e = analyze(bars, sensBoost);
  updateMeter(bars);
  phone.style.setProperty('--lvl', playing || useRealAudioData ? Math.min(1, e.bass*1.3) : 0);
  const fn = RENDERERS[currentTheme] || drawSumi;
  fn(bars, wave, e);
  requestAnimationFrame(render);
}

setTheme('sumi');
sensVal.textContent = sensEl.value;
boostVal.textContent = boostEl.value;
resize();
updateUI(); // Initialize all i18n texts
render();

// External API for Android
window.updateAudioLevels = function(levels) {
  // Update visualization with external audio data
  if(Array.isArray(levels) && levels.length > 0) {
    // Could be used to inject real audio data from Android
  }
};

window.setBoostState = function(enabled) {
  // Update visual state only - no audio control
  // (Audio is controlled by Android, we just reflect the state)
  console.log('setBoostState called:', enabled, 'current playing:', playing);
  
  if(enabled !== playing) {
    updatePlayButtonState(enabled);
  }
};

// Map Kotlin volume value (60-200) to HTML slider value (0-100)
let isUpdatingFromKotlin = false; // FLAG to prevent feedback loop
window.setVolumeFromKotlin = function(kotlinValue) {
  const clamped = Math.max(60, Math.min(200, kotlinValue));
  const htmlValue = Math.round((clamped - 60) / 140 * 100); // 60→0, 200→100
  if(boostEl) {
    isUpdatingFromKotlin = true; // SET FLAG before updating
    boostEl.value = htmlValue;
    boostVal.textContent = htmlValue;
    isUpdatingFromKotlin = false; // CLEAR FLAG after updating
  }
  console.log('✅ Volume from Kotlin:', kotlinValue, '→ HTML slider:', htmlValue);
};

window.setThemeFromAndroid = function(themeName) {
  if(i18n[currentLang].themes[themeName]) {
    setTheme(themeName);
  }
};

window.setLanguage = function(lang) {
  console.log('🌐 Language change requested:', lang);
  if(!i18n[lang]) {
    console.error('❌ Language not found:', lang);
    return;
  }
  
  // Validate lang has all required keys
  if(!i18n[lang].boost || !i18n[lang].themes) {
    console.error('❌ Incomplete translations for:', lang);
    return;
  }
  
  currentLang = lang;
  console.log('✅ Language set to:', lang);
  
  // Use requestAnimationFrame for smooth DOM updates
  requestAnimationFrame(() => {
    try {
      updateUI();
      console.log('✅ UI updated successfully');
    } catch(e) {
      console.error('❌ Error updating UI:', e);
    }
  });
};

function updateUI() {
  console.log('🔄 Updating UI for language:', currentLang);
  
  try {
    // 1. Update labels with safe checks
    const i18nElements = document.querySelectorAll('[data-i18n]');
    console.log('Found', i18nElements.length, 'i18n elements');
    
    i18nElements.forEach(el => {
      try {
        const key = el.dataset.i18n;
        if(key && i18n[currentLang] && i18n[currentLang][key]) {
          el.textContent = i18n[currentLang][key];
        }
      } catch(e) {
        console.warn('Failed to update element:', el, e);
      }
    });
    
    // 2. Update stage hint safely
    if(stageHint && i18n[currentLang] && i18n[currentLang].play_hint) {
      stageHint.textContent = i18n[currentLang].play_hint;
    }
    
    // 3. Update theme chips with safe checks
    const themeChips = document.querySelectorAll('[data-i18n-theme]');
    console.log('Found', themeChips.length, 'theme chips');
    
    themeChips.forEach(chip => {
      try {
        const theme = chip.dataset.i18nTheme;
        if(theme && i18n[currentLang] && i18n[currentLang].themes && i18n[currentLang].themes[theme]) {
          chip.textContent = i18n[currentLang].themes[theme].label;
        }
      } catch(e) {
        console.warn('Failed to update chip:', chip, e);
      }
    });
    
    // 4. Update current theme title/subtitle with animation
    if(currentTheme && i18n[currentLang] && i18n[currentLang].themes && i18n[currentLang].themes[currentTheme]) {
      const meta = i18n[currentLang].themes[currentTheme];
      
      // Smooth fade transition
      if(trackTitle && trackSub) {
        trackTitle.style.opacity = '0';
        trackSub.style.opacity = '0';
        
        setTimeout(() => {
          try {
            trackTitle.textContent = meta.title;
            trackSub.textContent = meta.sub;
            trackTitle.style.opacity = '1';
            trackSub.style.opacity = '1';
          } catch(e) {
            console.warn('Failed to update track info:', e);
          }
        }, 150);
      }
    }
    
    console.log('✅ UI update completed');
  } catch(e) {
    console.error('❌ Critical error in updateUI:', e);
    // Don't crash - just log and continue
  }
}

// CRITICAL: Expose to window for Android access
window.updateUI = updateUI;

// Debug: Check if AndroidBridge is available
console.log('AndroidBridge available:', typeof AndroidBridge !== 'undefined');
if(typeof AndroidBridge !== 'undefined') {
  console.log('AndroidBridge methods:', Object.getOwnPropertyNames(Object.getPrototypeOf(AndroidBridge)));
}
