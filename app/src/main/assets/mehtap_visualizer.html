<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehtap — Sanat Serisi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#040910;}
canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let W,H,DPR,t=0,playing=false;
const PALETTE={night:{skyTop:'#03070d',skyMid:'#0a1b2c',skyBottom:'#123049',waterTop:'#0d2436',waterBottom:'#030a12',body:'#dfe8ee',bodyGlow:'#bfd4e6',bodyCore:'#fbf8ee',silhouette:'#03070c',reflect:'#d9b46a',starColor:'#eaf1ff'},day:{skyTop:'#bfe0e8',skyMid:'#eaf3ee',skyBottom:'#fbe6c4',waterTop:'#bfe4df',waterBottom:'#4c8a92',body:'#fff2cf',bodyGlow:'#ffdf9e',bodyCore:'#fffaf0',silhouette:'#16262b',reflect:'#c98b2e',starColor:'#ffffff'}};
let modeMix=0,stars=[],glints=[],sparks=[],catchPhaseIdx=null,catchElapsed=0,nextCatchIn=14,catchRodBend=0,fishAlpha=0,fishLift=0,catchBurstFlags={};
const WAVE_LAYERS=[{ampScale:0.34,freq:10,speed:0.55,key:'waterBottom',baseFactor:0.05},{ampScale:0.20,freq:16,speed:0.8,key:'waterTop',baseFactor:0.02}];
const CATCH_PHASES=[{name:'bite',dur:0.5},{name:'pull',dur:0.7},{name:'leap',dur:0.55},{name:'reel',dur:0.9},{name:'release',dur:0.8}];
const craters=[{dx:-0.30,dy:-0.20,r:0.16},{dx:0.25,dy:0.15,r:0.12},{dx:0.05,dy:0.32,r:0.09},{dx:-0.15,dy:0.25,r:0.07}];
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=canvas.width=window.innerWidth*DPR;H=canvas.height=window.innerHeight*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);
function hexToRgb(h){h=h.replace('#','');return{r:parseInt(h.substring(0,2),16),g:parseInt(h.substring(2,4),16),b:parseInt(h.substring(4,6),16)};}
function lerpRgb(h1,h2,tt){const c1=hexToRgb(h1),c2=hexToRgb(h2);return{r:c1.r+(c2.r-c1.r)*tt,g:c1.g+(c2.g-c1.g)*tt,b:c1.b+(c2.b-c1.b)*tt};}
function pal(key,a){const c=lerpRgb(PALETTE.night[key],PALETTE.day[key],modeMix);if(a===undefined)return`rgb(${c.r|0},${c.g|0},${c.b|0})`;return`rgba(${c.r|0},${c.g|0},${c.b|0},${Math.max(0,a)})`;}
function initStars(){stars=[];for(let i=0;i<90;i++){stars.push({x:Math.random(),y:Math.random(),r:0.5+Math.random()*1.3,phase:Math.random()*Math.PI*2,speed:0.3+Math.random()*1.1,baseA:0.4+Math.random()*0.6});}}
function waveY(p,e,layer,horizonY){const amp=(6+e.bass*26)*layer.ampScale*3.4;const baseY=horizonY+(H-horizonY)*(0.05+layer.baseFactor);return baseY+Math.sin(p*layer.freq+t*layer.speed)*amp+Math.sin(p*layer.freq*2.3-t*layer.speed*1.6)*amp*0.35;}
function drawWaveLayer(layer,e,horizonY){ctx.beginPath();ctx.moveTo(0,H+4);const steps=40;for(let i=0;i<=steps;i++){const p=i/steps;ctx.lineTo(p*W,waveY(p,e,layer,horizonY));}ctx.lineTo(W,H+4);ctx.closePath();ctx.fillStyle=pal(layer.key,0.92);ctx.fill();}
function drawReflection(bodyX,horizonY,e){const rows=26,bandBase=W*0.1;for(let i=0;i<rows;i++){const p=i/rows,y=horizonY+6+p*(H-horizonY)*0.85,fade=1-p*0.85;const jitter=(Math.pow(Math.random(),2)-0.3)*(12+e.treble*38)*fade;const w=(bandBase*(1-p*0.55)+jitter)*(0.6+e.energy*0.6);const cx=bodyX+Math.sin(p*22+t*1.3)*(4+(1-p)*10);const h=1.3+Math.random()*2*fade;ctx.fillStyle=pal('reflect',(0.1+Math.random()*0.2)*fade*(0.5+e.treble*0.8));ctx.fillRect(cx-w/2,y,Math.max(0,w),h);}}
function updateGlints(e,horizonY,dt){const spawnChance=(0.12+e.treble*0.55)*(playing?1:0.15);if(Math.random()<spawnChance){let p=Math.random();if(Math.random()<0.25)p=0.46+(Math.random()-0.5)*0.12;const y=waveY(p,e,WAVE_LAYERS[1],horizonY)-Math.random()*3;glints.push({x:p*W,y,life:1,size:0.6+Math.random()*1.5,decay:0.8+Math.random()*1.3});}glints.forEach(g=>g.life-=dt*g.decay);glints=glints.filter(g=>g.life>0);}
function drawGlints(){glints.forEach(g=>{ctx.beginPath();ctx.arc(g.x,g.y,g.size*Math.max(0,g.life),0,7);ctx.fillStyle=pal('reflect',Math.max(0,g.life)*0.85);ctx.fill();});}
function burst(cx,cy,n,colorVar,speed,life,opts){opts=opts||{};for(let i=0;i<n;i++){const ang=Math.random()*Math.PI*2,sp=(speed||2)*(0.45+Math.random()*0.9);sparks.push({x:cx,y:cy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:(opts.r0||1)+Math.random()*(opts.r1||2.2),life:1,decay:1/(life||40),color:colorVar,grav:opts.gravity||0,drag:opts.drag!==undefined?opts.drag:0.96});}}
function drawSparks(){sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=s.grav;s.vx*=s.drag;s.vy*=s.drag;s.life-=s.decay;ctx.beginPath();ctx.arc(s.x,s.y,Math.max(0.2,s.r*s.life),0,7);ctx.shadowColor=pal(s.color);ctx.shadowBlur=8;ctx.fillStyle=pal(s.color);ctx.globalAlpha=Math.max(0,s.life);ctx.fill();ctx.globalAlpha=1;ctx.shadowBlur=0;});sparks=sparks.filter(s=>s.life>0);}
function computeRig(e,horizonY){const layer=WAVE_LAYERS[1],boatP=0.46;const waterYc=waveY(boatP,e,layer,horizonY);const slope=waveY(boatP+0.015,e,layer,horizonY)-waveY(boatP-0.015,e,layer,horizonY);const rot=Math.atan2(slope,0.035*W)*0.35;const bx=boatP*W,by=waterYc-H*0.010,scale=Math.min(W,H)*0.0026;const cosR=Math.cos(rot),sinR=Math.sin(rot);function toWorld(lx,ly){return{x:bx+(lx*cosR-ly*sinR)*scale,y:by+(lx*sinR+ly*cosR)*scale};}const hand=toWorld(20,-34);const rodLen=Math.min(W,H)*0.11,restAngle=-1.05,rodAngle=restAngle+rot*0.5+catchRodBend;const rodTip={x:hand.x+Math.cos(rodAngle)*rodLen,y:hand.y+Math.sin(rodAngle)*rodLen};const bobberP=boatP+0.155;const bobber={x:bobberP*W,y:waveY(bobberP,e,layer,horizonY)};return{boatP,bx,by,rot,scale,hand,rodTip,bobber};}
function updateCatch(dt,horizonY,e,rig){if(!playing){catchRodBend+=(0-catchRodBend)*Math.min(1,dt*3);return;}if(catchPhaseIdx===null){nextCatchIn-=dt;catchRodBend+=(0-catchRodBend)*Math.min(1,dt*3);if(nextCatchIn<=0){catchPhaseIdx=0;catchElapsed=0;catchBurstFlags={};}return;}catchElapsed+=dt;const ph=CATCH_PHASES[catchPhaseIdx],p=Math.min(1,catchElapsed/ph.dur),b=rig.bobber;if(ph.name==='bite'){catchRodBend=Math.sin(p*Math.PI*6)*0.045*(1-p*0.3);if(p>0.15&&!catchBurstFlags.bite){burst(b.x,b.y,6,'foam',0.8,26,{gravity:0.05,drag:0.92,r0:0.6,r1:1.4});catchBurstFlags.bite=true;}}else if(ph.name==='pull'){catchRodBend=0.06+p*0.30;if(p>0.1&&!catchBurstFlags.pull){burst(b.x,b.y,14,'foam',1.6,34,{gravity:0.08,drag:0.93,r0:0.8,r1:2});catchBurstFlags.pull=true;}}else if(ph.name==='leap'){if(!catchBurstFlags.leap){burst(b.x,b.y,22,'foam',2.4,42,{gravity:0.1,drag:0.94,r0:1,r1:2.6});catchBurstFlags.leap=true;}catchRodBend=0.36-p*0.06;fishLift=p*0.5;fishAlpha=Math.min(1,p*3);}else if(ph.name==='reel'){catchRodBend=0.30-p*0.24;fishLift=0.5+p*0.5;fishAlpha=1;if(p>0.85&&!catchBurstFlags.reel){burst(rig.hand.x+10,rig.hand.y-30,16,'reflect',1.4,30,{gravity:-0.02,drag:0.95,r0:0.6,r1:1.6});catchBurstFlags.reel=true;}}else if(ph.name==='release'){catchRodBend=0.06*(1-p);fishLift=1;fishAlpha=1-p;}if(p>=1){catchElapsed=0;catchPhaseIdx++;if(catchPhaseIdx>=CATCH_PHASES.length){catchPhaseIdx=null;catchRodBend=0;fishAlpha=0;fishLift=0;nextCatchIn=16+Math.random()*22;}}}
function fishWorldPos(rig){const b=rig.bobber,target={x:rig.hand.x+18,y:rig.hand.y-6};const arc=Math.sin(Math.min(1,fishLift)*Math.PI)*38;return{x:b.x+(target.x-b.x)*Math.min(1,fishLift),y:b.y+(target.y-b.y)*Math.min(1,fishLift)-arc};}
function drawFish(pos){ctx.save();ctx.globalAlpha=Math.max(0,fishAlpha);ctx.translate(pos.x,pos.y);const wig=Math.sin(t*14)*0.15;ctx.rotate(wig-0.3);ctx.beginPath();ctx.moveTo(-9,0);ctx.quadraticCurveTo(-4,-5,5,0);ctx.quadraticCurveTo(-4,5,-9,0);ctx.closePath();ctx.fillStyle=pal('silhouette',1);ctx.fill();ctx.beginPath();ctx.moveTo(5,0);ctx.lineTo(11,-4);ctx.lineTo(11,4);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(-2,-1.5);ctx.lineTo(2,-3);ctx.strokeStyle=pal('reflect',0.8);ctx.lineWidth=0.6;ctx.stroke();ctx.restore();}
function drawBoatScene(rig){const{bx,by,rot,scale,hand,rodTip,bobber}=rig;ctx.save();ctx.translate(bx,by);ctx.rotate(rot);ctx.scale(scale,scale);const sil=pal('silhouette',1);ctx.fillStyle=sil;ctx.beginPath();ctx.moveTo(-95,0);ctx.quadraticCurveTo(-70,24,0,28);ctx.quadraticCurveTo(70,24,95,0);ctx.quadraticCurveTo(55,-10,0,-11);ctx.quadraticCurveTo(-55,-10,-95,0);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(-86,-3);ctx.quadraticCurveTo(0,-13,86,-3);ctx.strokeStyle=pal('reflect',0.45);ctx.lineWidth=1.3;ctx.stroke();ctx.beginPath();ctx.moveTo(-16,-9);ctx.bezierCurveTo(-18,-32,-6,-50,5,-52);ctx.bezierCurveTo(16,-50,17,-35,13,-25);ctx.bezierCurveTo(22,-21,24,-11,19,-7);ctx.bezierCurveTo(6,-11,-8,-11,-16,-9);ctx.closePath();ctx.fillStyle=sil;ctx.fill();ctx.beginPath();ctx.arc(7,-58,8.4,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(7,-64,10,3.2,0,0,7);ctx.fill();ctx.restore();ctx.beginPath();ctx.moveTo(hand.x,hand.y);const sag=4+Math.max(0,catchRodBend)*10;ctx.quadraticCurveTo((hand.x+rodTip.x)/2,(hand.y+rodTip.y)/2+sag*0.3,rodTip.x,rodTip.y);ctx.strokeStyle=sil;ctx.lineWidth=1.6;ctx.stroke();const lineEnd=fishAlpha>0.02?fishWorldPos(rig):bobber,slack=fishAlpha>0.02?2:10;ctx.beginPath();ctx.moveTo(rodTip.x,rodTip.y);ctx.quadraticCurveTo((rodTip.x+lineEnd.x)/2,(rodTip.y+lineEnd.y)/2+slack,lineEnd.x,lineEnd.y);ctx.strokeStyle=pal('reflect',0.55);ctx.lineWidth=0.8;ctx.stroke();if(fishAlpha>0.02){drawFish(lineEnd);}else{ctx.beginPath();ctx.arc(bobber.x,bobber.y,3+Math.sin(t*2)*0.6,0,7);ctx.strokeStyle=pal('reflect',0.25);ctx.lineWidth=0.6;ctx.stroke();}}
function drawSea(e,horizonY,rig){const skyGrad=ctx.createLinearGradient(0,0,0,horizonY);skyGrad.addColorStop(0,pal('skyTop'));skyGrad.addColorStop(0.55,pal('skyMid'));skyGrad.addColorStop(1,pal('skyBottom'));ctx.fillStyle=skyGrad;ctx.fillRect(0,0,W,horizonY+2);const starAlpha=Math.max(0,1-modeMix*1.7);if(starAlpha>0.01){stars.forEach(s=>{const tw=0.5+0.5*Math.sin(t*s.speed+s.phase);ctx.beginPath();ctx.arc(s.x*W,s.y*horizonY*0.9,s.r*(0.6+tw*0.6),0,7);ctx.fillStyle=pal('starColor',starAlpha*(0.35+tw*0.65)*s.baseA);ctx.fill();});}const bodyX=W*0.52+Math.sin(t*0.015)*W*0.02,bodyY=horizonY*0.26+Math.cos(t*0.011)*8,bodyR=Math.min(W,horizonY)*0.115+e.bass*7;const glow=ctx.createRadialGradient(bodyX,bodyY,bodyR*0.15,bodyX,bodyY,bodyR*6);glow.addColorStop(0,pal('bodyGlow',0.5+e.energy*0.22));glow.addColorStop(0.35,pal('bodyGlow',0.13));glow.addColorStop(1,pal('bodyGlow',0));ctx.fillStyle=glow;ctx.beginPath();ctx.arc(bodyX,bodyY,bodyR*6,0,7);ctx.fill();if(modeMix>0.15){ctx.save();ctx.globalAlpha=Math.min(1,(modeMix-0.15)/0.85)*0.22;ctx.strokeStyle=pal('bodyGlow');ctx.lineWidth=1;for(let i=0;i<10;i++){const ang=(i/10)*Math.PI*2+t*0.04;ctx.beginPath();ctx.moveTo(bodyX+Math.cos(ang)*bodyR*1.3,bodyY+Math.sin(ang)*bodyR*1.3);ctx.lineTo(bodyX+Math.cos(ang)*bodyR*3.4,bodyY+Math.sin(ang)*bodyR*3.4);ctx.stroke();}ctx.restore();}const bodyGrad=ctx.createRadialGradient(bodyX-bodyR*0.25,bodyY-bodyR*0.25,bodyR*0.1,bodyX,bodyY,bodyR);bodyGrad.addColorStop(0,pal('bodyCore'));bodyGrad.addColorStop(1,pal('body'));ctx.fillStyle=bodyGrad;ctx.beginPath();ctx.arc(bodyX,bodyY,bodyR,0,7);ctx.fill();if(modeMix<0.7){ctx.globalAlpha=(1-modeMix)*0.16;ctx.fillStyle=pal('skyMid');craters.forEach(c=>{ctx.beginPath();ctx.arc(bodyX+c.dx*bodyR,bodyY+c.dy*bodyR,c.r*bodyR,0,7);ctx.fill();});ctx.globalAlpha=1;}const fogGrad=ctx.createLinearGradient(0,horizonY-36,0,horizonY+22);fogGrad.addColorStop(0,pal('skyBottom',0));fogGrad.addColorStop(0.5,pal('skyBottom',0.3));fogGrad.addColorStop(1,pal('waterTop',0));ctx.fillStyle=fogGrad;ctx.fillRect(0,horizonY-36,W,58);const waterGrad=ctx.createLinearGradient(0,horizonY,0,H);waterGrad.addColorStop(0,pal('waterTop'));waterGrad.addColorStop(1,pal('waterBottom'));ctx.fillStyle=waterGrad;ctx.fillRect(0,horizonY-2,W,H-horizonY+2);drawReflection(bodyX,horizonY,e);drawWaveLayer(WAVE_LAYERS[0],e,horizonY);drawGlints();drawWaveLayer(WAVE_LAYERS[1],e,horizonY);drawBoatScene(rig);drawSparks();}
let lastFrameTime=performance.now();
function render(){const now=performance.now();let dt=(now-lastFrameTime)/1000;lastFrameTime=now;if(!isFinite(dt)||dt<=0)dt=1/60;dt=Math.min(dt,0.05);t+=dt*2.7;const e={bass:0.3,treble:0.2,energy:0.25};const horizonY=H*0.60,rig=computeRig(e,horizonY);updateCatch(dt,horizonY,e,rig);updateGlints(e,horizonY,dt);drawSea(e,horizonY,rig);requestAnimationFrame(render);}
initStars();resize();playing=true;render();
window.updateAudioLevels=function(levels){};
window.updateSensitivity=function(sens){};
window.setTheme=function(name){};
</script>
</body>
</html>
